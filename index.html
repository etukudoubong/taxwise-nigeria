*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}

/* ── LAYOUT — simple mobile scroll ── */
html,body{height:100%;margin:0;padding:0;overflow:hidden;background:#0B1628;}
#app{height:100%;display:flex;justify-content:center;background:#0B1628;}
#shell{
  width:100%;max-width:430px;
  height:100%;
  display:flex;flex-direction:column;
  background:#F0F4F8;
  overflow:hidden;
  position:relative;
}

/* Status bar — fixed height */
#sbar{flex:0 0 auto;background:#0B1628;padding:10px 18px 8px;display:flex;justify-content:space-between;z-index:5;}
.sb{font-size:11px;color:rgba(255,255,255,.7);font-weight:600;font-family:'DM Mono',monospace;}

/* Content — fills remaining space, scrolls */
#content{
  flex:1 1 auto;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior-y:contain;
  position:relative;
  /* thin scrollbar */
  scrollbar-width:thin;
  scrollbar-color:#CBD5E1 #F0F4F8;
}
#content::-webkit-scrollbar{width:5px;}
#content::-webkit-scrollbar-track{background:#F0F4F8;}
#content::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:5px;}

/* Root fills content */
#root{min-height:100%;}

/* Page — no longer needs to scroll itself */
.page{display:block;padding-bottom:80px;}

/* Bottom nav — fixed height at bottom */
#bnav{
  flex:0 0 auto;
  background:#fff;
  border-top:1px solid #E2E8F0;
  display:flex;
  padding:8px 0 max(14px,env(safe-area-inset-bottom));
  z-index:20;
  box-shadow:0 -2px 12px rgba(0,0,0,.06);
}
#bnav:empty{display:none;}
.nb{flex:1;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:2px 0;}
.ni{font-size:20px;}.nl{font-size:9px;font-weight:700;letter-spacing:.04em;}

/* Header */
.hdr{display:flex;align-items:center;padding:13px 14px 11px;border-bottom:1px solid #E2E8F0;background:#fff;position:sticky;top:0;z-index:10;box-shadow:0 1px 3px rgba(0,0,0,.04);}
.back{background:#F1F5F9;border:none;border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;margin-right:10px;flex-shrink:0;}
.htitle{font-size:16px;font-weight:700;color:#0F172A;flex:1;}

/* Cards */
.card{background:#fff;border-radius:14px;padding:14px;border:1px solid #E2E8F0;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
.ctitle{font-size:10px;font-weight:700;letter-spacing:.12em;color:#94A3B8;margin-bottom:10px;text-transform:uppercase;}

/* Form */
.fg{margin-bottom:13px;}
.lbl{font-size:10px;font-weight:700;color:#64748B;letter-spacing:.06em;display:block;margin-bottom:5px;text-transform:uppercase;}
.inp{width:100%;padding:11px 13px;border-radius:9px;border:1.5px solid #E2E8F0;font-size:14px;color:#0F172A;background:#fff;outline:none;transition:border-color .15s;}
.inp:focus{border-color:#3B82F6;}
.sel{width:100%;padding:11px 13px;border-radius:9px;border:1.5px solid #E2E8F0;font-size:14px;color:#0F172A;background:#fff;outline:none;appearance:none;}
.textarea{width:100%;padding:11px 13px;border-radius:9px;border:1.5px solid #E2E8F0;font-size:13px;color:#0F172A;background:#fff;outline:none;resize:none;line-height:1.5;}

/* Buttons */
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;transition:opacity .15s;}
.btn:active{opacity:.85;}
.btn:disabled{opacity:.45;cursor:default;}
.btn-blue{background:#1D4ED8;color:#fff;}
.btn-green{background:#059669;color:#fff;}
.btn-ghost{background:#F1F5F9;color:#475569;}
.btn-sm{padding:8px 14px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;border:none;}
.btn-sm-blue{background:#EFF6FF;color:#1D4ED8;border:1.5px solid #BFDBFE;}
.btn-sm-red{background:#FEF2F2;color:#DC2626;border:1px solid #FECACA;}

/* Pill */
.pill{display:inline-block;padding:2px 8px;border-radius:100px;font-size:10px;font-weight:700;}

/* Data row */
.drow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #F1F5F9;font-size:13px;}
.drow:last-child{border-bottom:none;}
.drow.tot{font-weight:700;font-size:14px;padding-top:10px;border-top:2px solid #E2E8F0;border-bottom:none;}

/* Info boxes */
.ibox{border-radius:10px;padding:11px 13px;margin-bottom:10px;}
.ibox.blue{background:#EFF6FF;border:1px solid #BFDBFE;}
.ibox.green{background:#F0FDF4;border:1px solid #BBF7D0;}
.ibox.amber{background:#FFFBEB;border:1px solid #FDE68A;}
.ibox.red{background:#FEF2F2;border:1px solid #FECACA;}
.ibox.slate{background:#F8FAFC;border:1px solid #E2E8F0;}
.ititle{font-size:11px;font-weight:700;margin-bottom:3px;}

/* Hero */
.hero-blue{background:linear-gradient(135deg,#0B1628,#1E3A5F);color:#fff;padding:22px 16px 26px;}
.hero-green{background:linear-gradient(135deg,#065F46,#059669);color:#fff;padding:22px 16px 26px;}

/* Tab row */
.tabs{display:flex;gap:5px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{padding:7px 14px;border-radius:100px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;border:1.5px solid transparent;transition:all .15s;}

/* Txn row */
.txr{background:#fff;border-radius:12px;padding:12px 13px;margin-bottom:7px;border:1px solid #E2E8F0;}
.txr-top{display:flex;align-items:flex-start;gap:10px;}
.txr-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}

/* Onboarding */
.onboard-hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 24px;text-align:center;background:linear-gradient(160deg,#0B1628 0%,#1E3A5F 50%,#0B1628 100%);}

/* Mode card */
.mode-card{background:#fff;border-radius:18px;padding:22px;border:2.5px solid #E2E8F0;cursor:pointer;transition:all .15s;margin-bottom:12px;}
.mode-card.selected{border-color:#1D4ED8;background:#EFF6FF;}
.mode-card:active{transform:scale(.98);}

/* Search */
.search-wrap{position:relative;margin-bottom:12px;}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#94A3B8;font-size:14px;}
.search{width:100%;padding:11px 13px 11px 36px;border-radius:9px;border:1.5px solid #E2E8F0;font-size:14px;color:#0F172A;background:#F8FAFC;outline:none;}
.search:focus{border-color:#3B82F6;background:#fff;}

/* Live dot */
.ldot{width:7px;height:7px;border-radius:50%;background:#4ADE80;display:inline-block;position:relative;}
.ldot::after{content:'';position:absolute;inset:-3px;border-radius:50%;border:2px solid rgba(74,222,128,.35);animation:ping 1.5s infinite;}

/* Quick chips */
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 12px;}
.chip{background:#EFF6FF;border:1px solid #BFDBFE;border-radius:20px;padding:7px 12px;font-size:11px;color:#1D4ED8;cursor:pointer;font-weight:600;}

/* Score ring */
.ring-wrap{position:relative;width:64px;height:64px;flex-shrink:0;}
.ring-wrap svg{transform:rotate(-90deg);}
.ring-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;}

/* Popup / modal overlay */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90;display:flex;align-items:flex-end;justify-content:center;}
.sheet{width:100%;max-width:430px;background:#fff;border-radius:22px 22px 0 0;padding:22px 20px max(24px,env(safe-area-inset-bottom));animation:slideUp .22s ease;}
.sheet-title{font-size:17px;font-weight:800;color:#0F172A;margin-bottom:6px;}
.sheet-sub{font-size:13px;color:#64748B;margin-bottom:18px;line-height:1.5;}

/* Compliance action buttons */
.ca-done{background:#F0FDF4;border:2px solid #059669;color:#059669;border-radius:11px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;width:100%;margin-bottom:8px;}
.ca-waive{background:#FFFBEB;border:2px solid #D97706;color:#D97706;border-radius:11px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;width:100%;margin-bottom:8px;}
.ca-later{background:#F8FAFC;border:2px solid #E2E8F0;color:#64748B;border-radius:11px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;width:100%;}

/* KIV badge */
.kiv-badge{background:#FEF3C7;border:1px solid #FDE68A;color:#92400E;border-radius:7px;padding:2px 8px;font-size:10px;font-weight:700;}

/* Data source cards */
.ds-card{background:#fff;border-radius:12px;padding:14px;border:2px solid #E2E8F0;margin-bottom:8px;cursor:pointer;transition:all .15s;}
.ds-card.active{border-color:#1D4ED8;background:#EFF6FF;}
.ds-check{width:22px;height:22px;border-radius:6px;border:2px solid #E2E8F0;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;}
.ds-check.on{background:#1D4ED8;border-color:#1D4ED8;}

/* Employee row */
.emp-row{background:#fff;border-radius:12px;padding:12px;border:1px solid #E2E8F0;margin-bottom:7px;}
.emp-name{font-size:13px;font-weight:700;color:#0F172A;}
.emp-role{font-size:11px;color:#94A3B8;margin-top:1px;}

/* Asset row */
.asset-row{background:#fff;border-radius:12px;padding:12px;border:1px solid #E2E8F0;margin-bottom:7px;}
.asset-name{font-size:13px;font-weight:700;color:#0F172A;}
.asset-meta{font-size:11px;color:#64748B;margin-top:2px;}

/* Eligibility step */
.elig-step{border-radius:12px;padding:14px;margin-bottom:10px;border:2px solid #E2E8F0;background:#fff;}
.elig-step.pass{border-color:#059669;background:#F0FDF4;}
.elig-step.fail{border-color:#DC2626;background:#FEF2F2;}

/* Edit highlight */
.txr-edit{position:absolute;top:8px;right:8px;background:#EFF6FF;border:1px solid #BFDBFE;border-radius:6px;padding:3px 8px;font-size:10px;color:#1D4ED8;font-weight:700;cursor:pointer;}

</style>

const PLANS = {

const AI_IMPORT_LIMITS = { trial:5, individual:10, company:30 };

const ROLES = {
  admin:       { label:"Admin",        desc:"Full access + manage users & billing" },
  accountant:  { label:"Accountant",   desc:"Full access except user management" },
  data_entry:  { label:"Data Entry",   desc:"Add transactions only" },
  view_only:   { label:"View Only",    desc:"Read-only access to all data" },
};

async function syncPull(userId){
  try {
    const [prof, txns, asst, emps, kiv_] = await Promise.all([
      sb.from("profiles").select("*").eq("id", userId).single(),
      sb.from("transactions").select("*").eq("user_id", userId),
      sb.from("assets").select("*").eq("user_id", userId),
      sb.from("employees").select("*").eq("user_id", userId),
      sb.from("kiv").select("*").eq("user_id", userId),
    ]);
    const store = JSON.parse(localStorage.getItem("taxwise_v1")||"{}");
    if(prof.data){
      store.profile = {
        ...store.profile,
        name: prof.data.name, tin: prof.data.tin,
        email: prof.data.email, phone: prof.data.phone,
        mode: prof.data.mode, empCategory: prof.data.emp_category,
        employerDeductions: prof.data.employer_deductions||{},
        companyName: prof.data.company_name,
        fixedAssets: prof.data.fixed_assets,
        isProfessional: prof.data.is_professional,
        sector: prof.data.sector, yearEnd: prof.data.year_end,
        dataSources: prof.data.data_sources||[],
        onboarded: prof.data.onboarded,
      };
    }
    if(txns.data) store.transactions = txns.data.map(t=>({
      id:t.id, date:t.txn_date, desc:t.txn_desc, amount:t.amount,
      type:t.txn_type, source:t.source, compliance_status:t.compliance_status
    }));
    if(asst.data) store.assets = asst.data;
    if(emps.data) store.employees = emps.data;
    if(kiv_.data) store.kiv = kiv_.data.map(k=>({
      id:k.id, date:k.kiv_date, desc:k.kiv_desc, amount:k.amount,

async function syncPush(userId, store){
  try {
    const p = store.profile||{};
    await sb.from("profiles").upsert({
      id: userId,
      name: p.name, tin: p.tin, email: p.email, phone: p.phone,
      mode: p.mode||"individual", emp_category: p.empCategory||"B",
      employer_deductions: p.employerDeductions||{},
      company_name: p.companyName, fixed_assets: p.fixedAssets||0,
      is_professional: p.isProfessional||false,
      sector: p.sector, year_end: p.yearEnd,
      data_sources: p.dataSources||[],
      onboarded: p.onboarded||false,
      updated_at: new Date().toISOString(),
    });
    if((store.transactions||[]).length){
      await sb.from("transactions").upsert(
        store.transactions.map(t=>({
          id:t.id, user_id:userId,
          txn_date:t.date, txn_desc:t.desc, amount:t.amount,
          txn_type:t.type, source:t.source||"manual",
          compliance_status:t.compliance_status||"pending"
        }))
      );
    }
    if((store.assets||[]).length){
      await sb.from("assets").upsert(
        store.assets.map(a=>({...a, user_id:userId}))
      );
    }
    if((store.employees||[]).length){
      await sb.from("employees").upsert(
        store.employees.map(e=>({...e, user_id:userId}))
      );
    }
    if((store.kiv||[]).length){
      await sb.from("kiv").upsert(
        store.kiv.map(k=>({
          id:k.id, user_id:userId,
          kiv_date:k.date, kiv_desc:k.desc, amount:k.amount,
          wht_rate:k.wht_rate, wht_amount:k.wht_amount, status:k.status||"pending"
        }))
      );
    }
    return true;
  } catch(e){ console.warn("Sync push failed:", e); return false; }
}

function pitBands(taxable){
  const bands=[[800000,0],[2000000,.15],[2200000,.18],[3000000,.21],[4000000,.23],[Infinity,.25]];
  let tax=0,rem=Math.max(0,taxable);
  for(const[lim,rate]of bands){if(rem<=0)break;const c=Math.min(rem,lim);tax+=c*rate;rem-=c;}
  return tax;
}

function computePIT(p){
  if(typeof p==="number"){
    if(p/12<=70000)return{annual:0,monthly:0,eff:0,exempt:true};
    const t=pitBands(Math.max(0,p-p*.08));
    return{annual:t,monthly:t/12,eff:p?(t/p)*100:0,exempt:false};
  }
  const{
    category="A", monthlyIncome=0, payeDeducted=0, otherIncome=0,
    rentPaid=0,            // S.30(2)(a)(vi) 20% of annual rent, max 500k
    nhfAnnual=0,           // S.30(2)(a)(i)  NHF contributions
    nhisAnnual=0,          // S.30(2)(a)(ii) NHIS contributions
    pensionAnnual=0,       // S.30(2)(a)(iii) employee pension 8%
    lifeInsAnnual=0,       // S.30(2)(a)(v)  life insurance premiums
    housingLoanInterest=0, // S.30(2)(a)(iv) interest on owner-occupied housing loan
  }=p;
  const annual=monthlyIncome*12, total=annual+otherIncome;
  if(category==="E"||monthlyIncome<=70000&&otherIncome===0)
    return{annual:0,monthly:0,eff:0,exempt:true,totalGross:total,payeCredit:payeDeducted*12,balanceDue:0,refund:payeDeducted*12};
  const rentRelief        = Math.min(rentPaid*.2, 500000);
  const pensionDeduction  = pensionAnnual>0 ? pensionAnnual : annual*.08;
  const nhfDeduction      = nhfAnnual;
  const nhisDeduction     = nhisAnnual;
  const lifeInsDeduction  = lifeInsAnnual;
  const housingDeduction  = housingLoanInterest;
  const totalDeductions   = pensionDeduction+nhfDeduction+nhisDeduction+lifeInsDeduction+housingDeduction+rentRelief;
  const taxable = Math.max(0, total-totalDeductions);
  const tax     = pitBands(taxable);
  const bal     = tax-(payeDeducted*12);
  return{
    annual:tax, monthly:tax/12, eff:total?(tax/total)*100:0, exempt:false,
    totalGross:total, taxable,
    payeCredit:payeDeducted*12, balanceDue:Math.max(0,bal), refund:Math.max(0,-bal),
    category, rentRelief, pensionDeduction, nhfDeduction, nhisDeduction,
    lifeInsDeduction, housingDeduction, totalDeductions,
  };
}

function computeCIT(profit,turnover,assets=0,isPro=false){
  const isSmall=turnover<=50e6&&assets<=250e6&&!isPro;
  const cit=isSmall?0:profit*.30;
  const dev=isSmall?0:profit*.04;
  const minETR=turnover>=20e9?Math.max(0,profit*.15-cit-dev):0;
  const total=cit+dev+minETR;
  return{isSmall,tier:isSmall?"Small Company (0%)":"Standard (30%+4%)",
    cit,dev,minETR,total,eff:profit?(total/profit)*100:0};
}

function computeWHT(amount,type){
  const r={dividend:.10,interest:.10,rent:.10,royalty:.10,professional:.10,
    consultancy:.10,management:.10,technical:.10,commission:.10,director:.10,
    contract:.05,construction:.05}[type]||.10;
  return{wht:amount*r,net:amount*(1-r),rate:r*100};
}

function computeVAT(amount,tier="standard"){
  if(tier==="exempt")return{vat:0,total:amount,tier:"EXEMPT",canClaim:false,rate:0};
  if(tier==="zero") return{vat:0,total:amount,tier:"ZERO-RATED",canClaim:true,rate:0};
  return{vat:amount*.075,total:amount*1.075,tier:"STANDARD",canClaim:true,rate:7.5};
}

function computeCA(cost,cls,years=1){
  const rates={building:.10,masts:.10,heavy:.10,agric:.10,plant:.20,
    furniture:.20,mining:.20,vehicle:.25,software:.25,intangible:.25,other:.25};
  const rate=rates[cls]||.20;
  const residual=cost*.01;
  const annual=cost*rate;
  const maxYrs=Math.floor((cost-residual)/annual);
  const effective=annual*Math.min(years,maxYrs);
  const twdv=Math.max(residual,cost-effective);
  return{annual,effective,twdv,residual,rate:rate*100,maxYrs};
}

function computeCGT({
  assetType="other",
  isCompany=false,
  isSmallCompany=false,
  proceeds=0,
  cost=0,
  caWasClaimed=false,
  twdv=0,
  otherAnnualIncome=0,
  reinvestedInNigeria=false,
  sharesSaleInYear=0,
  sharesGain=0,
}={}){
  const costBase = caWasClaimed ? twdv : cost;
  const gain = Math.max(0, proceeds - costBase);
  if(reinvestedInNigeria)
    return{gain,tax:0,rate:0,exempt:true,exemptReason:"Reinvestment in Nigerian company - fully exempt [NTA 2025 S.34]",costBase};
  if(assetType==="principal_residence"&&!isCompany)
    return{gain,tax:0,rate:0,exempt:true,exemptReason:"Principal private residence - exempt [NTA 2025 S.34]",costBase};
  if(assetType==="vehicle"&&!isCompany)
    return{gain,tax:0,rate:0,exempt:true,exemptReason:"Personal vehicle (up to 2) - exempt [NTA 2025 S.34]",costBase};
  if(assetType==="chattel"&&proceeds<=5000000)
    return{gain,tax:0,rate:0,exempt:true,exemptReason:"Personal chattel proceeds below N5m - exempt [NTA 2025 S.32]",costBase};
  if((assetType==="shares_listed"||assetType==="shares_unlisted")&&sharesSaleInYear<=150000000&&sharesGain<=10000000)
    return{gain,tax:0,rate:0,exempt:true,exemptReason:"Share disposal below N150m proceeds & N10m gain in 12 months - exempt [NTA 2025 S.45]",costBase};
  if(!isCompany&&gain<=50000000)
    return{gain,tax:0,rate:0,exempt:true,exemptReason:"Gain within N50m individual exemption threshold [NTA 2025 S.34]",costBase};
  if(isCompany&&isSmallCompany)
    return{gain,tax:0,rate:0,exempt:true,exemptReason:"Small company - exempt from CGT [NTA 2025 S.202]",costBase};
  if(isCompany){
    const tax=gain*0.30;
    return{gain,tax,rate:30,exempt:false,exemptReason:null,costBase,tier:"30% (Company Rate)"};
  }
  const taxableGain=Math.max(0,gain-50000000);
  const totalIncome=otherAnnualIncome+taxableGain;
  const taxOnTotal=pitBands(totalIncome);
  const taxOnOther=pitBands(otherAnnualIncome);
  const taxOnGain=Math.max(0,taxOnTotal-taxOnOther);
  const effectiveRate=taxableGain>0?(taxOnGain/taxableGain)*100:0;
  return{gain,taxableGain,tax:taxOnGain,rate:effectiveRate,exempt:false,exemptReason:null,costBase,
    tier:"Progressive PIT rate (~"+effectiveRate.toFixed(1)+"%)",totalIncomeForBanding:totalIncome};
}

function computePenalty(tax,days,isCompany=false){
  if(days<=0)return{filing:0,interest:0,total:0,totalPayable:tax};
  const first=isCompany?250000:50000;
  const monthly=isCompany?50000:25000;
  const extra=Math.max(0,Math.ceil(days/30)-1);
  const filing=first+extra*monthly;
  const interest=tax*(0.4175/365)*days;
  return{filing,interest,total:filing+interest,totalPayable:tax+filing+interest};
}

function getDaysLeft(type){
  const now = new Date();
  now.setHours(0,0,0,0);
  const y = now.getFullYear(), m = now.getMonth(), d = now.getDate();

  const thisMonthDeadlines = {
    PAYE:   new Date(y, m, 10),
    VAT:    new Date(y, m, 21),
    WHT:    new Date(y, m, 21),
    PIT:    new Date(y, 6, 31),   // July 31
    CIT:    new Date(y, 5, 30),   // June 30 (6 months after Dec year end)
    ANNUAL: new Date(y, 0, 31),   // Jan 31
  };

  let deadline = thisMonthDeadlines[type] || thisMonthDeadlines.PAYE;

  if(["PAYE","VAT","WHT"].includes(type) && deadline < now){
    const next = new Date(y, m+1, type==="PAYE"?10:21);
    deadline = next;
  }

  return Math.ceil((deadline - now) / 86400000);
}

  if(d.match(/electricity|utility|water|internet|telephone|fuel|diesel|insurance|repair|maintenance|stationery|office supplies|printing|cleaning/))
    return{head:"Overhead",icon:"⚡",color:C.slate,compliance_required:false,
      obligation:"Deductible business expense under NTA 2025 Sec 20 if wholly and exclusively for business. Keep receipts.",
      law:"NTA 2025, Sec 20"};

  return{head:"Expense",icon:"💸",color:C.slate,compliance_required:false,
    obligation:"Deductible business expense if wholly and exclusively incurred for business purposes. Keep receipts for NRS audit.",

function computeAggregates(txns){
  let income=0, expenses=0;
  let vatOut=0, vatIn=0, whtIn=0, whtOut=0, payeIn=0, payeOut=0;

  const schedules={
    whtOut:[],    // WHT you must deduct & remit
    whtIn:[],     // WHT deducted from your income (credit)
    vatOut:[],    // Output VAT on your sales
    vatIn:[],     // Input VAT on your purchases
    payeOut:[],   // PAYE you must deduct & remit
    payeIn:[],    // PAYE deducted from your salary (credit)
    cgtEvents:[],  // CGT-flagged asset disposal transactions
  };

  for(const t of txns){
    if(t.compliance_status==="kiv") continue; // KIV items not yet posted
    const r=classifyTxn(t.desc, t.type);

    if(t.type==="income"){
      income+=t.amount;
      if(["WHT","WHT+VAT","Zero-VAT"].some(h=>r.head.startsWith(h.split("+")[0]))||r.head==="WHT"){
        const wht=r.wht_amount_fn?r.wht_amount_fn(t.amount):t.amount*.10;
        if(wht>0){
          whtIn+=wht;
          schedules.whtIn.push({id:t.id,date:t.date,desc:t.desc,gross:t.amount,tax:wht,rate:"10%",type:"WHT Credit",law:"NTA 2025 Ch.Two Pt.IV"});
        }
      }
      if(r.head==="VAT+CIT"||r.head==="WHT+VAT"){
        const vat=t.amount*.075;
        vatOut+=vat;
        schedules.vatOut.push({id:t.id,date:t.date,desc:t.desc,gross:t.amount,tax:vat,rate:"7.5%",type:"Output VAT",law:"NTA 2025 Ch.Four Sec 52"});
      }
      if(r.head==="PAYE"){
        const paye=t.amount*.15; // estimated at 15%
        payeIn+=paye;
        schedules.payeIn.push({id:t.id,date:t.date,desc:t.desc,gross:t.amount,tax:paye,rate:"~15%",type:"PAYE Credit",law:"TAA 2025 Sec 13"});
      }
      if(r.head==="CGT-EVENT"){
        schedules.cgtEvents.push({id:t.id,date:t.date,desc:t.desc,gross:t.amount,tax:0,rate:"CGT — check calculator",type:"Asset Disposal",status:t.compliance_status||"pending",law:"NTA 2025 S.34-S.46"});
      }
    } else {
      expenses+=t.amount;
      if(r.compliance_required && r.head.startsWith("WHT-out") && r.wht_rate){
        const wht=t.amount*(r.wht_rate/100);
        const net=t.amount-wht;
        whtOut+=wht;
        schedules.whtOut.push({id:t.id,date:t.date,desc:t.desc,gross:t.amount,tax:wht,net,rate:r.wht_rate+"%",type:r.head,status:t.compliance_status||"pending",law:r.law});
      }
      if(r.head==="PAYE-out"){
        const paye=t.amount*.15; // estimated; payroll engine gives exact
        payeOut+=paye;
        schedules.payeOut.push({id:t.id,date:t.date,desc:t.desc,gross:t.amount,tax:paye,rate:"~15%",type:"PAYE",status:t.compliance_status||"pending",law:"TAA 2025 Sec 13"});
      }
      if(r.head==="Overhead"||r.head==="Expense"){
        if(t.desc.toLowerCase().match(/purchase|bought|supplies|stock|inventory|material/)){
          const vat=t.amount*.075;
          vatIn+=vat;
          schedules.vatIn.push({id:t.id,date:t.date,desc:t.desc,gross:t.amount,tax:vat,rate:"7.5%",type:"Input VAT",law:"NTA 2025 Ch.Four Sec 59"});
        }
      }
    }
  }

  const vatNet=vatOut-vatIn;
  return{
    income, expenses, net:income-expenses,
    vatOut, vatIn, vatNet, vatPayable:Math.max(0,vatNet), vatRefund:Math.max(0,-vatNet),
    whtIn, whtOut, payeIn, payeOut, cgtEvents:schedules.cgtEvents.length,
    estCIT:Math.max(0,income-expenses)*.30,
    schedules,  // line-by-line breakdown per tax head
    txnCount:txns.length,
  };
}

function computeTurnover(txns){
  return txns.filter(t=>t.type==="income"&&t.compliance_status!=="kiv").reduce((s,t)=>s+t.amount,0);
}

function computePayroll(employee){
  const{grossMonthly=0,pensionPct=8,employerPensionPct=10,nhfPct=2.5,nhisMonthly=0,lifeInsurance=0}=employee;
  const annualGross=grossMonthly*12;

  if(grossMonthly<=70000) return{...employee,paye:0,pensionEmployee:0,nhf:0,nhis:nhisMonthly,netPay:grossMonthly,exempt:true,employerPension:0,total_employer_cost:grossMonthly};

  const pensionEmployee=grossMonthly*(pensionPct/100);
  const nhf=grossMonthly*(nhfPct/100);
  const totalEmployeeDeductions=pensionEmployee+nhf+nhisMonthly+lifeInsurance;

  const taxableAnnual=Math.max(0,annualGross-totalEmployeeDeductions*12);
  const annualPAYE=pitBands(taxableAnnual);
  const monthlyPAYE=annualPAYE/12;

  const employerPension=grossMonthly*(employerPensionPct/100);
  const totalEmployerCost=grossMonthly+employerPension;

  const netPay=grossMonthly-pensionEmployee-nhf-nhisMonthly-lifeInsurance-monthlyPAYE;

  return{
    ...employee,
    annualGross,
    pensionEmployee,     // 8% of gross — employee contribution
    employerPension,     // 10% of gross — employer contribution
    nhf,                 // 2.5% of gross — National Housing Fund
    nhis:nhisMonthly,    // Fixed monthly NHIS
    lifeInsurance,
    paye:monthlyPAYE,
    annualPAYE,
    totalEmployeeDeductions,
    netPay,
    totalEmployerCost,
    exempt:false,
    effectiveRate:annualGross?(annualPAYE/annualGross)*100:0,
  };
}

function computeAssetCA(asset){
  const cls=CA_CLASSES.find(c=>c.code===asset.assetClass)||CA_CLASSES[10];
  const cost=asset.cost||0;
  const residual=cost*.01;
  const annual=cost*cls.rate;
  const maxYrs=Math.floor((cost-residual)/annual)||1;
  const years=asset.yearsHeld||1;
  const effective=annual*Math.min(years,maxYrs);
  const twdv=Math.max(residual,cost-effective);
  return{...asset,assetLabel:cls.label,rate:cls.rate*100,annual,effective,twdv,residual,maxYrs};
}

function JournalScreen({txns,setTxns,kiv,setKiv,onNav}){
  const[filter,setFilter]=useState("all");
  const[showAdd,setShowAdd]=useState(false);
  const[newTxn,setNewTxn]=useState({desc:"",amount:"",type:"income",date:today()});
  const[pendingTxn,setPendingTxn]=useState(null);  // awaiting compliance popup
  const[editTxn,setEditTxn]=useState(null);         // for edit screen
  const agg=computeAggregates(txns);
  const kivTxns=kiv||[];

  const tryPost=(txn)=>{
    const rule=classifyTxn(txn.desc,txn.type);
    if(rule.compliance_required){
      const wht = rule.wht_amount_fn ? rule.wht_amount_fn(txn.amount) : 0;
      const net = txn.amount - wht;
      const prompt = (rule.compliance_prompt||rule.obligation)
        .replace('{wht}', wht.toLocaleString('en-NG',{maximumFractionDigits:0}))
        .replace('{net}', net.toLocaleString('en-NG',{maximumFractionDigits:0}))
        .replace('{amount}', txn.amount.toLocaleString('en-NG',{maximumFractionDigits:0}));
      setPendingTxn({...txn, compliance_rule:{...rule,prompt}, compliance_flag:prompt, wht, net});
    } else {
      setTxns(prev=>[...prev,{...txn,compliance_status:"na"}]);
      setShowAdd(false);
      setNewTxn({desc:"",amount:"",type:"income",date:today()});
    }
  };

  const onComplianceDone=()=>{
    setTxns(prev=>[...prev,{...pendingTxn,compliance_status:"done"}]);
    setPendingTxn(null);setShowAdd(false);setNewTxn({desc:"",amount:"",type:"income",date:today()});
  };
  const onComplianceWaive=()=>{
    setTxns(prev=>[...prev,{...pendingTxn,compliance_status:"waived"}]);
    setPendingTxn(null);setShowAdd(false);setNewTxn({desc:"",amount:"",type:"income",date:today()});
  };
  const onComplianceLater=()=>{
    setKiv(prev=>[...prev,{...pendingTxn,compliance_status:"kiv"}]);
    setPendingTxn(null);setNewTxn({desc:"",amount:"",type:"income",date:today()});setShowAdd(false);
  };
  const onPostKIV=(id,status)=>{
    const t=kivTxns.find(k=>k.id===id);
    if(t){setTxns(prev=>[...prev,{...t,compliance_status:status}]);}
    setKiv(prev=>prev.filter(k=>k.id!==id));
  };

  const addTxn=()=>{
    if(!newTxn.desc||!newTxn.amount)return;
    const t={id:Date.now(),date:newTxn.date,desc:newTxn.desc.trim(),amount:parseFloat(newTxn.amount)||0,type:newTxn.type,source:"manual"};
    tryPost(t);
  };

  const onEditTxn=(txn)=>setEditTxn(txn);
  const onSaveEdit=(updated)=>{
    setTxns(prev=>prev.map(t=>t.id===updated.id?updated:t));
    setEditTxn(null);
  };
  const onDeleteTxn=(id)=>{
    setTxns(prev=>prev.filter(t=>t.id!==id));
    setEditTxn(null);
  };

  if(editTxn) return <TxnEditScreen txn={editTxn} onSave={onSaveEdit} onDelete={onDeleteTxn} onBack={()=>setEditTxn(null)}/>;

  const excludedTxns = txns.filter(t=>t.compliance_status==="excluded");
  const activeTxns = txns.filter(t=>t.compliance_status!=="excluded");
  const filtered = filter==="excluded" ? [] :
    filter==="all" ? activeTxns :
    filter==="kiv" ? [] :
    filter==="cgt" ? activeTxns.filter(t=>classifyTxn(t.desc,t.type).head==="CGT-EVENT") :
    activeTxns.filter(t=>t.type===filter||classifyTxn(t.desc,t.type).head.toLowerCase().includes(filter));

  return(
    <div style={{paddingBottom:80}}>
      {/* IMPROVEMENT 6 — Compliance popup */}
      {pendingTxn&&<CompliancePopup txn={pendingTxn} rule={pendingTxn.compliance_rule} onDone={onComplianceDone} onWaive={onComplianceWaive} onLater={onComplianceLater} onNav={onNav}/>}
      <div style={{background:`linear-gradient(135deg,${C.navy},#1E3A5F)`,padding:"20px 14px 22px",color:"#fff"}}>
        <div style={{fontSize:10,opacity:.6,letterSpacing:".1em",fontWeight:700,marginBottom:4}}>TRANSACTION JOURNAL</div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end"}}>
          <div>
            <div style={{fontSize:10,opacity:.65}}>Total Income</div>
            <div style={{fontSize:22,fontWeight:700,color:"#4ADE80"}}>{fmt(agg.income)}</div>
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{fontSize:10,opacity:.65}}>Total Expenses</div>
            <div style={{fontSize:22,fontWeight:700,color:"#F87171"}}>{fmt(agg.expenses)}</div>
          </div>
        </div>
      </div>

      <div style={{padding:"10px 12px 0",display:"flex",gap:8}}>
        <button className="btn-sm btn-sm-blue" style={{flex:1}} onClick={()=>setShowAdd(!showAdd)}>+ Add Entry</button>
        <button className="btn-sm btn-sm-blue" style={{flex:1}} onClick={()=>onNav("upload")}>📄 CSV Upload</button>
        <button className="btn-sm btn-sm-blue" style={{flex:1}} onClick={()=>onNav("taxsummary")}>📊 Tax Summary</button>
      </div>

      {showAdd&&(
        <div className="pad" style={{marginTop:10}}>
          <div className="card">
            <div className="ctitle">ADD TRANSACTION</div>
            <div style={{display:"flex",gap:8,marginBottom:12}}>
              {["income","expense"].map(t=>(
                <button key={t} onClick={()=>setNewTxn(n=>({...n,type:t}))} style={{
                  flex:1,padding:9,border:`2px solid ${newTxn.type===t?(t==="income"?C.green:C.red):C.border}`,
                  background:newTxn.type===t?(t==="income"?C.greenBg:C.redBg):"#fff",
                  borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:700,fontFamily:"inherit",
                  color:newTxn.type===t?(t==="income"?C.green:C.red):C.muted,
                }}>{t==="income"?"💰 Income":"💸 Expense"}</button>
              ))}
            </div>
            <div className="fg">
              <label className="lbl">DESCRIPTION</label>
              <input className="inp" value={newTxn.desc} onChange={e=>setNewTxn(n=>({...n,desc:e.target.value}))} placeholder="e.g. Consulting fee from ABC Ltd"/>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}}>
              <div className="fg" style={{marginBottom:0}}>
                <label className="lbl">AMOUNT (₦)</label>
                <input className="inp" type="number" value={newTxn.amount} onChange={e=>setNewTxn(n=>({...n,amount:e.target.value}))} placeholder="0"/>
              </div>
              <div className="fg" style={{marginBottom:0}}>
                <label className="lbl">DATE</label>
                <input className="inp" type="date" value={newTxn.date} onChange={e=>setNewTxn(n=>({...n,date:e.target.value}))}/>
              </div>
            </div>
            {newTxn.desc.length>3&&(()=>{
              const r=classifyTxn(newTxn.desc,newTxn.type);
              const needsAction=["WHT-out","PAYE-out"].includes(r.head);
              const isCGTEvent=r.head==="CGT-EVENT";
              return(
                <div style={{marginBottom:10,background:isCGTEvent?"#EDE9FE":needsAction?"#FFFBEB":"#EFF6FF",
                  border:`1px solid ${isCGTEvent?"#C4B5FD":needsAction?"#FDE68A":"#BFDBFE"}`,borderRadius:8,padding:"10px 12px"}}>
                  <div className="ititle" style={{color:isCGTEvent?"#7C3AED":needsAction?C.amber:C.blue}}>
                    {r.icon} {r.head} {needsAction&&"⚠ Compliance action required"}{isCGTEvent&&"⚠ Possible CGT event"}
                  </div>
                  <div style={{fontSize:11,color:C.ink,lineHeight:1.5}}>{r.obligation}</div>
                </div>
              );
            })()}
            <button className="btn btn-blue" onClick={addTxn} disabled={!newTxn.desc||!newTxn.amount}>Save Transaction</button>
          </div>
        </div>
      )}

      <div className="tabs" style={{padding:"10px 12px 0"}}>
        {["all","income","expense","vat","wht","paye","cgt","kiv","excluded"].map(f=>{
          const excCount = txns.filter(t=>t.compliance_status==="excluded").length;
          return(
            <button key={f} className="tab" onClick={()=>setFilter(f)} style={{
              background:filter===f?(f==="excluded"?"#DC2626":C.blue):"#fff",
              color:filter===f?"#fff":f==="excluded"?"#DC2626":C.slate,
              borderColor:filter===f?(f==="excluded"?"#DC2626":C.blue):f==="excluded"?"#FCA5A5":C.border,
            }}>
              {f==="kiv"?`⏸ KIV${kivTxns&&kivTxns.length>0?` (${kivTxns.length})`:""}`
               :f==="cgt"?"📊 CGT"
               :f==="excluded"?`✗ Excluded${excCount>0?` (${excCount})`:""}`
               :f.toUpperCase()}
            </button>
          );
        })}
      </div>

      <div className="pad" style={{paddingTop:10}}>
        {filter==="excluded"?(
          excludedTxns.length===0?(
            <div style={{textAlign:"center",padding:"48px 20px",color:C.muted}}>
              <div style={{fontSize:40,marginBottom:12}}>✓</div>
              <div style={{fontSize:16,fontWeight:700,color:C.ink,marginBottom:6}}>No excluded transactions</div>
              <div style={{fontSize:13}}>All imported transactions are included in your journal.</div>
            </div>
          ):(
            <>
              <div style={{background:"#FEF2F2",border:"1px solid #FECACA",borderRadius:12,
                padding:"12px 14px",marginBottom:12}}>
                <div style={{fontSize:13,fontWeight:700,color:"#DC2626",marginBottom:4}}>
                  ✗ {excludedTxns.length} Excluded Transaction{excludedTxns.length!==1?"s":""}
                </div>
                <div style={{fontSize:12,color:"#7F1D1D",lineHeight:1.6}}>
                  These transactions were excluded from your tax computation during import
                  based on NTA 2025 classification rules. They are retained here for
                  reference and audit purposes. You can reinstate any transaction if you
                  believe the classification is incorrect.
                </div>
              </div>

              {(()=>{
                // Group by reason/taxStream
                const groups = {};
                excludedTxns.forEach(t=>{
                  const key = t.taxStream||t.autoRule||"other";
                  if(!groups[key]) groups[key]=[];
                  groups[key].push(t);
                });

                const groupMeta = {
                  drawings:    {label:"Owner Drawings / Personal Withdrawals", icon:"💸", color:"#DC2626", bg:"#FEF2F2", border:"#FECACA",
                    reason:"Drawings are a withdrawal of capital by the owner, not a business expense. Not deductible under NTA 2025 S.20 (wholly-and-exclusively test)."},
                  personal:    {label:"Personal Expenditure", icon:"🏠", color:"#92400E", bg:"#FFFBEB", border:"#FDE68A",
                    reason:"Personal expenses fail the wholly-and-exclusively-for-business test under NTA 2025 S.20(2). Only expenses incurred for the purpose of the trade are deductible."},
                  stamp_duty:  {label:"Stamp Duty / Government Levies", icon:"🏛", color:"#1E40AF", bg:"#EFF6FF", border:"#BFDBFE",
                    reason:"Stamp Duty is a statutory government levy, not a business expense. Non-deductible for all taxpayers under the Stamp Duties Act and Finance Act 2020."},
                  loan:        {label:"Loan Receipts / Capital Transfers", icon:"🏦", color:"#166534", bg:"#F0FDF4", border:"#BBF7D0",
                    reason:"Loan receipts are a liability, not income. They do not form part of taxable revenue under NTA 2025. Loan principal repayments are balance sheet movements, not deductible expenses."},
                  employment:  {label:"Employment Income (PAYE)", icon:"💼", color:"#5B21B6", bg:"#F5F3FF", border:"#DDD6FE",
                    reason:"Salary income is taxed via PAYE at source by your employer (Cat A). It is not re-taxed as part of your self-assessment return to avoid double taxation."},
                  bank_charge: {label:"Non-Deductible Bank Charges", icon:"🏧", color:"#374151", bg:"#F9FAFB", border:"#E5E7EB",
                    reason:"Bank charges on personal accounts fail the wholly-and-exclusively test. For individuals, account maintenance fees, SMS charges, and transfer fees are personal overhead costs, not deductible business expenses."},
                };

                return Object.entries(groups).map(([key, txnGroup])=>{
                  const meta = groupMeta[key]||{
                    label: key.replace(/_/g," ").replace(/\w/g,c=>c.toUpperCase()),
                    icon:"📋", color:C.slate, bg:C.slate+"10", border:C.border,
                    reason: txnGroup[0]?.autoRule||"Excluded during import based on tax classification rules.",
                  };
                  const groupTotal = txnGroup.reduce((s,t)=>s+t.amount,0);
                  return(
                    <div key={key} style={{marginBottom:16}}>
                      <div style={{background:meta.bg,border:`1px solid ${meta.border}`,
                        borderRadius:12,padding:"12px 14px",marginBottom:8}}>
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:6}}>
                          <div style={{display:"flex",gap:8,alignItems:"center"}}>
                            <span style={{fontSize:18}}>{meta.icon}</span>
                            <div style={{fontSize:13,fontWeight:700,color:meta.color}}>{meta.label}</div>
                          </div>
                          <div style={{fontSize:12,fontWeight:700,color:meta.color,flexShrink:0}}>
                            {txnGroup.length} item{txnGroup.length!==1?"s":""} · {fmt(groupTotal)}
                          </div>
                        </div>
                        <div style={{fontSize:11,color:meta.color,opacity:.8,lineHeight:1.6,
                          padding:"8px 10px",background:"rgba(0,0,0,.04)",borderRadius:8}}>
                          <strong>Why excluded:</strong> {meta.reason}
                        </div>
                      </div>

                      {txnGroup.map(t=>(
                        <div key={t.id} style={{background:"#fff",border:`1px solid ${C.border}`,
                          borderRadius:10,padding:"10px 12px",marginBottom:6,
                          display:"flex",gap:10,alignItems:"flex-start",opacity:.8}}>
                          <div style={{flex:1,minWidth:0}}>
                            <div style={{fontSize:12,fontWeight:600,color:C.ink,marginBottom:3,lineHeight:1.3}}>{t.desc}</div>
                            <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
                              <span style={{fontSize:10,color:C.muted}}>{t.date}</span>
                              <span style={{fontSize:12,fontWeight:700,
                                color:t.type==="income"?C.green:C.red}}>
                                {t.type==="income"?"+":"-"}{fmt(t.amount)}
                              </span>
                              {t.autoRule&&(
                                <span style={{fontSize:9,background:"#F1F5F9",color:C.slate,
                                  padding:"2px 7px",borderRadius:100,fontWeight:600}}>
                                  {t.autoRule.slice(0,50)}
                                </span>
                              )}
                            </div>
                          </div>
                          <button
                            onClick={()=>{
                              setTxns(prev=>prev.map(x=>x.id===t.id
                                ?{...x,compliance_status:"pending",included:true,taxAllowable:true}
                                :x
                              ));
                            }}
                            style={{flexShrink:0,padding:"6px 10px",background:C.greenBg,
                              border:`1px solid ${C.green}40`,borderRadius:8,
                              color:C.green,fontSize:10,fontWeight:700,cursor:"pointer",
                              fontFamily:"inherit",whiteSpace:"nowrap"}}>
                            Reinstate
                          </button>
                        </div>
                      ))}
                    </div>
                  );
                });
              })()}

              <div style={{textAlign:"center",padding:"12px 0",fontSize:11,color:C.muted}}>
                Reinstated transactions move to your active journal and are included in tax computations.
              </div>
            </>
          )
        ):filter==="kiv"?(
          kivTxns&&kivTxns.length>0?(
            <>
              <div className="ibox amber">
                <div className="ititle" style={{color:C.amber}}>⏸ Keep-in-View — Pending compliance action</div>
                <p style={{fontSize:12,color:C.ink}}>These transactions were held because a compliance action was required. Select DONE or WAIVE on each to post them to your journal.</p>
              </div>
              {kivTxns.map(t=>(
                <div key={t.id} style={{background:"#fff",borderRadius:12,padding:13,border:"2px solid #FDE68A",marginBottom:8}}>
                  <div style={{display:"flex",alignItems:"flex-start",gap:10}}>
                    <span className="kiv-badge">KIV</span>
                    <div style={{flex:1}}>
                      <div style={{fontSize:13,fontWeight:600,color:C.ink}}>{t.desc}</div>
                      <div style={{fontSize:11,color:C.muted,marginTop:1}}>{fmtD(t.date)} · {fmt(t.amount)} · {t.type}</div>
                      {t.compliance_flag&&<div style={{fontSize:11,color:C.amber,marginTop:4,lineHeight:1.4}}>{t.compliance_flag}</div>}
                    </div>
                  </div>
                  <div style={{display:"flex",gap:8,marginTop:10}}>
                    <button className="ca-done" style={{margin:0,flex:1,padding:9,fontSize:12}} onClick={()=>onPostKIV(t.id,"done")}>✓ DONE</button>
                    <button className="ca-waive" style={{margin:0,flex:1,padding:9,fontSize:12}} onClick={()=>onPostKIV(t.id,"waived")}>∼ WAIVE</button>
                  </div>
                </div>
              ))}
            </>
          ):(
            <div style={{textAlign:"center",padding:"40px 20px",color:C.muted}}>
              <div style={{fontSize:32,marginBottom:10}}>✅</div>
              <div style={{fontSize:14,fontWeight:600}}>No items in KIV</div>
              <div style={{fontSize:12,marginTop:4}}>All transactions are up to date</div>
            </div>
          )
        ):(
          <>
            {[...filtered].reverse().map(t=>(
              <TxnRow key={t.id} txn={t} onTap={()=>onEditTxn(t)}/>
            ))}
            {filtered.length===0&&(
              <div style={{textAlign:"center",padding:"40px 20px",color:C.muted}}>
                <div style={{fontSize:32,marginBottom:10}}>📭</div>
                <div style={{fontSize:14,fontWeight:600}}>No transactions yet</div>
                <div style={{fontSize:12,marginTop:4}}>Tap "+ Add Entry" to get started</div>
              </div>
            )}
          </>
        )}
      </div>
    </div>
  );
}

function CompliancePopup({txn, rule, onDone, onWaive, onLater, onNav}){
  const fmt2=n=>"₦"+Number(n||0).toLocaleString("en-NG",{maximumFractionDigits:0});
  const wht = txn.wht || 0;
  const net = txn.net || txn.amount;
  const isCGT = rule.cgt_flag || rule.head==="CGT-EVENT";

  if(isCGT) return(
    <div className="overlay" onClick={onLater}>
      <div className="sheet" onClick={e=>e.stopPropagation()}>
        <div style={{display:"flex",gap:10,alignItems:"flex-start",marginBottom:14}}>
          <div style={{width:40,height:40,borderRadius:12,background:"#EDE9FE",border:"1px solid #C4B5FD",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,flexShrink:0}}>📊</div>
          <div>
            <div className="sheet-title">Possible Capital Gains Tax Event</div>
            <div style={{fontSize:12,color:C.muted,marginTop:1}}>NTA 2025 S.34-S.46</div>
          </div>
        </div>

        <div style={{background:"#F8FAFC",border:"1px solid #E2E8F0",borderRadius:10,padding:"11px 13px",marginBottom:12}}>
          <div style={{fontSize:11,color:C.muted,marginBottom:3}}>TRANSACTION</div>
          <div style={{fontSize:13,fontWeight:700,color:C.ink,marginBottom:2}}>{txn.desc}</div>
          <div style={{fontSize:13,color:C.slate}}>Proceeds: <strong>{fmt2(txn.amount)}</strong></div>
        </div>

        <div style={{background:"#EDE9FE",border:"1px solid #C4B5FD",borderRadius:10,padding:"12px 13px",marginBottom:12}}>
          <div style={{fontSize:11,fontWeight:700,color:"#7C3AED",marginBottom:6}}>Why this was flagged</div>
          <div style={{fontSize:12,color:C.ink,lineHeight:1.6,marginBottom:8}}>
            This transaction looks like an asset disposal. Under NTA 2025, gains from selling land, buildings, vehicles, shares, equipment, crypto and other assets may be subject to Capital Gains Tax.
          </div>
          <div style={{fontSize:11,fontWeight:700,color:"#7C3AED",marginBottom:4}}>Before you post, TaxWise needs to know:</div>
          <div style={{fontSize:11,color:C.ink,lineHeight:1.9}}>
            {txn.isCompany&&(
              <div style={{padding:"6px 10px",background:"#FEF3C7",border:"1px solid #FDE68A",borderRadius:6,marginBottom:8,fontSize:11,color:"#92400E",fontWeight:600}}>
                COMPANY CHECK: Is this the sale of trading stock, goods or inventory? If YES — this is ordinary business income, NOT a CGT event. Post as income. If NO (it is a fixed/capital asset) — CGT applies. Continue below.
              </div>
            )}
            <div>1. What type of asset was disposed of? (land, building, vehicle, shares, equipment, etc.)</div>
            <div>2. What was the original acquisition cost?</div>
            <div>3. Was Capital Allowance ever claimed on it? (affects cost base)</div>
            <div>4. Are proceeds being reinvested in a Nigerian company? (full exemption)</div>
            <div>5. Personal vehicle or principal residence? (individuals — may be exempt)</div>
          </div>
        </div>

        <div style={{background:"#F0FDF4",border:"1px solid #BBF7D0",borderRadius:10,padding:"11px 13px",marginBottom:16}}>
          <div style={{fontSize:12,fontWeight:700,color:C.green,marginBottom:4}}>What to do next</div>
          <div style={{fontSize:12,color:C.ink,lineHeight:1.6}}>
            Go to <strong>Calculator &gt; Cap. Gains tab</strong> and enter the details of this disposal. TaxWise will check all exemptions and compute any CGT due. Then return here to post this transaction.
          </div>
        </div>

        <button onClick={()=>{onLater();if(onNav)onNav("calculate");}}
          style={{width:"100%",padding:"13px",background:"#7C3AED",border:"none",borderRadius:10,
            color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit",marginBottom:8,
            boxShadow:"0 4px 0 #5B21B6"}}>
          📊 Go to CGT Calculator
        </button>
        <button className="ca-done" onClick={onDone}
          style={{background:"#F0FDF4",color:C.green,border:"1px solid #BBF7D0"}}>
          ✓ I have checked — post this transaction (CGT handled separately)
        </button>
        <button className="ca-later" onClick={onLater}>
          ⏸ Hold in KIV — review later
        </button>
      </div>
    </div>
  );

  return(
    <div className="overlay" onClick={onLater}>
      <div className="sheet" onClick={e=>e.stopPropagation()}>

        {/* Header */}
        <div style={{display:"flex",gap:10,alignItems:"flex-start",marginBottom:14}}>
          <div style={{width:40,height:40,borderRadius:12,background:"#FEF3C7",border:"1px solid #FDE68A",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,flexShrink:0}}>⚠️</div>
          <div>
            <div className="sheet-title">Tax Compliance Required</div>
            <div style={{fontSize:12,color:C.muted,marginTop:1}}>{rule.head} · {rule.law}</div>
          </div>
        </div>

        {/* Transaction summary */}
        <div style={{background:"#F8FAFC",border:"1px solid #E2E8F0",borderRadius:10,padding:"11px 13px",marginBottom:12}}>
          <div style={{fontSize:11,color:C.muted,marginBottom:3}}>TRANSACTION</div>
          <div style={{fontSize:13,fontWeight:700,color:C.ink,marginBottom:2}}>{txn.desc}</div>
          <div style={{fontSize:13,color:C.slate}}>Gross amount: <strong>{fmt2(txn.amount)}</strong></div>
          {wht > 0 && (
            <div style={{marginTop:8,padding:"8px 10px",background:"#FEF3C7",borderRadius:8,display:"flex",justifyContent:"space-between"}}>
              <span style={{fontSize:12,color:"#92400E",fontWeight:600}}>WHT to deduct ({rule.wht_rate}%)</span>
              <span style={{fontSize:13,fontWeight:800,color:C.red}}>{fmt2(wht)}</span>
            </div>
          )}
          {wht > 0 && (
            <div style={{marginTop:4,padding:"8px 10px",background:"#F0FDF4",borderRadius:8,display:"flex",justifyContent:"space-between"}}>
              <span style={{fontSize:12,color:C.green,fontWeight:600}}>Net amount to pay</span>
              <span style={{fontSize:13,fontWeight:800,color:C.green}}>{fmt2(net)}</span>
            </div>
          )}
        </div>

        {/* Obligation */}
        <div style={{background:C.amberBg,border:"1px solid #FDE68A",borderRadius:10,padding:"11px 13px",marginBottom:16}}>
          <div style={{fontSize:11,fontWeight:700,color:C.amber,marginBottom:4}}>Legal obligation — {rule.law}</div>
          <div style={{fontSize:12,color:C.ink,lineHeight:1.6}}>{rule.prompt||rule.obligation}</div>
        </div>

        <div style={{fontSize:12,fontWeight:700,color:C.ink,marginBottom:10}}>What action have you taken?</div>

        <button className="ca-done" onClick={onDone}>
          ✓ DONE — I have deducted and will remit the tax
        </button>
        <button className="ca-waive" onClick={onWaive}>
          ∼ WAIVE — I acknowledge but am waiving this obligation
        </button>
        <button className="ca-later" onClick={onLater}>
          ⏸ NOT NOW — Hold in KIV folder (will not post yet)
        </button>

        <div style={{fontSize:11,color:C.muted,marginTop:10,textAlign:"center",lineHeight:1.5}}>
          Closing or tapping outside also holds this in KIV.<br/>
          Non-compliance attracts penalties under TAA 2025 Sec 65.
        </div>
      </div>
    </div>
  );
}

function TxnEditScreen({txn, onSave, onDelete, onBack}){
  const[edit,setEdit]=useState({...txn});
  const set=(k,v)=>setEdit(e=>({...e,[k]:v}));
  const rule=classifyTxn(edit.desc,edit.type);

  return(
    <div style={{paddingBottom:80,background:"#F0F4F8",minHeight:"100vh"}}>
      <Hdr title="Edit Transaction" onBack={onBack}
        right={<button className="btn-sm btn-sm-red" onClick={()=>{if(window.confirm("Delete this transaction?"))onDelete(txn.id);}}>Delete</button>}
      />
      <div style={{padding:"14px 14px 20px"}}>
        <div style={{display:"flex",gap:8,marginBottom:14}}>
          {["income","expense"].map(t=>(
            <button key={t} onClick={()=>set("type",t)} style={{
              flex:1,padding:10,border:`2px solid ${edit.type===t?(t==="income"?C.green:C.red):C.border}`,
              background:edit.type===t?(t==="income"?C.greenBg:C.redBg):"#fff",
              borderRadius:9,cursor:"pointer",fontSize:13,fontWeight:700,fontFamily:"inherit",
              color:edit.type===t?(t==="income"?C.green:C.red):C.muted,
            }}>{t==="income"?"💰 Income":"💸 Expense"}</button>
          ))}
        </div>
        <div className="fg"><label className="lbl">DESCRIPTION</label>
          <textarea className="textarea" rows={2} value={edit.desc} onChange={e=>set("desc",e.target.value)}/></div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:14}}>
          <div><label className="lbl">AMOUNT (₦)</label>
            <input className="inp" type="number" value={edit.amount} onChange={e=>set("amount",parseFloat(e.target.value)||0)}/></div>
          <div><label className="lbl">DATE</label>
            <input className="inp" type="date" value={edit.date} onChange={e=>set("date",e.target.value)}/></div>
        </div>

        {/* Live tax classification */}
        {edit.desc.length>3&&(
          <div className="ibox blue" style={{marginBottom:14}}>
            <div className="ititle" style={{color:C.blue}}>{rule.icon} {rule.head}</div>
            <div style={{fontSize:12,color:C.ink,lineHeight:1.5}}>{rule.obligation}</div>
          </div>
        )}

        {/* Compliance status */}
        <div className="fg">
          <label className="lbl">COMPLIANCE STATUS</label>
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            {[{v:"na",l:"Not Applicable"},{v:"done",l:"✓ Done"},{v:"waived",l:"∼ Waived"},{v:"pending",l:"⏸ Pending"}].map(s=>(
              <button key={s.v} onClick={()=>set("compliance_status",s.v)} style={{
                padding:"7px 12px",border:`1.5px solid ${edit.compliance_status===s.v?C.blue:C.border}`,
                background:edit.compliance_status===s.v?C.blueLight:"#fff",
                borderRadius:8,cursor:"pointer",fontSize:12,fontWeight:700,fontFamily:"inherit",
                color:edit.compliance_status===s.v?C.blue:C.muted,
              }}>{s.l}</button>
            ))}
          </div>
        </div>

        <button className="btn btn-blue" onClick={()=>onSave(edit)} disabled={!edit.desc.trim()||!edit.amount}>
          Save Changes
        </button>
      </div>
    </div>
  );
}

function PayrollScreen({employees,setEmployees,onBack}){
  const[showAdd,setShowAdd]=useState(false);
  const[newEmp,setNewEmp]=useState({name:"",role:"",grossMonthly:0,pensionPct:8,nhfPct:2.5,nhisMonthly:0,lifeInsurance:0});
  const[selected,setSelected]=useState(null);

  const addEmployee=()=>{
    if(!newEmp.name||!newEmp.grossMonthly)return;
    setEmployees(prev=>[...prev,{id:Date.now(),...newEmp}]);
    setNewEmp({name:"",role:"",grossMonthly:0,pensionPct:8,nhfPct:2.5,nhisMonthly:0,lifeInsurance:0});
    setShowAdd(false);
  };

  const totalPAYE=employees.reduce((s,e)=>s+computePayroll(e).paye,0);
  const totalNetPay=employees.reduce((s,e)=>s+computePayroll(e).netPay,0);
  const totalCost=employees.reduce((s,e)=>s+computePayroll(e).totalEmployerCost,0);

  if(selected){
    const p=computePayroll(selected);
    return(
      <div style={{paddingBottom:80,background:"#F0F4F8",minHeight:"100vh"}}>
        <Hdr title={selected.name} onBack={()=>setSelected(null)}
          right={<button className="btn-sm btn-sm-red" onClick={()=>{setEmployees(prev=>prev.filter(e=>e.id!==selected.id));setSelected(null);}}>Remove</button>}/>
        <div style={{padding:"14px 14px 20px"}}>
          <div style={{background:`linear-gradient(135deg,${C.navy},#1E3A5F)`,borderRadius:14,padding:18,color:"#fff",marginBottom:14}}>
            <div style={{fontSize:11,opacity:.6,marginBottom:4}}>{selected.role||"Employee"}</div>

function AssetRegisterScreen({assets,setAssets,onBack}){
  const[mode,setMode]=useState("list"); // list | add | eligibility | detail
  const[newAsset,setNewAsset]=useState({name:"",assetClass:"plant",cost:0,dateAcquired:today(),imported:false,yearsHeld:1,businessPct:100});
  const[eligStep,setEligStep]=useState(0);
  const[eligAnswers,setEligAnswers]=useState({});
  const[selected,setSelected]=useState(null);

  const totalCA=assets.reduce((s,a)=>s+computeAssetCA(a).annual,0);

  const currentStep=CA_ELIGIBILITY_STEPS[eligStep];
  const allPassed=Object.keys(eligAnswers).length===CA_ELIGIBILITY_STEPS.length&&Object.values(eligAnswers).every(v=>v===true);

  const handleEligAnswer=(yes)=>{
    const newAnswers={...eligAnswers,[currentStep.id]:yes};
    setEligAnswers(newAnswers);
    if(!yes){
      return;
    }
    if(eligStep<CA_ELIGIBILITY_STEPS.length-1){
      setEligStep(s=>s+1);
    } else {
      setAssets(prev=>[...prev,{id:Date.now(),...newAsset,eligibility:"passed"}]);
      setMode("list");
      setEligStep(0);setEligAnswers({});
    }
  };

  if(mode==="eligibility") return(
    <div style={{paddingBottom:80,background:"#F0F4F8",minHeight:"100vh"}}>
      <Hdr title="Asset Eligibility Check" onBack={()=>{setMode("add");setEligStep(0);setEligAnswers({});}}
        subtitle={`Condition ${eligStep+1} of ${CA_ELIGIBILITY_STEPS.length} — NTA 2025, Sec 27`}/>
      <div style={{padding:"14px 14px 20px"}}>

        {/* Progress */}
        <div style={{display:"flex",gap:3,marginBottom:16}}>
          {CA_ELIGIBILITY_STEPS.map((_,i)=>(
            <div key={i} style={{flex:1,height:4,borderRadius:2,
              background:i<eligStep?(eligAnswers[CA_ELIGIBILITY_STEPS[i].id]===false?C.red:C.green):i===eligStep?C.blue:C.border,
              transition:"background .2s"}}/>
          ))}
        </div>

        <div className="card">
          <div className="ctitle">ELIGIBILITY CONDITION {eligStep+1}</div>
          <div style={{fontSize:15,fontWeight:700,color:C.ink,marginBottom:8,lineHeight:1.4}}>{currentStep.question}</div>
          <div style={{fontSize:12,color:C.muted,lineHeight:1.6,marginBottom:16}}>{currentStep.hint}</div>
          <div style={{fontSize:11,color:C.blue}}>Ref: {currentStep.law}</div>
        </div>

        {/* If already answered NO — show action required */}
        {eligAnswers[currentStep.id]===false&&(
          <div className="ibox red">
            <div className="ititle" style={{color:C.red}}>⚠ Condition NOT met — Action Required</div>
            <div style={{fontSize:12,color:C.ink,lineHeight:1.6}}>{currentStep.failAction}</div>
          </div>
        )}

        <div style={{display:"flex",gap:8}}>
          <button onClick={()=>handleEligAnswer(true)} style={{
            flex:1,padding:14,border:"none",borderRadius:11,fontSize:14,fontWeight:700,cursor:"pointer",
            background:eligAnswers[currentStep.id]===true?C.green:C.greenBg,
            color:eligAnswers[currentStep.id]===true?"#fff":C.green,
            border:`2px solid ${C.green}`,
          }}>✓ YES</button>
          <button onClick={()=>handleEligAnswer(false)} style={{
            flex:1,padding:14,border:"none",borderRadius:11,fontSize:14,fontWeight:700,cursor:"pointer",
            background:eligAnswers[currentStep.id]===false?C.red:C.redBg,
            color:eligAnswers[currentStep.id]===false?"#fff":C.red,
            border:`2px solid ${C.red}`,
          }}>✗ NO</button>
        </div>

        {eligAnswers[currentStep.id]===false&&(
          <div style={{marginTop:10}}>
            <div style={{fontSize:11,color:C.muted,textAlign:"center",marginBottom:8}}>Resolve the action above, then you can continue or skip this condition.</div>
            <button onClick={()=>{setEligAnswers(a=>({...a,[currentStep.id]:true}));if(eligStep<CA_ELIGIBILITY_STEPS.length-1)setEligStep(s=>s+1);else{setAssets(prev=>[...prev,{id:Date.now(),...newAsset,eligibility:"conditional"}]);setMode("list");setEligStep(0);setEligAnswers({});} }} style={{width:"100%",padding:11,background:C.amberBg,border:`1px solid #FDE68A`,color:C.amber,borderRadius:9,fontSize:12,fontWeight:700,cursor:"pointer"}}>
              ⚠ Override — I will resolve this. Continue anyway.
            </button>
          </div>
        )}

        {eligAnswers[currentStep.id]===true&&eligStep===CA_ELIGIBILITY_STEPS.length-1&&(
          <div className="ibox green" style={{marginTop:10}}>
            <div className="ititle" style={{color:C.green}}>✓ All conditions satisfied!</div>
            <p style={{fontSize:12,color:C.ink}}>This asset qualifies for Capital Allowance. It will be added to your asset register and CA schedule.</p>
          </div>
        )}
      </div>
    </div>
  );

  if(mode==="add") return(
    <div style={{paddingBottom:80,background:"#F0F4F8",minHeight:"100vh"}}>
      <Hdr title="Add Asset" onBack={()=>setMode("list")}/>
      <div style={{padding:"14px 14px 20px"}}>
        <div className="ibox amber">
          <div className="ititle" style={{color:C.amber}}>9-condition eligibility check will follow</div>
          <p style={{fontSize:12,color:C.ink}}>After entering the asset details, the app will walk you through each NRS eligibility condition one by one before the asset is added to your register.</p>
        </div>
        <div className="fg"><label className="lbl">ASSET DESCRIPTION</label><input className="inp" value={newAsset.name} onChange={e=>setNewAsset(a=>({...a,name:e.target.value}))} placeholder="e.g. Toyota Hilux 2025"/></div>
        <div className="fg">
          <label className="lbl">ASSET CLASS — NTA 2025 First Schedule</label>
          <select className="sel" value={newAsset.assetClass} onChange={e=>setNewAsset(a=>({...a,assetClass:e.target.value}))}>
            <optgroup label="── Class 1: 10% Annual Rate ──">
              {CA_CLASSES.filter(c=>c.class===1).map(c=><option key={c.code} value={c.code}>{c.label} (10%)</option>)}
            </optgroup>
            <optgroup label="── Class 2: 20% Annual Rate ──">
              {CA_CLASSES.filter(c=>c.class===2).map(c=><option key={c.code} value={c.code}>{c.label} (20%)</option>)}
            </optgroup>
            <optgroup label="── Class 3: 25% Annual Rate ──">
              {CA_CLASSES.filter(c=>c.class===3).map(c=><option key={c.code} value={c.code}>{c.label} (25%)</option>)}
            </optgroup>
          </select>
        </div>
        <div className="fg"><label className="lbl">QUALIFYING COST (₦)</label><input className="inp" type="number" value={newAsset.cost||""} onChange={e=>setNewAsset(a=>({...a,cost:parseFloat(e.target.value)||0}))}/></div>
        <div className="fg"><label className="lbl">DATE ACQUIRED</label><input className="inp" type="date" value={newAsset.dateAcquired} onChange={e=>setNewAsset(a=>({...a,dateAcquired:e.target.value}))}/></div>
        <div className="fg"><label className="lbl">YEARS IN BUSINESS USE</label><input className="inp" type="number" value={newAsset.yearsHeld} min="1" onChange={e=>setNewAsset(a=>({...a,yearsHeld:parseInt(e.target.value)||1}))}/></div>
        <div className="fg"><label className="lbl">BUSINESS USE % (100 = fully for business)</label><input className="inp" type="number" value={newAsset.businessPct} min="1" max="100" onChange={e=>setNewAsset(a=>({...a,businessPct:parseFloat(e.target.value)||100}))}/></div>
        <div style={{display:"flex",gap:8,marginBottom:14}}>
          <button onClick={()=>setNewAsset(a=>({...a,imported:false}))} style={{flex:1,padding:10,border:`2px solid ${!newAsset.imported?C.blue:C.border}`,background:!newAsset.imported?C.blueLight:"#fff",borderRadius:9,cursor:"pointer",fontSize:12,fontWeight:700,color:!newAsset.imported?C.blue:C.muted,fontFamily:"inherit"}}>🇳🇬 Domestic</button>
          <button onClick={()=>setNewAsset(a=>({...a,imported:true}))} style={{flex:1,padding:10,border:`2px solid ${newAsset.imported?C.blue:C.border}`,background:newAsset.imported?C.blueLight:"#fff",borderRadius:9,cursor:"pointer",fontSize:12,fontWeight:700,color:newAsset.imported?C.blue:C.muted,fontFamily:"inherit"}}>🌍 Imported</button>
        </div>
        {newAsset.cost>0&&(()=>{
          const ca=computeAssetCA(newAsset);
          return<div className="ibox green" style={{marginBottom:10}}><div className="ititle" style={{color:C.green}}>Projected Annual CA: {fmt(ca.annual)} ({ca.rate}% × {fmt(newAsset.cost)})</div><div style={{fontSize:12,color:C.ink}}>Tax Written Down Value after {newAsset.yearsHeld} year(s): {fmt(ca.twdv)} · Fully written off in {ca.maxYrs} years (1% residual retained)</div></div>;
        })()}
        <button className="btn btn-blue" onClick={()=>setMode("eligibility")} disabled={!newAsset.name||!newAsset.cost}>
          Continue to Eligibility Check →
        </button>
      </div>
    </div>
  );

  function buildScheduleRow(a){
    const cls = CA_CLASSES.find(c=>c.code===a.assetClass)||CA_CLASSES[10];
    const cost = a.cost||0;
    const rate = cls.rate;
    const bPct = (a.businessPct||100)/100;
    const yrs  = a.yearsHeld||1;
    const residual = cost*0.01;
    const depnRate = rate; // same basis as CA
    const annualDepn = cost * depnRate * bPct;
    const maxYrs = cost > 0 ? Math.floor((cost-residual)/annualDepn)||1 : 1;
    const priorYrs = Math.max(0, yrs - 1);
    const accDepBF  = Math.min(cost - residual, annualDepn * priorYrs);
    const depnCharge= (yrs <= maxYrs) ? annualDepn : 0;
    const accDepCF  = Math.min(cost - residual, accDepBF + depnCharge);
    const nbv       = cost - accDepCF;
    const caAnnual  = cost * rate * bPct;
    const caEffective = caAnnual * Math.min(yrs, maxYrs);
    const twdv      = Math.max(residual, cost - caEffective);
    return{
      ...a,
      assetLabel: cls.label,
      rate: rate*100,
      additions: a.isAddition ? cost : 0,
      disposals: a.disposed ? cost : 0,
      accDepBF,
      depnCharge,
      accDepCF,
      nbv,
      caAnnual,
      twdv,
      residual,
      maxYrs,
      bPct,
    };
  }

  const exportScheduleCSV = () => {
    const rows = assets.map(buildScheduleRow);
    const totals = rows.reduce((t,r)=>({
      cost:t.cost+r.cost, additions:t.additions+r.additions, disposals:t.disposals+r.disposals,
      accDepBF:t.accDepBF+r.accDepBF, depnCharge:t.depnCharge+r.depnCharge,
      accDepCF:t.accDepCF+r.accDepCF, nbv:t.nbv+r.nbv,
      caAnnual:t.caAnnual+r.caAnnual, twdv:t.twdv+r.twdv
    }), {cost:0,additions:0,disposals:0,accDepBF:0,depnCharge:0,accDepCF:0,nbv:0,caAnnual:0,twdv:0});

    const hdr = [
      "Asset Description","Class","Date Acquired","CA Rate %","Business Use %",
      "Cost (₦)","Additions (₦)","Disposals (₦)",
      "Acc. Depn B/F (₦)","Depn Charge (₦)","Acc. Depn C/F (₦)",
      "Net Book Value / NPV (₦)","Annual CA — NTA 2025 (₦)","TWDV (₦)",
      "Eligibility","Source","Law Reference"
    ].join(",");

    const dataRows = rows.map(r=>[
      `"${r.name}"`, `"${r.assetLabel}"`, r.dateAcquired||"", r.rate, (r.bPct*100).toFixed(0),
      r.cost.toFixed(2), r.additions.toFixed(2), r.disposals.toFixed(2),
      r.accDepBF.toFixed(2), r.depnCharge.toFixed(2), r.accDepCF.toFixed(2),
      r.nbv.toFixed(2), r.caAnnual.toFixed(2), r.twdv.toFixed(2),
      r.eligibility||"passed", r.imported?"Imported":"Domestic",
      "NTA 2025 First Schedule"
    ].join(","));

    const totalRow = [
      '"TOTALS","","","","",',
      totals.cost.toFixed(2),",",totals.additions.toFixed(2),",",totals.disposals.toFixed(2),",",
      totals.accDepBF.toFixed(2),",",totals.depnCharge.toFixed(2),",",totals.accDepCF.toFixed(2),",",
      totals.nbv.toFixed(2),",",totals.caAnnual.toFixed(2),",",totals.twdv.toFixed(2),',"",""',
    ].join("");

    const note = `\n"Generated by TaxWise Nigeria — NTA 2025 (No.3) · Capital Allowance: Straight-line only, 1% residual retained"`;
    const csv  = [hdr, ...dataRows, totalRow, note].join("\n");
    const blob = new Blob([csv],{type:"text/csv"});
    const url  = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href  = url;
    link.download = `TaxWise_AssetRegister_${new Date().toISOString().split("T")[0]}.csv`;
    link.click();
    URL.revokeObjectURL(url);
  };

  if(mode==="schedule"){
    const rows = assets.map(buildScheduleRow);
    const tot  = rows.reduce((t,r)=>({
      cost:t.cost+r.cost, accDepBF:t.accDepBF+r.accDepBF,
      depnCharge:t.depnCharge+r.depnCharge, accDepCF:t.accDepCF+r.accDepCF,
      nbv:t.nbv+r.nbv, caAnnual:t.caAnnual+r.caAnnual, twdv:t.twdv+r.twdv
    }),{cost:0,accDepBF:0,depnCharge:0,accDepCF:0,nbv:0,caAnnual:0,twdv:0});

    const Col=({label,val,color,bold})=>(
      <div style={{marginBottom:6}}>
        <div style={{fontSize:9,color:C.muted,fontWeight:700,letterSpacing:".05em",marginBottom:1}}>{label}</div>
        <div style={{fontSize:12,fontWeight:bold?700:600,color:color||C.ink}}>{val}</div>
      </div>
    );

    return(
      <div style={{paddingBottom:100,background:"#F0F4F8",minHeight:"100vh"}}>
        <Hdr title="Asset Register Schedule" onBack={()=>setMode("list")}
          right={<button className="btn-sm btn-sm-blue" onClick={exportScheduleCSV}>⬇ Export CSV</button>}/>

        {/* Summary hero */}
        <div style={{background:`linear-gradient(135deg,${C.navy},#1E3A5F)`,padding:"18px 16px 22px",color:"#fff"}}>
          <div style={{fontSize:10,opacity:.6,letterSpacing:".1em",marginBottom:6,fontWeight:700}}>ASSET REGISTER — FULL DEPRECIATION SCHEDULE</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
            {[
              {l:"Total Cost",      v:fmt(tot.cost)},
              {l:"Total NBV",       v:fmt(tot.nbv)},
              {l:"Annual CA",       v:fmt(tot.caAnnual)},
              {l:"Acc. Depn B/F",   v:fmt(tot.accDepBF)},
              {l:"Depn Charge",     v:fmt(tot.depnCharge)},
              {l:"TWDV (Tax)",      v:fmt(tot.twdv)},
            ].map(s=>(

        </div>
        {assets.length>0?(
          <div className="card">

            {assets.map(a=>{
              const ca=computeAssetCA(a);
              return(

                        {a.eligibility==="conditional"&&<span className="pill" style={{background:C.amberBg,color:C.amber,marginLeft:6,fontSize:9}}>⚠ COND.</span>}

                      </div>

function TaxScheduleScreen({scheduleKey, schedules, profile, onBack}){
  const lines = schedules[scheduleKey] || [];
  const total = lines.reduce((s,l)=>s+l.tax,0);
  const grossTotal = lines.reduce((s,l)=>s+l.gross,0);

  const labels={
    whtOut:    {title:"WHT Remittance Schedule",  sub:"Withholding Tax deducted — to remit to NRS by 21st", color:C.red,      icon:"📋"},
    whtIn:     {title:"WHT Credit Schedule",      sub:"WHT deducted from your income by payers",            color:C.green,    icon:"✅"},
    vatOut:    {title:"Output VAT Schedule",       sub:"VAT charged on your taxable supplies",               color:C.amber,    icon:"🧾"},
    vatIn:     {title:"Input VAT Schedule",        sub:"VAT paid on qualifying purchases — deductible",      color:C.green,    icon:"🧾"},
    payeOut:   {title:"PAYE Remittance Schedule",  sub:"PAYE deducted from staff salaries — remit by 10th", color:C.blue,     icon:"👥"},
    payeIn:    {title:"PAYE Credit Schedule",      sub:"PAYE deducted from your salary by employer",         color:C.green,    icon:"💼"},
    cgtEvents: {title:"CGT Events — Asset Disposals", sub:"Possible Capital Gains Tax transactions — check CGT calculator for each", color:"#7C3AED", icon:"📊"},
  };
  const meta = labels[scheduleKey]||{title:"Tax Schedule",sub:"",color:C.blue,icon:"📊"};

  const exportCSV=()=>{
    const header="Date,Description,Gross Amount (₦),Tax Rate,Tax Amount (₦),Net Amount (₦),Status,Law Reference";
    const rows=lines.map(l=>`${l.date},"${l.desc}",${l.gross},${l.rate||""},${l.tax.toFixed(2)},${((l.net||l.gross-l.tax)).toFixed(2)},${l.status||"posted"},${l.law||""}`);
    const csv=[header,...rows,`,,${grossTotal.toFixed(2)},,${total.toFixed(2)},,TOTAL,`].join("\n");
    const blob=new Blob([csv],{type:"text/csv"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.download=`TaxWise_${scheduleKey}_${new Date().toISOString().split("T")[0]}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  };

  return(
    <div style={{paddingBottom:80,background:"#F0F4F8",minHeight:"100vh"}}>
      <Hdr title={meta.title} onBack={onBack}

        <div style={{fontSize:10,opacity:.6,letterSpacing:".1em",marginBottom:4}}>{meta.sub.toUpperCase()}</div>
        <div style={{fontSize:11,opacity:.6,marginBottom:2}}>{profile.name||profile.companyName} · {new Date().toLocaleDateString("en-NG",{month:"long",year:"numeric"})}</div>

        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end",marginTop:8}}>
          <div>
            <div style={{fontSize:11,opacity:.65}}>TOTAL TAX {scheduleKey.includes("In")||scheduleKey.includes("In")?"CREDIT":"TO REMIT"}</div>
            <div style={{fontSize:36,fontWeight:800,color: scheduleKey.includes("Out")||scheduleKey.includes("out")?"#F87171":"#4ADE80"}}>{fmt(total)}</div>
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{fontSize:11,opacity:.65}}>TRANSACTIONS</div>
            <div style={{fontSize:24,fontWeight:700}}>{lines.length}</div>

        {(scheduleKey==="whtOut"||scheduleKey==="vatOut"||scheduleKey==="payeOut")&&(

function CITScreen({profile, txns, assets, onBack}){
  const agg = computeAggregates(txns);
  const turnover = computeTurnover(txns);
  const totalCA = assets.reduce((s,a)=>s+computeAssetCA(a).annual,0);

  // Category-aware expense computation
  // For Cat C/D: only allowable expenses reduce taxable income
  // For companies: all business expenses deductible
  const isCatCD = profile.empCategory==="C"||profile.empCategory==="D";
  const isCompanyMode = profile.mode==="company";
  const allowableExpenses = (isCatCD||isCompanyMode)
    ? txns.filter(t=>t.type==="expense"&&t.taxAllowable!==false&&t.compliance_status!=="kiv").reduce((s,t)=>s+t.amount,0)
    : agg.expenses;

  const [override, setOverride] = useState(false);
  const [f, setF] = useState({
    turnover:      Math.round(turnover),
    cogs:          0,
    opex:          Math.round(allowableExpenses),
    otherIncome:   0,
    depreciation:  0,
    ca:            Math.round(totalCA),
    whtCredit:     Math.round(agg.whtIn),
    prevLoss:      0,
    taxYear:       new Date().getFullYear(),
  });

  // Recompute when profile category or transactions change
  useEffect(()=>{
    if(!override){
      const newTurnover = computeTurnover(txns);
      const newAgg = computeAggregates(txns);
      const newCA = assets.reduce((s,a)=>s+computeAssetCA(a).annual,0);
      const newCatCD = profile.empCategory==="C"||profile.empCategory==="D";
      const newIsCompany = profile.mode==="company";
      const newAllowable = (newCatCD||newIsCompany)
        ? txns.filter(t=>t.type==="expense"&&t.taxAllowable!==false&&t.compliance_status!=="kiv").reduce((s,t)=>s+t.amount,0)
        : newAgg.expenses;
      setF(prev=>({
        ...prev,
        turnover: Math.round(newTurnover),
        opex:     Math.round(newAllowable),
        ca:       Math.round(newCA),
        whtCredit:Math.round(newAgg.whtIn),
      }));
    }
  },[profile.empCategory, profile.mode, txns, assets, override]);
  const set = (k,v) => setF(p=>({...p,[k]:v}));

  const grossProfit   = f.turnover - f.cogs;
  const ebitda        = grossProfit - f.opex + (f.otherIncome||0);
  const adjProfit     = ebitda + (f.depreciation||0) - f.ca - (f.prevLoss||0);
  const taxableProfit = Math.max(0, adjProfit);

  const isSmall = f.turnover<=50e6 && (profile.fixedAssets||0)<=250e6 && !profile.isProfessional;
  const tier    = isSmall ? "Small Company (0%)" : "Standard (30% + 4% Dev Levy)";

  const cit     = isSmall ? 0 : taxableProfit * 0.30;
  const dev     = isSmall ? 0 : taxableProfit * 0.04;

  const minTax  = f.turnover * 0.005;
  const grossTax = cit + dev;
  const applyMin = !isSmall && grossTax < minTax;
  const finalGrossTax = isSmall ? 0 : (applyMin ? minTax : grossTax);

  const whtCredit = Math.min(f.whtCredit, finalGrossTax);
  const balanceDue = Math.max(0, finalGrossTax - whtCredit);
  const overpaid   = Math.max(0, f.whtCredit - finalGrossTax);

  const eff = taxableProfit > 0 ? (finalGrossTax / taxableProfit * 100).toFixed(1) : "0.0";

  const InpRow = ({label, field, hint}) => (
    <div className="fg">
      <label className="lbl">{label}{hint&&<span style={{fontWeight:400,textTransform:"none",letterSpacing:0,marginLeft:4,color:C.muted,fontSize:9}}>— {hint}</span>}</label>
      <input className="inp" type="number"
        value={f[field]||""}
        onChange={e=>set(field, parseFloat(e.target.value)||0)}
        style={{background: f[field] > 0 ? "#fff" : "#FAFAFA"}}
      />
    </div>
  );

  return(
    <div style={{paddingBottom:100}}>
      <Hdr title="CIT Computation" onBack={onBack} subtitle={`Tax Year ${f.taxYear} · NTA 2025`}/>

      {/* Source toggle */}
      <div style={{padding:"10px 12px 0",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div style={{fontSize:11,color:C.muted,fontWeight:600}}>
          {override ? "✏️ Manual mode — all fields editable" : "⚡ Auto-populated from your transactions"}
        </div>
        <button className="btn-sm btn-sm-blue" onClick={()=>setOverride(o=>!o)} style={{fontSize:11,padding:"5px 12px"}}>
          {override ? "Reset to Auto" : "Override"}
        </button>
      </div>

      <div style={{padding:"10px 12px 0"}}>

        {/* Section 1: P&L Inputs */}
        <div className="card">
          <div className="ctitle">📊 PROFIT & LOSS — BASIS PERIOD</div>
          <div className="fg">
            <label className="lbl">TAX YEAR</label>
            <select className="sel" value={f.taxYear} onChange={e=>set("taxYear",parseInt(e.target.value))}>
              {[2023,2024,2025,2026].map(y=><option key={y} value={y}>{y}</option>)}
            </select>
          </div>
          <div className="fg">
            <label className="lbl">TURNOVER (₦)<span style={{fontWeight:400,textTransform:"none",letterSpacing:0,marginLeft:4,color:C.muted,fontSize:9}}>— gross revenue from trading</span></label>

            <div style={{fontSize:10,color:C.muted,fontWeight:700,letterSpacing:".06em"}}>GROSS PROFIT</div>

          </div>
          <div className="fg">

            <input className="inp" type="number" value={f.ca||""} onChange={e=>set("ca",parseFloat(e.target.value)||0)}

              readOnly={!override}
