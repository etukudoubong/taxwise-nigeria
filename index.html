<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body,#app,#shell{height:100%;font-family:'DM Sans','Segoe UI',sans-serif;}
body{background:#0B1628;}
button,input,select,textarea{font-family:inherit;}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;}
input[type=number]{-moz-appearance:textfield;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes ping{0%{transform:scale(1);opacity:1}100%{transform:scale(2);opacity:0}}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block;animation:pulse 1.2s infinite;}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
.spin{animation:spin .7s linear infinite;}

/* ── LAYOUT — simple mobile scroll ── */
html,body{height:100%;margin:0;padding:0;overflow:hidden;background:#0B1628;}
#app{height:100%;display:flex;justify-content:center;background:#0B1628;}
#shell{
  width:100%;max-width:430px;
  height:100%;
  display:flex;flex-direction:column;
  background:#F0F4F8;
  overflow:hidden;
  position:relative;
}

/* Status bar — fixed height */
#sbar{flex:0 0 auto;background:#0B1628;padding:10px 18px 8px;display:flex;justify-content:space-between;z-index:5;}
.sb{font-size:11px;color:rgba(255,255,255,.7);font-weight:600;font-family:'DM Mono',monospace;}

/* Content — fills remaining space, scrolls */
#content{
  flex:1 1 auto;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior-y:contain;
  position:relative;
  /* thin scrollbar */
  scrollbar-width:thin;
  scrollbar-color:#CBD5E1 #F0F4F8;
}
#content::-webkit-scrollbar{width:5px;}
#content::-webkit-scrollbar-track{background:#F0F4F8;}
#content::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:5px;}

/* Root fills content */
#root{min-height:100%;}

/* Page — no longer needs to scroll itself */
.page{display:block;padding-bottom:80px;}

/* Bottom nav — fixed height at bottom */
#bnav{
  flex:0 0 auto;
  background:#fff;
  border-top:1px solid #E2E8F0;
  display:flex;
  padding:8px 0 max(14px,env(safe-area-inset-bottom));
  z-index:20;
  box-shadow:0 -2px 12px rgba(0,0,0,.06);
}
#bnav:empty{display:none;}
.nb{flex:1;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:2px 0;}
.ni{font-size:20px;}.nl{font-size:9px;font-weight:700;letter-spacing:.04em;}

/* Header */
.hdr{display:flex;align-items:center;padding:13px 14px 11px;border-bottom:1px solid #E2E8F0;background:#fff;position:sticky;top:0;z-index:10;box-shadow:0 1px 3px rgba(0,0,0,.04);}
.back{background:#F1F5F9;border:none;border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;margin-right:10px;flex-shrink:0;}
.htitle{font-size:16px;font-weight:700;color:#0F172A;flex:1;}

/* Cards */
.card{background:#fff;border-radius:14px;padding:14px;border:1px solid #E2E8F0;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
.ctitle{font-size:10px;font-weight:700;letter-spacing:.12em;color:#94A3B8;margin-bottom:10px;text-transform:uppercase;}

/* Form */
.fg{margin-bottom:13px;}
.lbl{font-size:10px;font-weight:700;color:#64748B;letter-spacing:.06em;display:block;margin-bottom:5px;text-transform:uppercase;}
.inp{width:100%;padding:11px 13px;border-radius:9px;border:1.5px solid #E2E8F0;font-size:14px;color:#0F172A;background:#fff;outline:none;transition:border-color .15s;}
.inp:focus{border-color:#3B82F6;}
.sel{width:100%;padding:11px 13px;border-radius:9px;border:1.5px solid #E2E8F0;font-size:14px;color:#0F172A;background:#fff;outline:none;appearance:none;}
.textarea{width:100%;padding:11px 13px;border-radius:9px;border:1.5px solid #E2E8F0;font-size:13px;color:#0F172A;background:#fff;outline:none;resize:none;line-height:1.5;}

/* Buttons */
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;transition:opacity .15s;}
.btn:active{opacity:.85;}
.btn:disabled{opacity:.45;cursor:default;}
.btn-blue{background:#1D4ED8;color:#fff;}
.btn-green{background:#059669;color:#fff;}
.btn-ghost{background:#F1F5F9;color:#475569;}
.btn-sm{padding:8px 14px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;border:none;}
.btn-sm-blue{background:#EFF6FF;color:#1D4ED8;border:1.5px solid #BFDBFE;}
.btn-sm-red{background:#FEF2F2;color:#DC2626;border:1px solid #FECACA;}

/* Pill */
.pill{display:inline-block;padding:2px 8px;border-radius:100px;font-size:10px;font-weight:700;}

/* Data row */
.drow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #F1F5F9;font-size:13px;}
.drow:last-child{border-bottom:none;}
.drow.tot{font-weight:700;font-size:14px;padding-top:10px;border-top:2px solid #E2E8F0;border-bottom:none;}

/* Info boxes */
.ibox{border-radius:10px;padding:11px 13px;margin-bottom:10px;}
.ibox.blue{background:#EFF6FF;border:1px solid #BFDBFE;}
.ibox.green{background:#F0FDF4;border:1px solid #BBF7D0;}
.ibox.amber{background:#FFFBEB;border:1px solid #FDE68A;}
.ibox.red{background:#FEF2F2;border:1px solid #FECACA;}
.ibox.slate{background:#F8FAFC;border:1px solid #E2E8F0;}
.ititle{font-size:11px;font-weight:700;margin-bottom:3px;}

/* Hero */
.hero-blue{background:linear-gradient(135deg,#0B1628,#1E3A5F);color:#fff;padding:22px 16px 26px;}
.hero-green{background:linear-gradient(135deg,#065F46,#059669);color:#fff;padding:22px 16px 26px;}

/* Tab row */
.tabs{display:flex;gap:5px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{padding:7px 14px;border-radius:100px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;border:1.5px solid transparent;transition:all .15s;}

/* Txn row */
.txr{background:#fff;border-radius:12px;padding:12px 13px;margin-bottom:7px;border:1px solid #E2E8F0;}
.txr-top{display:flex;align-items:flex-start;gap:10px;}
.txr-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}

/* Onboarding */
.onboard-hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 24px;text-align:center;background:linear-gradient(160deg,#0B1628 0%,#1E3A5F 50%,#0B1628 100%);}

/* Mode card */
.mode-card{background:#fff;border-radius:18px;padding:22px;border:2.5px solid #E2E8F0;cursor:pointer;transition:all .15s;margin-bottom:12px;}
.mode-card.selected{border-color:#1D4ED8;background:#EFF6FF;}
.mode-card:active{transform:scale(.98);}

/* Search */
.search-wrap{position:relative;margin-bottom:12px;}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#94A3B8;font-size:14px;}
.search{width:100%;padding:11px 13px 11px 36px;border-radius:9px;border:1.5px solid #E2E8F0;font-size:14px;color:#0F172A;background:#F8FAFC;outline:none;}
.search:focus{border-color:#3B82F6;background:#fff;}

/* Live dot */
.ldot{width:7px;height:7px;border-radius:50%;background:#4ADE80;display:inline-block;position:relative;}
.ldot::after{content:'';position:absolute;inset:-3px;border-radius:50%;border:2px solid rgba(74,222,128,.35);animation:ping 1.5s infinite;}

/* Quick chips */
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 12px;}
.chip{background:#EFF6FF;border:1px solid #BFDBFE;border-radius:20px;padding:7px 12px;font-size:11px;color:#1D4ED8;cursor:pointer;font-weight:600;}

/* Score ring */
.ring-wrap{position:relative;width:64px;height:64px;flex-shrink:0;}
.ring-wrap svg{transform:rotate(-90deg);}
.ring-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;}

/* Popup / modal overlay */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90;display:flex;align-items:flex-end;justify-content:center;}
.sheet{width:100%;max-width:430px;background:#fff;border-radius:22px 22px 0 0;padding:22px 20px max(24px,env(safe-area-inset-bottom));animation:slideUp .22s ease;}
.sheet-title{font-size:17px;font-weight:800;color:#0F172A;margin-bottom:6px;}
.sheet-sub{font-size:13px;color:#64748B;margin-bottom:18px;line-height:1.5;}

/* Compliance action buttons */
.ca-done{background:#F0FDF4;border:2px solid #059669;color:#059669;border-radius:11px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;width:100%;margin-bottom:8px;}
.ca-waive{background:#FFFBEB;border:2px solid #D97706;color:#D97706;border-radius:11px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;width:100%;margin-bottom:8px;}
.ca-later{background:#F8FAFC;border:2px solid #E2E8F0;color:#64748B;border-radius:11px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;width:100%;}

/* KIV badge */
.kiv-badge{background:#FEF3C7;border:1px solid #FDE68A;color:#92400E;border-radius:7px;padding:2px 8px;font-size:10px;font-weight:700;}

/* Data source cards */
.ds-card{background:#fff;border-radius:12px;padding:14px;border:2px solid #E2E8F0;margin-bottom:8px;cursor:pointer;transition:all .15s;}
.ds-card.active{border-color:#1D4ED8;background:#EFF6FF;}
.ds-check{width:22px;height:22px;border-radius:6px;border:2px solid #E2E8F0;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;}
.ds-check.on{background:#1D4ED8;border-color:#1D4ED8;}

/* Employee row */
.emp-row{background:#fff;border-radius:12px;padding:12px;border:1px solid #E2E8F0;margin-bottom:7px;}
.emp-name{font-size:13px;font-weight:700;color:#0F172A;}
.emp-role{font-size:11px;color:#94A3B8;margin-top:1px;}

/* Asset row */
.asset-row{background:#fff;border-radius:12px;padding:12px;border:1px solid #E2E8F0;margin-bottom:7px;}
.asset-name{font-size:13px;font-weight:700;color:#0F172A;}
.asset-meta{font-size:11px;color:#64748B;margin-top:2px;}

/* Eligibility step */
.elig-step{border-radius:12px;padding:14px;margin-bottom:10px;border:2px solid #E2E8F0;background:#fff;}
.elig-step.pass{border-color:#059669;background:#F0FDF4;}
.elig-step.fail{border-color:#DC2626;background:#FEF2F2;}

/* Edit highlight */
.txr-edit{position:absolute;top:8px;right:8px;background:#EFF6FF;border:1px solid #BFDBFE;border-radius:6px;padding:3px 8px;font-size:10px;color:#1D4ED8;font-weight:700;cursor:pointer;}

</style>

function pitBands(taxable){
  const bands=[[800000,0],[2000000,.15],[2200000,.18],[3000000,.21],[4000000,.23],[Infinity,.25]];
  let tax=0,rem=Math.max(0,taxable);
  for(const[lim,rate]of bands){if(rem<=0)break;const c=Math.min(rem,lim);tax+=c*rate;rem-=c;}
  return tax;
}

function computePIT(p){
  if(typeof p==="number"){
    if(p/12<=70000) return{annual:0,monthly:0,eff:0,exempt:true};
    const t=pitBands(Math.max(0,p-p*.08));
    return{annual:t,monthly:t/12,eff:p?(t/p)*100:0,exempt:false};
  }
  const{
    category="A",
    monthlyIncome=0,        // Cat A,B,D: gross monthly salary from employer
    payeDeducted=0,         // Cat A,D: monthly PAYE deducted by employer
    otherIncome=0,          // Cat C: annual gross business/freelance revenue
    businessExpenses=0,     // Cat C,D: wholly-and-exclusively business expenses
    rentPaid=0,             // S.30(2)(a)(vi)  -  20% of annual rent, capped ₦500k
    nhfAnnual=0,            // S.30(2)(a)(i)   -  NHF contributions
    nhisAnnual=0,           // S.30(2)(a)(ii)  -  NHIS contributions
    pensionAnnual=0,        // S.30(2)(a)(iii)  -  employee 8% of basic+housing+transport
    lifeInsAnnual=0,        // S.30(2)(a)(v)   -  life insurance premiums
    housingLoanInterest=0,  // S.30(2)(a)(iv)  -  interest on owner-occupied housing loan only
  }=p;

  const annualSalary = (category==="C") ? 0 : monthlyIncome*12;
  const netBusinessIncome = Math.max(0, otherIncome - businessExpenses);
  const totalGross = annualSalary + otherIncome; // before business expense deduction
  const totalIncome = annualSalary + netBusinessIncome; // after business expense deduction

  if(category==="E" || (monthlyIncome<=70000 && otherIncome===0 && businessExpenses===0))
    return{annual:0,monthly:0,eff:0,exempt:true,totalGross,payeCredit:payeDeducted*12,balanceDue:0,refund:payeDeducted*12,category};

  const pensionDeduction  = pensionAnnual>0 ? pensionAnnual : annualSalary*.08;
  const nhfDeduction      = nhfAnnual;
  const nhisDeduction     = nhisAnnual;
  const lifeInsDeduction  = lifeInsAnnual;
  const housingDeduction  = housingLoanInterest;
  const rentRelief        = Math.min(rentPaid*.2, 500000); // S.30(2)(a)(vi) cap ₦500k
  const totalDeductions   = pensionDeduction+nhfDeduction+nhisDeduction+lifeInsDeduction+housingDeduction+rentRelief;

  const chargeableIncome = Math.max(0, totalIncome - totalDeductions);

  const tax = pitBands(chargeableIncome);

  const minTax = (category==="A") ? 0 : Math.max(0, totalGross * 0.01);
  const finalTax = Math.max(tax, minTax);
  const minimumTaxApplies = finalTax > tax && minTax > 0;

  const payeCredit = (category==="A"||category==="D") ? payeDeducted*12 : 0;
  const bal = finalTax - payeCredit;

  const whtCreditApplicable = (category==="C"||category==="D");

  return{
    annual:finalTax, monthly:finalTax/12, eff:totalGross?(finalTax/totalGross)*100:0,
    exempt:false, category,
    totalGross, annualSalary, netBusinessIncome, businessExpenses,
    totalIncome, chargeableIncome,
    pensionDeduction, nhfDeduction, nhisDeduction, lifeInsDeduction,
    housingDeduction, rentRelief, totalDeductions,
    pitBeforeMinTax:tax, minimumTaxApplies, minTax,
    payeCredit, balanceDue:Math.max(0,bal), refund:Math.max(0,-bal),
    whtCreditApplicable,
    selfAssessment: category!=="A", // B,C,D must self-file
    filingDeadline: "31 March", filingAuthority: "SIRS (state of residence)",
  };
}

function computeCIT(profit,turnover,assets=0,isPro=false){
  const isSmall=turnover<=50e6&&assets<=250e6&&!isPro;
  const cit=isSmall?0:profit*.30;
  const dev=isSmall?0:profit*.04;
  const minETR=turnover>=20e9?Math.max(0,profit*.15-cit-dev):0;
  const total=cit+dev+minETR;
  return{isSmall,tier:isSmall?"Small Company (0%)":"Standard (30%+4%)",
    cit,dev,minETR,total,eff:profit?(total/profit)*100:0};
}

function computeWHT(amount,type){
  const r={dividend:.10,interest:.10,rent:.10,royalty:.10,professional:.10,
    consultancy:.10,management:.10,technical:.10,commission:.10,director:.10,
    contract:.05,construction:.05}[type]||.10;
  return{wht:amount*r,net:amount*(1-r),rate:r*100};
}

function computeVAT(amount,tier="standard"){
  if(tier==="exempt")return{vat:0,total:amount,tier:"EXEMPT",canClaim:false,rate:0};
  if(tier==="zero") return{vat:0,total:amount,tier:"ZERO-RATED",canClaim:true,rate:0};
  return{vat:amount*.075,total:amount*1.075,tier:"STANDARD",canClaim:true,rate:7.5};
}

function computeCA(cost,cls,years=1){
  const rates={building:.10,masts:.10,heavy:.10,agric:.10,plant:.20,
    furniture:.20,mining:.20,vehicle:.25,software:.25,intangible:.25,other:.25};
  const rate=rates[cls]||.20;
  const residual=cost*.01;
  const annual=cost*rate;
  const maxYrs=Math.floor((cost-residual)/annual);
  const effective=annual*Math.min(years,maxYrs);
  const twdv=Math.max(residual,cost-effective);
  return{annual,effective,twdv,residual,rate:rate*100,maxYrs};
}

function computeCGT({
  assetType="other",
  isCompany=false,
  isSmallCompany=false,
  proceeds=0,
  cost=0,
  caWasClaimed=false,
  twdv=0,
  otherAnnualIncome=0,
  reinvestedInNigeria=false,
  sharesSaleInYear=0,
  sharesGain=0,
}={}){
  const costBase = caWasClaimed ? twdv : cost;
  const gain = Math.max(0, proceeds - costBase);
  if(reinvestedInNigeria)
    return{gain,tax:0,rate:0,exempt:true,exemptReason:"Reinvestment in Nigerian company - fully exempt [NTA 2025 S.34]",costBase};
  if(assetType==="principal_residence"&&!isCompany)
    return{gain,tax:0,rate:0,exempt:true,exemptReason:"Principal private residence - exempt [NTA 2025 S.34]",costBase};
  if(assetType==="vehicle"&&!isCompany)
    return{gain,tax:0,rate:0,exempt:true,exemptReason:"Personal vehicle (up to 2) - exempt [NTA 2025 S.34]",costBase};
  if(assetType==="chattel"&&proceeds<=5000000)
    return{gain,tax:0,rate:0,exempt:true,exemptReason:"Personal chattel proceeds below N5m - exempt [NTA 2025 S.32]",costBase};
  if((assetType==="shares_listed"||assetType==="shares_unlisted")&&sharesSaleInYear<=150000000&&sharesGain<=10000000)
    return{gain,tax:0,rate:0,exempt:true,exemptReason:"Share disposal below N150m proceeds & N10m gain in 12 months - exempt [NTA 2025 S.45]",costBase};
  if(!isCompany&&gain<=50000000)
    return{gain,tax:0,rate:0,exempt:true,exemptReason:"Gain within N50m individual exemption threshold [NTA 2025 S.34]",costBase};
  if(isCompany&&isSmallCompany)
    return{gain,tax:0,rate:0,exempt:true,exemptReason:"Small company - exempt from CGT [NTA 2025 S.202]",costBase};
  if(isCompany){
    const tax=gain*0.30;
    return{gain,tax,rate:30,exempt:false,exemptReason:null,costBase,tier:"30% (Company Rate)"};
  }
  const taxableGain=Math.max(0,gain-50000000);
  const totalIncome=otherAnnualIncome+taxableGain;
  const taxOnTotal=pitBands(totalIncome);
  const taxOnOther=pitBands(otherAnnualIncome);
  const taxOnGain=Math.max(0,taxOnTotal-taxOnOther);
  const effectiveRate=taxableGain>0?(taxOnGain/taxableGain)*100:0;
  return{gain,taxableGain,tax:taxOnGain,rate:effectiveRate,exempt:false,exemptReason:null,costBase,
    tier:"Progressive PIT rate (~"+effectiveRate.toFixed(1)+"%)",totalIncomeForBanding:totalIncome};
}

function computePenalty(tax,days,isCompany=false){
  if(days<=0)return{filing:0,interest:0,total:0,totalPayable:tax};
  const first=isCompany?250000:50000;
  const monthly=isCompany?50000:25000;
  const extra=Math.max(0,Math.ceil(days/30)-1);
  const filing=first+extra*monthly;
  const interest=tax*(0.4175/365)*days;
  return{filing,interest,total:filing+interest,totalPayable:tax+filing+interest};
}

function getDaysLeft(type){
  const now = new Date();
  now.setHours(0,0,0,0);
  const y = now.getFullYear(), m = now.getMonth(), d = now.getDate();

  const thisMonthDeadlines = {
    PAYE:   new Date(y, m, 10),
    VAT:    new Date(y, m, 21),
    WHT:    new Date(y, m, 21),
    PIT:    new Date(y, 6, 31),   // July 31
    CIT:    new Date(y, 5, 30),   // June 30 (6 months after Dec year end)
    ANNUAL: new Date(y, 0, 31),   // Jan 31
  };

  let deadline = thisMonthDeadlines[type] || thisMonthDeadlines.PAYE;

  if(["PAYE","VAT","WHT"].includes(type) && deadline < now){
    const next = new Date(y, m+1, type==="PAYE"?10:21);
    deadline = next;
  }

  return Math.ceil((deadline - now) / 86400000);
}

function computeAggregates(txns){
  let income=0, expenses=0;
  let vatOut=0, vatIn=0, whtIn=0, whtOut=0, payeIn=0, payeOut=0;

  const schedules={
    whtOut:[],    // WHT you must deduct & remit
    whtIn:[],     // WHT deducted from your income (credit)
    vatOut:[],    // Output VAT on your sales
    vatIn:[],     // Input VAT on your purchases
    payeOut:[],   // PAYE you must deduct & remit
    payeIn:[],    // PAYE deducted from your salary (credit)
    cgtEvents:[],  // CGT-flagged asset disposal transactions
  };

  for(const t of txns){
    if(t.compliance_status==="kiv") continue; // KIV items not yet posted
    const r=classifyTxn(t.desc, t.type);

    if(t.type==="income"){
      income+=t.amount;
      if(["WHT","WHT+VAT","Zero-VAT"].some(h=>r.head.startsWith(h.split("+")[0]))||r.head==="WHT"){
        const wht=r.wht_amount_fn?r.wht_amount_fn(t.amount):t.amount*.10;
        if(wht>0){
          whtIn+=wht;
          schedules.whtIn.push({id:t.id,date:t.date,desc:t.desc,gross:t.amount,tax:wht,rate:"10%",type:"WHT Credit",law:"NTA 2025 Ch.Two Pt.IV"});
        }
      }
      if(r.head==="VAT+CIT"||r.head==="WHT+VAT"){
        const vat=t.amount*.075;
        vatOut+=vat;
        schedules.vatOut.push({id:t.id,date:t.date,desc:t.desc,gross:t.amount,tax:vat,rate:"7.5%",type:"Output VAT",law:"NTA 2025 Ch.Four Sec 52"});
      }
      if(r.head==="PAYE"){
        const paye=t.amount*.15; // estimated at 15%
        payeIn+=paye;
        schedules.payeIn.push({id:t.id,date:t.date,desc:t.desc,gross:t.amount,tax:paye,rate:"~15%",type:"PAYE Credit",law:"TAA 2025 Sec 13"});
      }
      if(r.head==="CGT-EVENT"){
        schedules.cgtEvents.push({id:t.id,date:t.date,desc:t.desc,gross:t.amount,tax:0,rate:"CGT  -  check calculator",type:"Asset Disposal",status:t.compliance_status||"pending",law:"NTA 2025 S.34-S.46"});
      }
    } else {
      expenses+=t.amount;
      if(r.compliance_required && r.head.startsWith("WHT-out") && r.wht_rate){
        const wht=t.amount*(r.wht_rate/100);
        const net=t.amount-wht;
        whtOut+=wht;
        schedules.whtOut.push({id:t.id,date:t.date,desc:t.desc,gross:t.amount,tax:wht,net,rate:r.wht_rate+"%",type:r.head,status:t.compliance_status||"pending",law:r.law});
      }
      if(r.head==="PAYE-out"){
        const paye=t.amount*.15; // estimated; payroll engine gives exact
        payeOut+=paye;
        schedules.payeOut.push({id:t.id,date:t.date,desc:t.desc,gross:t.amount,tax:paye,rate:"~15%",type:"PAYE",status:t.compliance_status||"pending",law:"TAA 2025 Sec 13"});
      }
      if(r.head==="Overhead"||r.head==="Expense"){
        if(t.desc.toLowerCase().match(/purchase|bought|supplies|stock|inventory|material/)){
          const vat=t.amount*.075;
          vatIn+=vat;
          schedules.vatIn.push({id:t.id,date:t.date,desc:t.desc,gross:t.amount,tax:vat,rate:"7.5%",type:"Input VAT",law:"NTA 2025 Ch.Four Sec 59"});
        }
      }
    }
  }

  const vatNet=vatOut-vatIn;
  return{
    income, expenses, net:income-expenses,
    vatOut, vatIn, vatNet, vatPayable:Math.max(0,vatNet), vatRefund:Math.max(0,-vatNet),
    whtIn, whtOut, payeIn, payeOut, cgtEvents:schedules.cgtEvents.length,
    estCIT:Math.max(0,income-expenses)*.30,
    schedules,  // line-by-line breakdown per tax head
    txnCount:txns.length,
  };
}

function computeTurnover(txns){
  return txns.filter(t=>t.type==="income"&&t.compliance_status!=="kiv").reduce((s,t)=>s+t.amount,0);
}

function computePayroll(employee){
  const{grossMonthly=0,pensionPct=8,employerPensionPct=10,nhfPct=2.5,nhisMonthly=0,lifeInsurance=0}=employee;
  const annualGross=grossMonthly*12;

  if(grossMonthly<=70000) return{...employee,paye:0,pensionEmployee:0,nhf:0,nhis:nhisMonthly,netPay:grossMonthly,exempt:true,employerPension:0,total_employer_cost:grossMonthly};

  const pensionEmployee=grossMonthly*(pensionPct/100);
  const nhf=grossMonthly*(nhfPct/100);
  const totalEmployeeDeductions=pensionEmployee+nhf+nhisMonthly+lifeInsurance;

  const taxableAnnual=Math.max(0,annualGross-totalEmployeeDeductions*12);
  const annualPAYE=pitBands(taxableAnnual);
  const monthlyPAYE=annualPAYE/12;

  const employerPension=grossMonthly*(employerPensionPct/100);
  const totalEmployerCost=grossMonthly+employerPension;

  const netPay=grossMonthly-pensionEmployee-nhf-nhisMonthly-lifeInsurance-monthlyPAYE;

  return{
    ...employee,
    annualGross,
    pensionEmployee,     // 8% of gross  -  employee contribution
    employerPension,     // 10% of gross  -  employer contribution
    nhf,                 // 2.5% of gross  -  National Housing Fund
    nhis:nhisMonthly,    // Fixed monthly NHIS
    lifeInsurance,
    paye:monthlyPAYE,
    annualPAYE,
    totalEmployeeDeductions,
    netPay,
    totalEmployerCost,
    exempt:false,
    effectiveRate:annualGross?(annualPAYE/annualGross)*100:0,
  };
}

function computeAssetCA(asset){
  const cls=CA_CLASSES.find(c=>c.code===asset.assetClass)||CA_CLASSES[10];
  const cost=asset.cost||0;
  const residual=cost*.01;
  const annual=cost*cls.rate;
  const maxYrs=Math.floor((cost-residual)/annual)||1;
  const years=asset.yearsHeld||1;
  const effective=annual*Math.min(years,maxYrs);
  const twdv=Math.max(residual,cost-effective);
  return{...asset,assetLabel:cls.label,rate:cls.rate*100,annual,effective,twdv,residual,maxYrs};
}

  const txnYears=Array.from(new Set(txns.map(t=>{
    const d=new Date(t.date||"");
    return isNaN(d.getFullYear())?null:d.getFullYear();
  }).filter(Boolean))).sort((a,b)=>b-a);
  if(!txnYears.includes(currentYear)) txnYears.unshift(currentYear);
  const [selYear,setSelYear]=useState(currentYear);

  function buildCSV(key, lines){
    const META={
      whtOut:{title:"WHT Remittance Schedule",law:"NTA 2025 Ch.Two Pt.IV  -  Sec 28",due:"21st of next month",note:"WHT deducted from payments made  -  remit to NRS"},
      whtIn: {title:"WHT Credit Schedule",    law:"NTA 2025 Ch.Two Pt.IV  -  Sec 28",due:"Offset on annual return",note:"WHT deducted from income by payers"},
      vatOut:{title:"Output VAT Schedule",    law:"NTA 2025 Ch.Four  -  Sec 54",     due:"21st of next month",note:"VAT charged on taxable supplies"},
      vatIn: {title:"Input VAT Schedule",     law:"NTA 2025 Ch.Four  -  Sec 59",     due:"Deductible from output VAT",note:"VAT on qualifying purchases"},
      payeOut:{title:"PAYE Remittance Schedule",law:"TAA 2025 Sec 13",             due:"10th of next month",note:"PAYE deducted from staff salaries"},
      payeIn:     {title:"PAYE Credit Schedule",      law:"TAA 2025 Sec 13",              due:"Credit on annual PIT return",note:"PAYE deducted by employer"},
      cgtEvents:  {title:"CGT Events  -  Asset Disposals",law:"NTA 2025 S.34-S.46",           due:"31 March following year",    note:"Possible Capital Gains Tax transactions"},
    };
    const m=META[key]||{title:key,law:"NTA 2025",due:"",note:""};
    const grossTotal=lines.reduce((s,l)=>s+l.gross,0);
    const taxTotal=lines.reduce((s,l)=>s+l.tax,0);
    const netTotal=lines.reduce((s,l)=>s+(l.net||l.gross-l.tax),0);

    const hdr=[
      `"${m.title}"`,
      `"Entity: ${entity}"`,
      `"Period: ${period}"`,
      `"Generated: ${today}"`,
      `"Law: ${m.law}"`,
      `"Due Date: ${m.due}"`,
      `"Note: ${m.note}"`,
      `""`,
      `"Date","Description","Gross Amount (₦)","Tax Rate","Tax Amount (₦)","Net Amount (₦)","Status","Law Reference"`,
    ];
    const rows=lines.map(l=>[
      `"${l.date}"`,
      `"${(l.desc||"").replace(/"/g,"'")}"`,
      l.gross.toFixed(2),
      `"${l.rate||""}"`,
      l.tax.toFixed(2),
      (l.net||l.gross-l.tax).toFixed(2),
      `"${l.status||"posted"}"`,
      `"${l.law||m.law}"`,
    ].join(","));
    const totRow=[`"TOTALS","",${grossTotal.toFixed(2)},"",${taxTotal.toFixed(2)},${netTotal.toFixed(2)},"",""`];
    return [...hdr,...rows,...totRow].join("\n");
  }

  function fmtNRS(dateStr){
    const d=new Date(dateStr||"");
    if(isNaN(d.getTime())) return "01/01/25";
    const dd=String(d.getDate()).padStart(2,"0");
    const mm=String(d.getMonth()+1).padStart(2,"0");
    const yy=String(d.getFullYear()).slice(2);
    return dd+"/"+mm+"/"+yy;
  }

    const notes=[

async function getSubscription(userId){
  const {data} = await sb.from("subscriptions").select("*").eq("user_id",userId).single();
  return data;
}

async function createTrialSubscription(userId, plan){
  const now = new Date();
  const trialEnd = new Date(now.getTime() + TRIAL_DAYS*24*60*60*1000);
  await sb.from("subscriptions").upsert({
    user_id: userId, plan, status:"trial",
    trial_start: now.toISOString(),
    trial_end: trialEnd.toISOString(),
    included_users: plan==="company"?2:1,
  });
}

async function pdfToImages(file, onProgress) {
  if(!window.pdfjsLib) throw new Error("PDF.js not loaded  -  please refresh the page and try again.");
  const arrayBuffer = await file.arrayBuffer();
  const loadingTask = window.pdfjsLib.getDocument({data: arrayBuffer, disableFontFace: true});
  const pdf = await loadingTask.promise;
  const numPages = pdf.numPages;
  const images = [];
  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");
  for(let i = 1; i <= numPages; i++){
    if(onProgress) onProgress(i, numPages);
    const page = await pdf.getPage(i);
    const viewport = page.getViewport({scale: 1.5});
    canvas.width  = viewport.width;
    canvas.height = viewport.height;
    await page.render({canvasContext: ctx, viewport}).promise;
    const base64 = canvas.toDataURL("image/jpeg", 0.85).split(",")[1];
    images.push({base64, mediaType: "image/jpeg", isPDF: false});
  }
  return images;
}

function isSubscriptionActive(sub){
  if(!sub) return false;
  if(sub.status==="active") return true;
  if(sub.status==="trial"){
    return new Date(sub.trial_end) > new Date();
  }
  return false;
}

function trialDaysLeft(sub){
  if(!sub||sub.status!=="trial") return 0;
  const diff = new Date(sub.trial_end) - new Date();
  return Math.max(0, Math.ceil(diff/(1000*60*60*24)));
}

function currentMonthKey(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
}

function aiImportsRemaining(sub, plan){
  if(!sub) return 0;
  const limit = AI_IMPORT_LIMITS[plan] || AI_IMPORT_LIMITS.individual;
  const thisMonth = currentMonthKey();
  const used = (sub.ai_imports_month === thisMonth) ? (sub.ai_imports_used||0) : 0;
  return Math.max(0, limit - used);
}

async function checkAndIncrementAiImport(sub, userId, plan){
  if(!sub || !userId) return { allowed:false, remaining:0 };
  const limit = AI_IMPORT_LIMITS[plan] || AI_IMPORT_LIMITS.individual;
  const thisMonth = currentMonthKey();
  const alreadyUsed = (sub.ai_imports_month === thisMonth) ? (sub.ai_imports_used||0) : 0;
  if(alreadyUsed >= limit) return { allowed:false, remaining:0 };
  const newUsed = alreadyUsed + 1;
  try {
    await sb.from("subscriptions").update({
      ai_imports_used: newUsed,
      ai_imports_month: thisMonth,
    }).eq("user_id", userId);
  } catch(_) {
    console.warn("ai_imports columns not yet created in subscriptions table");
  }
  return { allowed:true, remaining: limit - newUsed };
}

function initPaystack({email, amount, onSuccess, onClose, metadata={}}) {
  const handler = window.PaystackPop.setup({
    key: PAYSTACK_KEY,
    email,
    amount, // in kobo
    currency: "NGN",
    ref: `tw_${Date.now()}_${Math.random().toString(36).substr(2,9)}`,
    metadata,
    callback: (response) => onSuccess(response),
    onClose: () => onClose && onClose(),
  });
  handler.openIframe();
}
