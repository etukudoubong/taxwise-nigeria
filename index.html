              Always choose Excel or CSV when your bank offers it.
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function DocumentUploadScreen({profile, authUser, setTxns, txns, assets, setAssets, onBack, sub, setSub}){
  const [mode, setMode]           = useState("select"); // select | camera | processing | review | edit | done
  const [extracted, setExtracted] = useState([]);
  const [editIdx, setEditIdx]     = useState(null);
  const [editForm, setEditForm]   = useState({});
  const [docType, setDocType]     = useState("bank_statement");
  const [progress, setProgress]   = useState("");
  const [error, setError]         = useState("");
  const [capturedPages, setCapturedPages] = useState([]); // [{base64, mediaType, label}]
  const isCompany = profile.mode==="company";

  const CA_CLASSES_SIMPLE = [
    {code:"buildings",  label:"Buildings / Masts / Agric (10%)",   rate:10},
    {code:"plant",      label:"Plant / Furniture / Mining (20%)",   rate:20},
    {code:"vehicles",   label:"Vehicles (25%)",                      rate:25},
    {code:"software",   label:"Software / Intangibles (25%)",        rate:25},
    {code:"other",      label:"Other Plant & Equipment (20%)",       rate:20},
  ];

  const processFile = async (file) => {
    setMode("processing"); setError("");
    setProgress("Reading document…");
    try {
      const maxSize = 10 * 1024 * 1024; // 10MB — covers most bank statement PDFs
      if(file.size > maxSize){
        throw new Error(`File too large (${(file.size/1024/1024).toFixed(1)}MB). Maximum is 10MB. Try compressing the PDF or splitting it into smaller sections.`);
      }
      const validTypes = ["application/pdf","image/jpeg","image/jpg","image/png","image/webp","image/gif"];
      const ext = (file.name||"").split(".").pop().toLowerCase();
      const validExts = ["pdf","jpg","jpeg","png","webp","gif"];
      if(!validTypes.includes(file.type) && !validExts.includes(ext)){
        throw new Error(`Unsupported file type: ${file.type||ext}. Please use PDF, JPG, or PNG.`);
      }
      const isPDF = file.type==="application/pdf" || ext==="pdf";
      const mediaType = isPDF ? "application/pdf" : (file.type || "image/jpeg");
      setProgress("Reading document… this may take a moment for large PDFs");
      const base64 = await new Promise((res,rej)=>{
        const reader = new FileReader();
        reader.onload = ()=>res(reader.result.split(",")[1]);
        reader.onerror = ()=>rej(new Error("Could not read file — try a different PDF viewer to re-save it"));
        reader.readAsDataURL(file);
      });
      await sendToAI([{base64, mediaType, isPDF}]);
    } catch(e){
      setError(e.message||"Failed to process document");
      setMode("select");
    }
  };

  const processPages = async (pages) => {
    setMode("processing"); setError("");
    setProgress("AI is reading your document…");
    try {
      await sendToAI(pages.map(p=>({base64:p.base64, mediaType:p.mediaType, isPDF:false})));
    } catch(e){
      setError(e.message||"Failed to process document");
      setMode("select");
    }
  };

  const sendToAI = async (pages) => {
    if(authUser && sub){
      const plan = sub.plan||"individual";
      const check = await checkAndIncrementAiImport(sub, authUser.id, plan);
      if(!check.allowed){
        const limit = AI_IMPORT_LIMITS[plan]||AI_IMPORT_LIMITS.individual;
        setError(
          "Monthly AI import limit reached (" + limit + "/" + limit + " used).\n\n" +
          "Your limit resets on the 1st of next month.\n\n" +
          "Alternatives:\n" +
          "1. Download as Excel from your bank app (no AI needed, no limit)\n" +
          "2. Upgrade to a higher plan for more imports"
        );
        setMode("select");
        return;
      }
      if(setSub) setSub(s => s ? ({...s, ai_imports_used:(s.ai_imports_month===currentMonthKey()?(s.ai_imports_used||0)+1:1), ai_imports_month:currentMonthKey()}) : s);
    }
    setProgress("AI is analysing your document…");
    const isBankStatement = docType === "bank_statement";
    const multiPage = pages.length > 1;

    const systemPrompt = `You are a Nigerian bank statement processor. Extract ALL transactions from the document provided.

NIGERIAN BANK DATE FORMATS — convert all to YYYY-MM-DD:
- DD-MON-YY e.g. 04-JAN-16 = 2016-01-04, 15-SEP-20 = 2020-09-15
- DD-MON-YYYY e.g. 04-JAN-2016
- DDMONYY e.g. 04JAN16, 01MAR16 (no separator, 2-digit year — add 2000)
- DD/MM/YYYY, YYYY-MM-DD

POLARIS/SKYE BANK FORMAT (EntryDate | Details | ValueDate | Debit | Credit | Balance):
- Use EntryDate as the date, ignore ValueDate column
- Debit=0 means it is a Credit transaction; Credit=0 means it is a Debit transaction
- Skip "Balance B/F" opening balance rows and Totals rows
${isBankStatement && multiPage ? `
MULTI-PAGE RULE: First page has column headers. ALL subsequent pages use the SAME column structure even if headers are not repeated. Apply first-page headers to every page.
` : ""}
Return ONLY a valid JSON array. Each item must have:
- date: "YYYY-MM-DD"
- desc: full description of transaction
- amount: positive number
- type: "income" | "expense" | "asset"
- category: one of "revenue" | "salary" | "rent" | "professional_fee" | "supplies" | "utility" | "tax_payment" | "bank_charge" | "loan" | "capital_asset" | "other"
- assetClass: ONLY if type="asset" — one of "buildings" | "plant" | "vehicles" | "software" | "other"
- confidence: "high" | "medium" | "low"
- vatFlag: boolean — see VAT rules below
- whtFlag: true if WHT is applicable (professional fees, rent, dividends, interest), else false
- taxAllowable: true for allowable items, false for non-allowable

CRITICAL CLASSIFICATION RULES for Nigerian accounting (NTA 2025):
- Bank credits = income. Bank debits = expense (or asset if capital).
- Capital assets (type="asset"): purchases of land, buildings, vehicles, computers, machinery, equipment, furniture — anything with useful life > 1 year.
- NON-ALLOWABLE items — taxAllowable=false: loan CAPITAL repayments, accounting depreciation, fines/penalties, personal expenses, dividends paid, income tax payments, drawings.
- WHT applies to: professional fees, consulting, rent, dividends, interest, royalties, commissions.
- Loan repayment: Split into interest (taxAllowable=true) and principal (taxAllowable=false).
- Expenses on which VAT or import duty is outstanding are NON-DEDUCTIBLE (taxAllowable=false) until the VAT is settled.

VAT RULES (NTA 2025) — TAXPAYER PROFILE: ${isCompany ? "COMPANY" : "INDIVIDUAL/SELF-EMPLOYED"}
${isCompany ? `- This taxpayer is a COMPANY. Flag vatFlag=true on all transactions where 7.5% VAT applies — standard-rated supplies, professional fees, services, goods.
- Input VAT is now recoverable on goods, services, AND capital asset purchases under NTA 2025.
- Small company exemption (turnover ≤₦100m AND fixed assets ≤₦250m): if this appears to be a small company, vatFlag=false — they are exempt from charging VAT.
- Zero-rated supplies (exports, food, medical equipment, educational materials, electricity): vatFlag=true but note zero-rated — input VAT still recoverable.` 
: `- This taxpayer is an INDIVIDUAL or SELF-EMPLOYED person.
- INDIVIDUALS DO NOT CHARGE, COLLECT, OR FILE VAT under NTA 2025.
- Set vatFlag=false on ALL transactions unless turnover clearly exceeds ₦50 million/year.
- The individual may PAY VAT as a consumer on purchases — but this does not make them a VAT collector.
- Only flag vatFlag=true if this is clearly a high-turnover self-employed person (turnover > ₦50m/year) who is VAT-registered.
- When in doubt: vatFlag=false for individuals.`}

Return ONLY the JSON array, no other text or markdown.`;

    const contentBlocks = [];
    pages.forEach((p) => {
      contentBlocks.push({
        type: p.isPDF ? "document" : "image",
        source: {type:"base64", media_type:p.mediaType, data:p.base64}
      });
    });
    const pageLabel = pages.length > 1
      ? `This is a ${pages.length}-page ${docType.replace(/_/g," ")}. Page 1 contains the column headers. Apply the same column structure to all subsequent pages. Extract every transaction from all pages.`
      : `Extract and classify all transactions from this ${docType.replace(/_/g," ")}.`;
    contentBlocks.push({type:"text", text: pageLabel + " Return only the JSON array."});

    const res = await fetch(`${SUPA_URL}/functions/v1/taxwise-ai`,{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":`Bearer ${SUPA_KEY}`,
        "apikey": SUPA_KEY,
      },
      body: JSON.stringify({system: systemPrompt, messages:[{role:"user", content: contentBlocks}], docType, totalPages: pages.length})
    });

    if(!res.ok){
      const errData = await res.json().catch(()=>({}));
      const errMsg = errData?.error || `Server error ${res.status}`;
      if(res.status===546||res.status===504||res.status===524||errMsg.toLowerCase().includes("timeout")){
        throw new Error("Processing timed out — PDF is too large for a single request.\n\nSolutions:\n1. Download as Excel from your bank app (fastest)\n2. Split PDF into 20-page sections and upload each separately\n3. Use Camera Scan to photograph pages individually");
      }
      throw new Error(errMsg);
    }
    const data = await res.json();
    if(data.error){
      const e = data.error;
      if(e.toLowerCase().includes("password")||e.toLowerCase().includes("encrypted")){
        throw new Error("This PDF is password-protected (common with GTBank, Access, UBA statements).\n\nTo fix: open the PDF, enter the password (usually your date of birth e.g. 15061985), then Print → Save as PDF to create an unlocked copy. Upload that instead.\n\nOr download your statement as Excel from your bank app.");
      }
      if(e.toLowerCase().includes("timeout")||e.toLowerCase().includes("time out")){
        throw new Error("Processing timed out — PDF is too large for a single request.\n\nSolutions:\n1. Download as Excel from your bank app (fastest)\n2. Split PDF into 20-page sections\n3. Use Camera Scan to photograph each page");
      }
      throw new Error(e);
    }
    setProgress("Parsing results…");

    let txnList = [];
    try {
      const raw = data.reply||"[]";
      let clean = raw.replace(/```json|```/g,"").trim();
      const arrStart = clean.indexOf("[");
      const arrEnd   = clean.lastIndexOf("]");
      if(arrStart !== -1 && arrEnd > arrStart){
        clean = clean.slice(arrStart, arrEnd + 1);
      }
      if(clean && !clean.endsWith("]")){
        const lastClose = clean.lastIndexOf("}");
        clean = lastClose !== -1 ? clean.slice(0, lastClose+1)+"]" : "[]";
      }
      const parsed = JSON.parse(clean);
      txnList = Array.isArray(parsed) ? parsed : (parsed.transactions || parsed.items || []);
    } catch(e){
      const preview = (data.reply||"").slice(0,200);
      throw new Error("Could not parse AI response — please try again. Preview: "+preview);
    }

    if(!Array.isArray(txnList)||txnList.length===0)
      throw new Error("No transactions found in document. Make sure the document contains financial transactions.");

    const formatted = txnList.map((t,i)=>{
      const isNonAllowable = t.taxAllowable === false ||
        t.category === "loan_repayment" ||
        /loan.*principal|capital repayment|depreciation|income tax paid|penalty.*tax|drawing|dividend paid/i.test(t.desc||"");
      return {
        id: `doc_${Date.now()}_${i}`,
        date: t.date||new Date().toISOString().split("T")[0],
        desc: t.desc||"Imported transaction",
        amount: Math.abs(parseFloat(t.amount)||0),
        type: t.type==="asset"?"asset": t.type==="income"?"income":"expense",
        category: t.category||"other",
        assetClass: t.assetClass||"other",
        source: "document",
        compliance_status: "pending",
        confidence: t.confidence||"medium",
        vatFlag: isCompany ? !!t.vatFlag : false,
        whtFlag: !!t.whtFlag,
        taxAllowable: !isNonAllowable,
        included: !isNonAllowable,
      };
    });

    setExtracted(formatted);
    setMode("review");
  };

  const handleFileInput = (e) => {
    const file = e.target.files[0];
    if(!file) return;
    processFile(file);
  };

  const updateItem = (id, field, value) => {
    setExtracted(ex=>ex.map(t=>t.id===id?{...t,[field]:value}:t));
  };

  const openEdit = (idx) => {
    setEditIdx(idx);
    setEditForm({...extracted[idx]});
    setMode("edit");
  };

  const saveEdit = () => {
    setExtracted(ex=>ex.map((t,i)=>i===editIdx?{...editForm}:t));
    setMode("review");
    setEditIdx(null);
  };

  const postAll = () => {
    const included = extracted.filter(t=>t.included);
    const toJournal = included.filter(t=>t.type!=="asset")
      .map(({confidence,included,vatFlag,whtFlag,category,assetClass,...t})=>t);
    const toAssets = included.filter(t=>t.type==="asset").map(t=>({
      id: t.id,
      name: t.desc,
      assetClass: t.assetClass||"other",
      cost: t.amount,
      dateAcquired: t.date,
      yearsHeld: 1,
      businessPct: 100,
      imported: false,
      eligibility: "passed",
    }));
    // Also post excluded transactions for reference/review
    const excluded = extracted.filter(t=>!t.included&&t.amount>0&&t.type!=="asset").map(t=>({
      ...t, compliance_status:"excluded", included:false,
    }));

    if(toJournal.length>0) setTxns([...txns,...toJournal]);
    if(excluded.length>0) setTxns(prev=>[...prev,...excluded]);
    if(toAssets.length>0 && setAssets) setAssets([...(assets||[]),...toAssets]);
    setMode("done");
  };

  const incl = extracted.filter(t=>t.included);
  const assets_ = incl.filter(t=>t.type==="asset");
  const expenses_ = incl.filter(t=>t.type==="expense");
  const income_ = incl.filter(t=>t.type==="income");

  if(mode==="edit"&&editForm.id) return(
    <div style={{paddingBottom:100}}>
      <Hdr title="Edit Transaction" onBack={()=>setMode("review")} subtitle="Make corrections before importing"/>
      <div style={{padding:"12px 12px 0"}}>
        <div className="card">
          <div className="fg">
            <label className="lbl">DESCRIPTION</label>
            <input className="inp" value={editForm.desc||""} onChange={e=>setEditForm(f=>({...f,desc:e.target.value}))}/>
          </div>
          <div className="fg">
            <label className="lbl">DATE</label>
            <input className="inp" type="date" value={editForm.date||""} onChange={e=>setEditForm(f=>({...f,date:e.target.value}))}/>
          </div>
          <div className="fg">
            <label className="lbl">AMOUNT (₦)</label>
            <input className="inp" type="number" value={editForm.amount||""} onChange={e=>setEditForm(f=>({...f,amount:parseFloat(e.target.value)||0}))}/>
          </div>
          <div className="fg">
            <label className="lbl">TYPE</label>
            <select className="sel" value={editForm.type||"expense"} onChange={e=>setEditForm(f=>({...f,type:e.target.value}))}>
              <option value="income">Income / Revenue</option>
              <option value="expense">Expense (revenue expenditure)</option>
              {isCompany&&<option value="asset">Capital Asset (goes to asset register)</option>}
            </select>
          </div>
          {editForm.type==="asset"&&(
            <div className="fg">
              <label className="lbl">ASSET CLASS — NTA 2025 FIRST SCHEDULE</label>
              <select className="sel" value={editForm.assetClass||"other"} onChange={e=>setEditForm(f=>({...f,assetClass:e.target.value}))}>
                {CA_CLASSES_SIMPLE.map(c=>(
                  <option key={c.code} value={c.code}>{c.label}</option>
                ))}
              </select>
              <div style={{fontSize:10,color:C.muted,marginTop:4}}>
                Capital allowance will be computed automatically at the applicable rate under NTA 2025.
              </div>
            </div>
          )}
          <div className="fg">
            <label className="lbl">VAT APPLICABLE?</label>
            <select className="sel" value={editForm.vatFlag?"yes":"no"} onChange={e=>setEditForm(f=>({...f,vatFlag:e.target.value==="yes"}))}>
              <option value="no">No VAT</option>
              <option value="yes">Yes — VAT @ 7.5% applies</option>
            </select>
          </div>
          <div className="fg">
            <label className="lbl">WHT APPLICABLE?</label>
            <select className="sel" value={editForm.whtFlag?"yes":"no"} onChange={e=>setEditForm(f=>({...f,whtFlag:e.target.value==="yes"}))}>
              <option value="no">No WHT</option>
              <option value="yes">Yes — WHT applies (5% or 10%)</option>
            </select>
          </div>
        </div>
        <button onClick={saveEdit}
          style={{width:"100%",padding:"14px",background:C.blue,border:"none",borderRadius:12,
            color:"#fff",fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
          Save Changes →
        </button>
      </div>
    </div>
  );

  if(mode==="done") return(
    <div style={{paddingBottom:100}}>
      <Hdr title="Import Complete" onBack={onBack}/>
      <div style={{padding:"32px 20px",textAlign:"center"}}>
        <div style={{fontSize:48,marginBottom:16}}>✅</div>
        <div style={{fontSize:20,fontWeight:700,color:C.ink,marginBottom:8}}>Import successful</div>
        <div style={{background:"#F8FAFC",border:"1px solid #E2E8F0",borderRadius:14,padding:"16px",margin:"16px 0",textAlign:"left"}}>
          {income_.length>0&&<div style={{display:"flex",justifyContent:"space-between",padding:"6px 0",borderBottom:"1px solid #E2E8F0",fontSize:13}}>
            <span style={{color:C.slate}}>Income entries added</span>
            <span style={{fontWeight:700,color:C.green}}>{income_.length}</span>
          </div>}
          {expenses_.length>0&&<div style={{display:"flex",justifyContent:"space-between",padding:"6px 0",borderBottom:"1px solid #E2E8F0",fontSize:13}}>
            <span style={{color:C.slate}}>Expense entries added</span>
            <span style={{fontWeight:700,color:C.red}}>{expenses_.length}</span>
          </div>}
          {assets_.length>0&&<div style={{display:"flex",justifyContent:"space-between",padding:"6px 0",fontSize:13}}>
            <span style={{color:C.slate}}>Assets added to register</span>
            <span style={{fontWeight:700,color:C.blue}}>{assets_.length}</span>
          </div>}
        </div>
        {assets_.length>0&&(
          <div className="ibox green" style={{textAlign:"left",marginBottom:16}}>
            <div className="ititle" style={{color:C.green}}>🏭 Assets routed to Asset Register</div>
            <p style={{fontSize:11,color:C.ink,lineHeight:1.6}}>
              Capital expenditure items have been added directly to your Asset Register where Capital Allowance will be computed automatically under NTA 2025 First Schedule — not treated as revenue expenses.
            </p>
          </div>
        )}
        <button onClick={onBack} style={{padding:"13px 32px",background:C.blue,border:"none",
          borderRadius:12,color:"#fff",fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
          Go to Journal →
        </button>
      </div>
    </div>
  );

  if(mode==="processing") return(
    <div style={{paddingBottom:100}}>
      <Hdr title="Analysing Document" onBack={onBack}/>
      <div style={{padding:"60px 20px",textAlign:"center"}}>
        <div style={{fontSize:48,marginBottom:20}}>🔍</div>
        <div style={{fontSize:16,fontWeight:600,color:C.ink,marginBottom:8}}>AI is reading your document</div>
        <div style={{fontSize:13,color:C.muted,lineHeight:1.6,marginBottom:20}}>{progress}</div>
        <div style={{display:"flex",justifyContent:"center",gap:6}}>
          {[0,1,2].map(i=>(
            <div key={i} style={{width:8,height:8,borderRadius:4,background:C.blue,
              animation:`pulse 1.2s ease-in-out ${i*0.2}s infinite`}}/>
          ))}
        </div>
      </div>
    </div>
  );

  if(mode==="review") return(
    <div style={{paddingBottom:100}}>
      <Hdr title="Review & Edit" onBack={()=>setMode("select")}
        right={<button className="btn-sm btn-sm-blue" onClick={()=>setExtracted(ex=>ex.map(t=>({...t,included:true})))}>All</button>}/>

      {/* Summary hero */}
      <div style={{background:`linear-gradient(135deg,${C.navy},#1E3A5F)`,padding:"16px 16px 20px",color:"#fff"}}>
        <div style={{fontSize:10,opacity:.6,letterSpacing:".1em",marginBottom:6}}>EXTRACTED FROM DOCUMENT</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
          {[
            {l:"Income",   v:extracted.filter(t=>t.type==="income").length,  c:"#4ADE80"},
            {l:"Expenses", v:extracted.filter(t=>t.type==="expense").length, c:"#F87171"},
            {l:"Assets",   v:extracted.filter(t=>t.type==="asset").length,   c:"#93C5FD"},
          ].map(s=>(
            <div key={s.l} style={{background:"rgba(255,255,255,.1)",borderRadius:8,padding:"8px 10px",textAlign:"center"}}>
              <div style={{fontSize:20,fontWeight:800,color:s.c}}>{s.v}</div>
              <div style={{fontSize:9,opacity:.7,marginTop:2}}>{s.l}</div>
            </div>
          ))}
        </div>
        <div style={{fontSize:11,opacity:.6,marginTop:10}}>
          {incl.length} of {extracted.length} selected · Tap any item to edit
        </div>
      </div>

      <div style={{padding:"12px 12px 0"}}>
        <div className="ibox blue" style={{marginBottom:12}}>
          <p style={{fontSize:11,color:C.ink,lineHeight:1.6}}>
            ✏️ <strong>Tap any transaction to edit</strong> — correct descriptions, amounts, dates, or classification.{"\n"}
            🏭 Items marked <strong style={{color:C.blue}}>ASSET</strong> go to your Asset Register (not expenses).{"\n"}
            ⚠️ Items marked <strong style={{color:"#DC2626"}}>NOT TAX DEDUCTIBLE</strong> are <strong>unchecked by default</strong> — tick them only if you want them in your records for accounting purposes. They will NOT reduce your tax liability.{"\n"}
            ☑️ Uncheck items you don't want to import.
          </p>
        </div>

        {/* Group by type */}
        {["asset","income","expense"].map(typeGroup=>{
          const items = extracted.filter(t=>t.type===typeGroup);
          if(items.length===0) return null;
          const typeColors = {asset:{bg:C.blueLight,color:C.blue,label:"🏭 CAPITAL ASSETS → Asset Register"},
            income:{bg:C.greenBg,color:C.green,label:"💰 INCOME"},
            expense:{bg:C.redBg,color:C.red,label:"💸 EXPENSES"}};
          const tc = typeColors[typeGroup];
          return(
            <div key={typeGroup} style={{marginBottom:16}}>
              <div style={{fontSize:10,fontWeight:700,letterSpacing:".08em",color:tc.color,
                background:tc.bg,padding:"6px 12px",borderRadius:8,marginBottom:8,display:"inline-block"}}>
                {tc.label} ({items.length})
              </div>
              {items.map((t,localIdx)=>{
                const globalIdx = extracted.findIndex(x=>x.id===t.id);
                return(
                  <div key={t.id} style={{background:"#fff",
                    border:`1.5px solid ${t.included?(typeGroup==="asset"?C.blue:typeGroup==="income"?C.green:C.border):C.border}`,
                    borderRadius:12,padding:"11px 13px",marginBottom:8,
                    opacity:t.included?1:0.45}}>
                    <div style={{display:"flex",gap:10,alignItems:"flex-start"}}>
                      {/* Checkbox */}
                      <input type="checkbox" checked={!!t.included}
                        onChange={()=>updateItem(t.id,"included",!t.included)}
                        style={{marginTop:3,accentColor:C.blue,width:16,height:16,flexShrink:0}}/>
                      {/* Content */}
                      <div style={{flex:1,minWidth:0}} onClick={()=>openEdit(globalIdx)}>
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:4}}>
                          <div style={{fontSize:13,fontWeight:600,color:C.ink,lineHeight:1.3,flex:1,marginRight:8}}>
                            {t.desc}
                          </div>
                          <div style={{fontSize:14,fontWeight:700,flexShrink:0,
                            color:typeGroup==="income"?C.green:typeGroup==="asset"?C.blue:C.red}}>
                            {typeGroup==="income"?"+":""}{fmt(t.amount)}
                          </div>
                        </div>
                        <div style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}}>
                          <span style={{fontSize:10,color:C.muted}}>{t.date}</span>
                          {!t.taxAllowable&&(
                            <span style={{fontSize:9,background:"#FEF2F2",color:"#DC2626",
                              padding:"2px 8px",borderRadius:100,fontWeight:700,border:"1px solid #FECACA"}}>
                              ⚠ NOT TAX DEDUCTIBLE
                            </span>
                          )}
                          {typeGroup==="asset"&&(
                            <span style={{fontSize:9,background:C.blueLight,color:C.blue,
                              padding:"2px 7px",borderRadius:100,fontWeight:700}}>
                              {CA_CLASSES_SIMPLE.find(c=>c.code===t.assetClass)?.label.split("(")[0].trim()||t.assetClass}
                            </span>
                          )}
                          {t.vatFlag&&<span style={{fontSize:9,background:"#FFF7ED",color:C.amber,padding:"2px 6px",borderRadius:100,fontWeight:700}}>VAT</span>}
                          {t.whtFlag&&<span style={{fontSize:9,background:"#FEF2F2",color:C.red,padding:"2px 6px",borderRadius:100,fontWeight:700}}>WHT</span>}
                          <span style={{fontSize:9,color:t.confidence==="high"?C.green:t.confidence==="medium"?C.amber:C.red}}>
                            {t.confidence}
                          </span>
                          <span style={{fontSize:9,color:C.blue,fontWeight:600}}>✏️ tap to edit</span>
                        </div>
                        {!t.taxAllowable&&t.included&&(
                          <div style={{marginTop:6,padding:"5px 8px",background:"#FEF2F2",
                            border:"1px solid #FECACA",borderRadius:6,fontSize:10,color:"#DC2626",lineHeight:1.4}}>
                            ⚠ You have manually included a non-deductible item. This will appear in your records but will NOT reduce your tax liability.
                          </div>
                        )}
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          );
        })}

        {/* Summary before posting */}
        <div className="card" style={{background:`linear-gradient(135deg,${C.navy},#1E3A5F)`,border:"none",marginBottom:16}}>
          <div style={{fontSize:10,fontWeight:700,color:"rgba(255,255,255,.5)",letterSpacing:".08em",marginBottom:10}}>IMPORT SUMMARY</div>
          {[
            {l:`Income entries (→ Journal)`,       v:income_.length,   c:"#4ADE80"},
            {l:`Expense entries (→ Journal)`,       v:expenses_.length, c:"#F87171"},
            {l:`Assets (→ Asset Register)`,         v:assets_.length,   c:"#93C5FD"},
          ].map(r=>(
            <div key={r.l} style={{display:"flex",justifyContent:"space-between",padding:"6px 0",
              borderBottom:"1px solid rgba(255,255,255,.07)"}}>
              <span style={{fontSize:11,color:"rgba(255,255,255,.6)"}}>{r.l}</span>
              <span style={{fontSize:12,fontWeight:700,color:r.c}}>{r.v}</span>
            </div>
          ))}
        </div>

        <button onClick={postAll} disabled={incl.length===0}
          style={{width:"100%",padding:"15px",
            background:incl.length===0?"#94A3B8":"#059669",
            border:"none",borderRadius:12,color:"#fff",fontSize:14,fontWeight:700,
            cursor:incl.length===0?"not-allowed":"pointer",fontFamily:"inherit",
            boxShadow:incl.length===0?"none":"0 6px 0 #047857"}}>
          Import {incl.length} item{incl.length!==1?"s":""}{assets_.length>0?` (${assets_.length} to Asset Register)`:""}  →
        </button>
      </div>
    </div>
  );

  return(
    <div style={{paddingBottom:100}}>
      <Hdr title="Import Document" onBack={onBack} subtitle="AI-powered extraction & classification"/>
      <div style={{background:`linear-gradient(135deg,${C.navy},#1E3A5F)`,padding:"20px 16px",color:"#fff"}}>
        <div style={{fontSize:10,opacity:.6,letterSpacing:".1em",marginBottom:4}}>SMART DOCUMENT IMPORT</div>
        <div style={{fontSize:20,fontWeight:800,marginBottom:6}}>Upload a Document</div>
        <div style={{fontSize:12,opacity:.65,lineHeight:1.7}}>
          AI reads your statement, extracts transactions, and identifies capital assets automatically. You review and edit before importing.
        </div>
      </div>

      <div style={{padding:"12px 12px 0"}}>
        {error&&<div style={{background:C.redBg,border:`1px solid ${C.red}30`,borderRadius:10,
          padding:"10px 12px",fontSize:12,color:C.red,marginBottom:12}}>⚠️ {error}</div>}

        {/* AI import usage banner */}
        {sub&&(()=>{
          const plan = sub.plan||"individual";
          const rem = aiImportsRemaining(sub, plan);
          const limit = AI_IMPORT_LIMITS[plan]||AI_IMPORT_LIMITS.individual;
          if(rem===0) return (
            <div style={{background:"#FEF2F2",border:"1px solid #FCA5A5",borderRadius:10,
              padding:"10px 12px",fontSize:12,color:"#DC2626",marginBottom:12,lineHeight:1.5}}>
              <strong>AI import limit reached</strong> ({limit}/{limit} used this month).
              Limit resets 1st of next month.
            </div>
          );
          if(rem<=2) return (
            <div style={{background:"#FFFBEB",border:"1px solid #FCD34D",borderRadius:10,
              padding:"10px 12px",fontSize:12,color:"#92400E",marginBottom:12}}>
              ⚠️ Only <strong>{rem} AI import{rem===1?"":"s"}</strong> remaining this month.
            </div>
          );
          return null;
        })()}

        <div className="card">
          <div className="ctitle">DOCUMENT TYPE</div>
          <select className="sel" value={docType} onChange={e=>setDocType(e.target.value)}>
            <option value="bank_statement">Bank Statement</option>
            <option value="receipt">Receipt / Invoice</option>
            <option value="expense_report">Expense Report</option>
            <option value="other">Other Financial Document</option>
          </select>
        </div>

        {/* ── CAMERA: multi-page capture mode ── */}
        {mode==="camera" ? (
          <div>
            <div style={{background:`linear-gradient(135deg,${C.navy},#1E3A5F)`,borderRadius:16,
              padding:"16px",marginBottom:12,boxShadow:"0 4px 16px rgba(11,22,40,.3)"}}>
              <div style={{fontSize:13,fontWeight:700,color:"#fff",marginBottom:8}}>
                📷 Multi-Page Camera Scan
              </div>
              <div style={{fontSize:11,color:"rgba(255,255,255,.65)",marginBottom:12,lineHeight:1.6}}>
                Capture each page one at a time. The AI will read all pages together as a single document.
              </div>
              {/* Captured pages thumbnails */}
              {capturedPages.length>0&&(
                <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:12}}>
                  {capturedPages.map((pg,idx)=>(
                    <div key={idx} style={{position:"relative",width:64,height:80,borderRadius:8,
                      overflow:"hidden",border:"2px solid rgba(255,255,255,.3)"}}>
                      <img src={`data:${pg.mediaType};base64,${pg.base64}`}
                        style={{width:"100%",height:"100%",objectFit:"cover"}} alt={`Page ${idx+1}`}/>
                      <div style={{position:"absolute",top:0,left:0,right:0,
                        background:"rgba(0,0,0,.55)",padding:"2px 0",
                        textAlign:"center",fontSize:9,color:"#fff",fontWeight:700}}>
                        Pg {idx+1}
                      </div>
                      <button onClick={()=>setCapturedPages(p=>p.filter((_,i)=>i!==idx))}
                        style={{position:"absolute",bottom:0,left:0,right:0,
                          background:"rgba(220,38,38,.85)",border:"none",color:"#fff",
                          fontSize:10,fontWeight:700,padding:"3px 0",cursor:"pointer",fontFamily:"inherit"}}>
                        ✕ Remove
                      </button>
                    </div>
                  ))}
                </div>
              )}
              {/* Add page button */}
              <label style={{display:"block",marginBottom:10}}>
                <input type="file" accept="image/*" capture="environment"
                  onChange={async(e)=>{
                    const file=e.target.files[0]; if(!file) return;
                    const b64=await new Promise((res,rej)=>{
                      const r=new FileReader();
                      r.onload=()=>res(r.result.split(",")[1]);
                      r.onerror=()=>rej(new Error("Read failed"));
                      r.readAsDataURL(file);
                    });
                    setCapturedPages(p=>[...p,{base64:b64,mediaType:file.type||"image/jpeg",label:`Page ${p.length+1}`}]);
                    e.target.value="";
                  }} style={{display:"none"}}/>
                <div style={{background:"rgba(255,255,255,.15)",border:"2px dashed rgba(255,255,255,.4)",
                  borderRadius:10,padding:"12px",textAlign:"center",cursor:"pointer"}}>
                  <span style={{fontSize:20,marginRight:8}}>📷</span>
                  <span style={{fontSize:13,fontWeight:700,color:"#fff"}}>
                    {capturedPages.length===0?"Capture Page 1":`Capture Page ${capturedPages.length+1}`}
                  </span>
                </div>
              </label>
              {/* Action buttons */}
              <div style={{display:"flex",gap:8}}>
                <button onClick={()=>{setCapturedPages([]);setMode("select");}}
                  style={{flex:1,padding:"10px",background:"rgba(255,255,255,.1)",border:"1px solid rgba(255,255,255,.25)",
                    borderRadius:9,color:"#fff",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
                  Cancel
                </button>
                {capturedPages.length>0&&(
                  <button onClick={()=>processPages(capturedPages)}
                    style={{flex:2,padding:"10px",background:"#059669",border:"none",
                      borderRadius:9,color:"#fff",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit",
                      boxShadow:"0 4px 0 #047857"}}>
                    ✓ Done — Analyse {capturedPages.length} Page{capturedPages.length!==1?"s":""}
                  </button>
                )}
              </div>
            </div>
          </div>
        ) : (
          <>
            {/* Camera entry button */}
            <div onClick={()=>{setCapturedPages([]);setMode("camera");}}
              style={{background:`linear-gradient(135deg,${C.navy},#1E3A5F)`,borderRadius:16,
                padding:"28px 20px",textAlign:"center",cursor:"pointer",
                boxShadow:"0 4px 16px rgba(11,22,40,.3)",marginBottom:12}}>
              <div style={{fontSize:40,marginBottom:12}}>📷</div>
              <div style={{fontSize:16,fontWeight:700,color:"#fff",marginBottom:4}}>Scan with Camera</div>
              <div style={{fontSize:12,color:"rgba(255,255,255,.6)"}}>Capture one or multiple pages</div>
            </div>

            {/* File upload */}
            <label style={{display:"block",marginBottom:12}}>
              <input type="file" accept=".pdf,image/*"
                onChange={handleFileInput} style={{display:"none"}}/>
              <div style={{background:"#fff",border:`2px dashed ${C.border}`,borderRadius:16,
                padding:"28px 20px",textAlign:"center",cursor:"pointer"}}>
                <div style={{fontSize:40,marginBottom:12}}>📄</div>
                <div style={{fontSize:16,fontWeight:700,color:C.ink,marginBottom:4}}>Upload PDF or Image</div>
                <div style={{fontSize:12,color:C.muted}}>Select from your phone storage</div>
              </div>
            </label>
          </>
        )}

        <div className="ibox blue">
          <div className="ititle" style={{color:C.blue}}>How it works</div>
          <p style={{fontSize:11,color:C.ink,lineHeight:1.8}}>
            1️⃣ Scan each page separately or upload a PDF{"\n"}
            2️⃣ AI reads all pages together — even without repeated headers{"\n"}
            3️⃣ Capital asset purchases are flagged separately{"\n"}
            4️⃣ You review, edit anything incorrect, then import{"\n"}
            5️⃣ Expenses go to Journal · Assets go to Asset Register
          </p>
        </div>
      </div>
    </div>
  );
}

function AuthScreen({onAuth}){
  const [mode, setMode]         = useState("login"); // login | signup | reset
  const [email, setEmail]       = useState("");
  const [password, setPassword] = useState("");
  const [loading, setLoading]   = useState(false);
  const [error, setError]       = useState("");
  const [info, setInfo]         = useState("");
  const [showPass, setShowPass] = useState(false);

  const err = msg => { setError(msg); setLoading(false); };
  const inf = msg => { setInfo(msg); setError(""); setLoading(false); };

  const handleSubmit = async () => {
    setError(""); setLoading(true);
    if(!email.includes("@")) return err("Enter a valid email address");
    if(mode !== "reset" && password.length < 6) return err("Password must be at least 6 characters");
    try {
      if(mode === "signup"){
        const {data, error:e} = await sb.auth.signUp({email, password});
        if(e) return err(e.message);
        if(data.user && data.session){
          await syncPull(data.user.id);
          onAuth(data.user);
        } else {
          inf("Check your email to confirm your account, then sign in.");
          setMode("login");
        }
      } else if(mode === "reset"){
        const {error:e} = await sb.auth.resetPasswordForEmail(email);
        if(e) return err(e.message);
        inf("Password reset link sent to " + email);
        setMode("login");
      } else {
        const {data, error:e} = await sb.auth.signInWithPassword({email, password});
        if(e) return err(e.message);
        await syncPull(data.user.id);
        onAuth(data.user);
      }
    } catch(e){ err("Connection error — check your internet and try again"); }
    setLoading(false);
  };

  const handleKey = e => { if(e.key==="Enter") handleSubmit(); };

  return(
    <div style={{minHeight:"100vh",background:`linear-gradient(160deg,#0B1628 0%,#1E3A5F 100%)`,
      display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",
      padding:"24px 20px"}}>

      {/* Logo */}
      <div style={{textAlign:"center",marginBottom:32}}>
        <div style={{width:76,height:76,borderRadius:22,background:"rgba(255,255,255,.1)",
          border:"1.5px solid rgba(255,255,255,.15)",display:"flex",alignItems:"center",
          justifyContent:"center",fontSize:38,fontWeight:800,color:"#4ADE80",
          margin:"0 auto 14px",boxShadow:"0 8px 32px rgba(0,0,0,.3)"}}>&#8358;</div>
        <div style={{fontSize:26,fontWeight:800,color:"#fff",letterSpacing:"-.02em"}}>TaxWise Nigeria</div>
        <div style={{fontSize:12,color:"rgba(255,255,255,.45)",marginTop:5}}>NTA 2025 · Smart Tax Management</div>
      </div>

      {/* Card */}
      <div style={{width:"100%",maxWidth:400,background:"#fff",borderRadius:22,
        padding:"28px 22px",boxShadow:"0 24px 64px rgba(0,0,0,.35)"}}>

        <div style={{fontSize:20,fontWeight:700,color:"#0F172A",marginBottom:3}}>
          {mode==="signup"?"Create your account":mode==="reset"?"Reset password":"Welcome back"}
        </div>
        <div style={{fontSize:12,color:"#94A3B8",marginBottom:22}}>
          {mode==="signup"?"Your tax data syncs securely to the cloud":
           mode==="reset"?"We'll send a reset link to your email":
           "Sign in to access your tax records"}
        </div>

        {/* Email */}
        <div className="fg" style={{marginBottom:12}}>
          <label className="lbl">EMAIL ADDRESS</label>
          <input className="inp" type="email" placeholder="you@example.com"
            value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={handleKey}
            style={{fontSize:15}}/>
        </div>

        {/* Password */}
        {mode!=="reset"&&(
          <div className="fg" style={{marginBottom:16}}>
            <label className="lbl">PASSWORD</label>
            <div style={{position:"relative"}}>
              <input className="inp" type={showPass?"text":"password"}
                placeholder={mode==="signup"?"Minimum 6 characters":"Enter your password"}
                value={password} onChange={e=>setPassword(e.target.value)} onKeyDown={handleKey}
                style={{fontSize:15,paddingRight:44}}/>
              <button onClick={()=>setShowPass(s=>!s)}
                style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",
                  background:"none",border:"none",cursor:"pointer",fontSize:16,color:"#94A3B8"}}>
                {showPass?"🙈":"👁"}
              </button>
            </div>
          </div>
        )}

        {/* Error / info */}
        {error&&(
          <div style={{background:"#FEF2F2",border:"1px solid rgba(220,38,38,.2)",borderRadius:10,
            padding:"10px 12px",fontSize:12,color:"#DC2626",marginBottom:14,lineHeight:1.5}}>
            &#9888; {error}
          </div>
        )}
        {info&&(
          <div style={{background:"#F0FDF4",border:"1px solid rgba(5,150,105,.2)",borderRadius:10,
            padding:"10px 12px",fontSize:12,color:"#059669",marginBottom:14,lineHeight:1.5}}>
            {info}
          </div>
        )}

        {/* Primary CTA */}
        <button onClick={handleSubmit} disabled={loading}
          style={{width:"100%",padding:"14px",
            background:loading?"#94A3B8":mode==="signup"?"#059669":"#1D4ED8",
            border:"none",borderRadius:12,color:"#fff",fontSize:14,fontWeight:700,
            cursor:loading?"not-allowed":"pointer",fontFamily:"inherit",
            marginBottom:16,boxShadow:loading?"none":"0 4px 12px rgba(0,0,0,.15)"}}>
          {loading?"Please wait...":
           mode==="signup"?"Create Account":
           mode==="reset"?"Send Reset Link":
           "Sign In"}
        </button>

        {/* Links */}
        <div style={{display:"flex",justifyContent:"center",gap:12,flexWrap:"wrap"}}>
          {mode==="login"&&(
            <>
              <button onClick={()=>{setMode("signup");setError("");setInfo("");}}
                style={{background:"none",border:"none",color:"#1D4ED8",cursor:"pointer",
                  fontFamily:"inherit",fontSize:12,fontWeight:600}}>
                New here? Create account
              </button>
              <span style={{color:"#E2E8F0"}}>·</span>
              <button onClick={()=>{setMode("reset");setError("");setInfo("");}}
                style={{background:"none",border:"none",color:"#94A3B8",cursor:"pointer",
                  fontFamily:"inherit",fontSize:12}}>
                Forgot password?
              </button>
            </>
          )}
          {mode==="signup"&&(
            <button onClick={()=>{setMode("login");setError("");setInfo("");}}
              style={{background:"none",border:"none",color:"#1D4ED8",cursor:"pointer",
                fontFamily:"inherit",fontSize:12,fontWeight:600}}>
              Already have an account? Sign in
            </button>
          )}
          {mode==="reset"&&(
            <button onClick={()=>{setMode("login");setError("");setInfo("");}}
              style={{background:"none",border:"none",color:"#1D4ED8",cursor:"pointer",
                fontFamily:"inherit",fontSize:12,fontWeight:600}}>
              Back to sign in
            </button>
          )}
        </div>
      </div>

      <div style={{marginTop:24,fontSize:10,color:"rgba(255,255,255,.25)",textAlign:"center",lineHeight:1.9}}>
        Data encrypted and secured by Supabase{"\n"}
        Nigeria Tax Act 2025 (No.3) · Tax Administration Act 2025 (No.5)
      </div>
    </div>
  );
}

function InstallBanner(){
  const [prompt, setPrompt]       = React.useState(null);
  const [show, setShow]           = React.useState(false);
  const [ios, setIos]             = React.useState(false);
  const [installed, setInstalled] = React.useState(false);
  const [dismissed, setDismissed] = React.useState(
    ()=> localStorage.getItem("tw_install_dismissed")==="1"
  );

  React.useEffect(()=>{
    if(window.matchMedia("(display-mode: standalone)").matches ||
       window.navigator.standalone===true){ setInstalled(true); return; }
    const handler = e=>{ e.preventDefault(); setPrompt(e); setShow(true); };
    window.addEventListener("beforeinstallprompt", handler);
    window.addEventListener("appinstalled",()=>{ setInstalled(true); setShow(false); });
    const isIos    = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const isSafari = /safari/i.test(navigator.userAgent) && !/chrome/i.test(navigator.userAgent);
    if(isIos && isSafari && !dismissed){ setIos(true); setShow(true); }
    return ()=> window.removeEventListener("beforeinstallprompt", handler);
  },[]);

  const install = async ()=>{
    if(!prompt) return;
    prompt.prompt();
    const {outcome} = await prompt.userChoice;
    if(outcome==="accepted") setInstalled(true);
    setShow(false);
  };

  const dismiss = ()=>{ setShow(false); localStorage.setItem("tw_install_dismissed","1"); };

  if(installed || !show || dismissed) return null;

  return(
    <div style={{
      position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",
      width:"100%",maxWidth:430,zIndex:9999,
      background:"#0B1628",borderTop:"1px solid rgba(255,255,255,.12)",
      padding:"14px 16px max(18px,env(safe-area-inset-bottom))",
      boxShadow:"0 -8px 32px rgba(0,0,0,.4)",
      animation:"slideUp .3s ease",
    }}>
      {ios?(
        <div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <div style={{width:36,height:36,borderRadius:10,background:"#1E3A5F",display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,fontWeight:700,color:"#4ADE80"}}>₦</div>
              <div>
                <div style={{fontSize:13,fontWeight:700,color:"#fff"}}>Install TaxWise</div>
                <div style={{fontSize:11,color:"rgba(255,255,255,.5)"}}>Add to your home screen</div>
              </div>
            </div>
            <button onClick={dismiss} style={{background:"none",border:"none",color:"rgba(255,255,255,.4)",fontSize:20,cursor:"pointer",padding:"0 4px",lineHeight:1}}>✕</button>
          </div>
          <div style={{background:"rgba(255,255,255,.06)",borderRadius:10,padding:"10px 12px"}}>
            <div style={{fontSize:11,color:"rgba(255,255,255,.7)",lineHeight:1.9}}>
              <div>1. Tap the <strong style={{color:"#60A5FA"}}>Share</strong> button at the bottom of Safari ⎙</div>
              <div>2. Scroll and tap <strong style={{color:"#60A5FA"}}>"Add to Home Screen"</strong></div>
              <div>3. Tap <strong style={{color:"#4ADE80"}}>"Add"</strong> — TaxWise appears on your home screen</div>
            </div>
          </div>
        </div>
      ):(
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <div style={{width:44,height:44,borderRadius:12,background:"#1E3A5F",display:"flex",alignItems:"center",justifyContent:"center",fontSize:24,fontWeight:700,color:"#4ADE80",flexShrink:0}}>₦</div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:13,fontWeight:700,color:"#fff"}}>Install TaxWise Nigeria</div>
            <div style={{fontSize:11,color:"rgba(255,255,255,.5)",marginTop:1}}>Add to home screen · Works offline</div>
          </div>
          <div style={{display:"flex",gap:6,flexShrink:0}}>
            <button onClick={dismiss} style={{padding:"8px 12px",background:"rgba(255,255,255,.08)",border:"1px solid rgba(255,255,255,.15)",borderRadius:8,color:"rgba(255,255,255,.6)",fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>Not now</button>
            <button onClick={install} style={{padding:"8px 14px",background:"#2563EB",border:"none",borderRadius:8,color:"#fff",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>Install</button>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(
  <><App/><InstallBanner/></>
);
</script>
