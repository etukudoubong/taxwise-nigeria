            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <span style={{fontSize:11,opacity:.6}}>Current Account</span>
              <button onClick={()=>setConnectedBanks(p=>p.filter(x=>x.id!==b.id))} style={{background:"rgba(239,68,68,.2)",border:"1px solid rgba(239,68,68,.3)",borderRadius:6,padding:"3px 9px",color:"#FCA5A5",fontSize:10,fontWeight:700,cursor:"pointer"}}>Disconnect</button>
            </div>
          </div>
        ))}
        <button className="btn btn-ghost" style={{marginTop:4}} onClick={()=>setStep("select")}>+ Connect Another Bank</button>
      </div>
    </div>
  );

  if(step==="select") return(
    <div style={{paddingBottom:80}}>
      <Hdr title="Select Your Bank" onBack={()=>setStep("intro")}/>
      <div className="pad-full" style={{paddingTop:12}}>
        <div className="ibox blue">
          <div className="ititle" style={{color:C.blue}}>Powered by Mono Open Banking</div>
          <p style={{fontSize:12,color:C.ink}}>This demo simulates the bank connection. In the live app, you'll log in securely through your bank's own system.</p>
        </div>
        {banks.map(b=>(
          <div key={b} onClick={()=>{setSelectedBank(b);setStep("connecting");}} style={{
            background:"#fff",borderRadius:12,padding:"14px 16px",marginBottom:8,
            display:"flex",justifyContent:"space-between",alignItems:"center",
            border:`1.5px solid ${selectedBank===b?C.blue:C.border}`,cursor:"pointer",
          }}>
            <span style={{fontSize:14,fontWeight:600,color:C.ink}}>{b}</span>
            <span style={{color:C.muted,fontSize:18}}>›</span>
          </div>
        ))}
      </div>
    </div>
  );

  return(
    <div style={{paddingBottom:80}}>
      <Hdr title="Connect Your Bank" onBack={onBack}/>
      <div className="pad-full" style={{paddingTop:12}}>
        <div style={{textAlign:"center",padding:"20px 0 28px"}}>
          <div style={{fontSize:56,marginBottom:16}}>🏦</div>
          <div style={{fontSize:22,fontWeight:800,color:C.ink,marginBottom:8}}>Auto-import Transactions</div>
          <div style={{fontSize:14,color:C.muted,lineHeight:1.6,maxWidth:300,margin:"0 auto"}}>Connect your bank once. TaxWise imports all your transactions and classifies them for tax automatically — no manual entry.</div>
        </div>
        {[["🔒","Bank-grade security","256-bit encryption. Your password never leaves your bank."],
          ["👁","Read-only access","We can see transactions but cannot move any money."],
          ["⚡","Real-time updates","New transactions appear automatically as they happen."],
          ["🧮","Auto tax classification","Every transaction tagged to the right tax head instantly."]].map(([i,t,s])=>(
          <div key={t} style={{display:"flex",gap:12,marginBottom:14,alignItems:"flex-start"}}>
            <div style={{width:36,height:36,borderRadius:10,background:C.blueLight,border:`1.5px solid ${C.blueBorder}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,flexShrink:0}}>{i}</div>
            <div><div style={{fontSize:13,fontWeight:700,color:C.ink}}>{t}</div><div style={{fontSize:12,color:C.muted,marginTop:1,lineHeight:1.4}}>{s}</div></div>
          </div>
        ))}
        <button className="btn btn-blue" onClick={()=>setStep("select")}>Connect a Bank Account</button>
        <div style={{textAlign:"center",marginTop:10,fontSize:11,color:C.muted}}>Powered by Mono · CBN licensed · 50+ Nigerian banks supported</div>
      </div>
    </div>
  );
}

function App(){
  const [authUser, setAuthUser] = useState(null);
  const [authLoading, setAuthLoading] = useState(true);
  const [syncStatus, setSyncStatus] = useState("idle");
  const [sub, setSub] = useState(null);
  const [subLoading, setSubLoading] = useState(false);

  useEffect(()=>{
    sb.auth.getSession().then(({data:{session}})=>{
      setAuthUser(session?.user||null);
      setAuthLoading(false);
    });
    const {data:{subscription}} = sb.auth.onAuthStateChange((_event, session)=>{
      setAuthUser(session?.user||null);
    });
    const handleNavEvent = (e) => setScreen(e.detail);
    window.addEventListener("nav", handleNavEvent);
    return ()=>{ subscription.unsubscribe(); window.removeEventListener("nav",handleNavEvent); };
  },[]);

  useEffect(()=>{
    if(authUser){
      setSubLoading(true);
      getSubscription(authUser.id).then(s=>{
        setSub(s);
        setSubLoading(false);
        if(!s){
          const store = loadStore();
          const plan = store?.profile?.mode==="company"?"company":"individual";
          createTrialSubscription(authUser.id, plan).then(()=>{
            getSubscription(authUser.id).then(setSub);
          });
        }
      });
    }
  },[authUser]);

  const handleAuth = async (user) => {
    setAuthUser(user);
    setSyncStatus("syncing");
    await syncPull(user.id);
    setSyncStatus("done");
    const s = loadStore();
    if(s?.profile) setProfileRaw(s.profile);
    if(s?.transactions) setTxnsRaw(s.transactions);
    if(s?.assets) setAssetsRaw(s.assets);
    if(s?.employees) setEmployeesRaw(s.employees);
    if(s?.kiv) setKivRaw(s.kiv);
    setTimeout(()=>setSyncStatus("idle"),3000);

    const params = new URLSearchParams(window.location.search);
    const inviteToken = params.get("invite_token");
    if(inviteToken){
      try {
        const res = await fetch(`${SUPA_URL}/functions/v1/taxwise-invite`,{
          method:"POST",
          headers:{"Content-Type":"application/json","Authorization":`Bearer ${SUPA_KEY}`},
          body: JSON.stringify({action:"accept_invite", payload:{token:inviteToken, userId:user.id}})
        });
        const data = await res.json();
        if(data.success){
          await syncPull(user.id);
          const updated = loadStore();
          if(updated?.profile) setProfileRaw(updated.profile);
          alert(`✅ ${data.message}\nYou now have ${data.role} access.`);
        }
      } catch(e){ console.warn("Invite accept failed:", e); }
      window.history.replaceState({},"",window.location.pathname);
    }
  };

  const handleSignOut = async () => {
    if(authUser){
      const store = loadStore();
      await syncPush(authUser.id, store);
    }
    await sb.auth.signOut();
    setAuthUser(null);
    setSub(null);
  };

  const saved=loadStore();
  const[profile,setProfileRaw]=useState(saved?.profile||DEFAULT_STORE.profile);
  const[txns,setTxnsRaw]=useState(saved?.transactions||DEFAULT_STORE.transactions);
  const[kiv,setKivRaw]=useState(saved?.kiv||[]);
  const[employees,setEmployeesRaw]=useState(saved?.employees||[]);
  const[assets,setAssetsRaw]=useState(saved?.assets||[]);
  const[connectedBanks,setConnectedBanksRaw]=useState(saved?.connectedBanks||[]);
  const savedSettings = loadSettings();
  const[ownAccounts,setOwnAccountsRaw]=useState(savedSettings?.ownAccounts||saved?.ownAccounts||[]);
  const[importRules,setImportRulesRaw]=useState(savedSettings?.importRules||saved?.importRules||[]);
  const[screen,setScreen]=useState("dashboard");
  const[prevScreen,setPrevScreen]=useState(null);

  const doSync = useCallback((store) => {
    if(authUser) syncPush(authUser.id, store).catch(()=>{});
  },[authUser]);

  const setProfile=useCallback(v=>{
    setProfileRaw(v);
    const store={profile:v,transactions:txns,kiv,employees,assets,connectedBanks};
    saveStore(store); doSync(store);
  },[txns,kiv,employees,assets,connectedBanks,doSync]);

  const setKiv=useCallback(fn=>{
    setKivRaw(prev=>{
      const next=typeof fn==="function"?fn(prev):fn;
      saveStore({profile,transactions:txns,kiv:next,employees,assets,connectedBanks});
      return next;
    });
  },[profile,txns,employees,assets,connectedBanks]);

  const setEmployees=useCallback(fn=>{
    setEmployeesRaw(prev=>{
      const next=typeof fn==="function"?fn(prev):fn;
      saveStore({profile,transactions:txns,kiv,employees:next,assets,connectedBanks});
      return next;
    });
  },[profile,txns,kiv,assets,connectedBanks]);

  const setAssets=useCallback(fn=>{
    setAssetsRaw(prev=>{
      const next=typeof fn==="function"?fn(prev):fn;
      saveStore({profile,transactions:txns,kiv,employees,assets:next,connectedBanks});
      return next;
    });
  },[profile,txns,kiv,employees,connectedBanks]);

  const setTxns=useCallback(fn=>{
    setTxnsRaw(prev=>{
      const next=typeof fn==="function"?fn(prev):fn;
      saveStore({profile,transactions:next,kiv,employees,assets,connectedBanks});
      return next;
    });
  },[profile,kiv,employees,assets,connectedBanks]);

  const setConnectedBanks=useCallback(fn=>{
    setConnectedBanksRaw(prev=>{
      const next=typeof fn==="function"?fn(prev):fn;
      saveStore({profile,transactions:txns,kiv,employees,assets,connectedBanks:next,ownAccounts,importRules});
      return next;
    });
  },[profile,txns,kiv,employees,assets,ownAccounts,importRules]);

  const setOwnAccounts=useCallback(fn=>{
    setOwnAccountsRaw(prev=>{
      const next=typeof fn==="function"?fn(prev):fn;
      saveStore({profile,transactions:txns,kiv,employees,assets,connectedBanks,ownAccounts:next,importRules});
      saveSettings({ownAccounts:next,importRules});
      // Retroactively reclassify existing transactions with updated own accounts
      setTxnsRaw(prevTxns=>{
        const reclassified = applyImportRules(prevTxns, next, importRules, true);
        saveStore({profile,transactions:reclassified,kiv,employees,assets,connectedBanks,ownAccounts:next,importRules});
        return reclassified;
      });
      return next;
    });
  },[profile,txns,kiv,employees,assets,connectedBanks,importRules]);

  const setImportRules=useCallback(fn=>{
    setImportRulesRaw(prev=>{
      const next=typeof fn==="function"?fn(prev):fn;
      saveStore({profile,transactions:txns,kiv,employees,assets,connectedBanks,ownAccounts,importRules:next});
      saveSettings({ownAccounts,importRules:next});
      // Retroactively reclassify existing transactions with updated rules
      setTxnsRaw(prevTxns=>{
        const reclassified = applyImportRules(prevTxns, ownAccounts, next, true);
        saveStore({profile,transactions:reclassified,kiv,employees,assets,connectedBanks,ownAccounts,importRules:next});
        return reclassified;
      });
      return next;
    });
  },[profile,txns,kiv,employees,assets,connectedBanks,ownAccounts]);

  const nav=(s)=>{setPrevScreen(screen);setScreen(s);};
  const back=()=>setScreen(prevScreen||"dashboard");

  const [inviteData, setInviteData] = useState(()=>{
    const params = new URLSearchParams(window.location.search);
    const token = params.get("invite_token");
    const company = params.get("company");
    const role = params.get("role");
    if(token) return {token, company, role};
    return null;
  });

  useEffect(()=>{
    if(authUser && !profile.onboarded){
      sb.from("profiles").select("onboarded").eq("id", authUser.id).single()
        .then(({data})=>{
          if(data?.onboarded === true){
            setProfileRaw(p=>({...p, onboarded:true}));
          }
        }).catch(()=>{});
    }
  },[authUser, profile.onboarded]);

  if(!profile.onboarded){
    if(inviteData && authUser){
      return(
        <div style={{minHeight:"100vh",background:`linear-gradient(160deg,${C.navy},#1E3A5F)`,
          display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"24px 20px"}}>
          <div style={{width:76,height:76,borderRadius:22,background:"rgba(255,255,255,.1)",
            border:"1.5px solid rgba(255,255,255,.15)",display:"flex",alignItems:"center",
            justifyContent:"center",fontSize:38,fontWeight:800,color:"#4ADE80",
            margin:"0 auto 20px",boxShadow:"0 8px 32px rgba(0,0,0,.3)"}}>₦</div>
          <div style={{fontSize:22,fontWeight:800,color:"#fff",textAlign:"center",marginBottom:8}}>
            You've been invited!
          </div>
          <div style={{fontSize:14,color:"rgba(255,255,255,.6)",textAlign:"center",lineHeight:1.7,marginBottom:8}}>
            You have been invited to join
          </div>
          <div style={{fontSize:18,fontWeight:700,color:"#4ADE80",textAlign:"center",marginBottom:6}}>
            {inviteData.company}
          </div>
          <div style={{background:"rgba(255,255,255,.1)",borderRadius:10,padding:"8px 20px",
            marginBottom:28,fontSize:13,color:"rgba(255,255,255,.7)"}}>
            Your role: <strong style={{color:"#fff",textTransform:"capitalize"}}>{(inviteData.role||"data_entry").replace(/_/g," ")}</strong>
          </div>
          <div style={{width:"100%",maxWidth:360,background:"#fff",borderRadius:20,padding:"24px 20px",
            boxShadow:"0 24px 64px rgba(0,0,0,.35)"}}>
            <div style={{fontSize:14,color:"#475569",lineHeight:1.7,marginBottom:20,textAlign:"center"}}>
              By joining, you will have access to <strong>{inviteData.company}</strong>'s TaxWise account with <strong style={{textTransform:"capitalize"}}>{(inviteData.role||"").replace(/_/g," ")}</strong> permissions only.
            </div>
            <button onClick={async()=>{
              try {
                const res = await fetch(`${SUPA_URL}/functions/v1/taxwise-invite`,{
                  method:"POST",
                  headers:{"Content-Type":"application/json","Authorization":`Bearer ${SUPA_KEY}`,"apikey":SUPA_KEY},
                  body: JSON.stringify({action:"accept_invite", payload:{token:inviteData.token, userId:authUser.id}})
                });
                const data = await res.json();
                if(data.success){
                  await syncPull(data.companyOwnerId);
                  const updated = loadStore();
                  const memberProfile = {
                    ...(updated?.profile||DEFAULT_STORE.profile),
                    onboarded: true,
                    member_role: data.role,
                    company_owner_id: data.companyOwnerId,
                    isCompanyMember: true,
                  };
                  setProfileRaw(memberProfile);
                  saveStore({profile:memberProfile, transactions:updated?.transactions||[], kiv:updated?.kiv||[], employees:updated?.employees||[], assets:updated?.assets||[], connectedBanks:[]});
                  setInviteData(null);
                  window.history.replaceState({},"",window.location.pathname);
                } else {
                  alert("❌ " + (data.error||"Failed to join. The invite may have expired."));
                }
              } catch(e){ alert("❌ Connection error. Please try again."); }
            }} style={{width:"100%",padding:"14px",background:"#059669",border:"none",borderRadius:12,
              color:"#fff",fontSize:15,fontWeight:700,cursor:"pointer",fontFamily:"inherit",
              boxShadow:"0 6px 0 #047857",marginBottom:10}}>
              Accept Invitation →
            </button>
            <button onClick={()=>setInviteData(null)}
              style={{width:"100%",padding:"11px",background:"none",border:"1px solid #E2E8F0",
                borderRadius:12,color:"#94A3B8",fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>
              Decline
            </button>
          </div>
          <div style={{marginTop:20,fontSize:10,color:"rgba(255,255,255,.25)",textAlign:"center"}}>
            TaxWise Nigeria · NTA 2025
          </div>
        </div>
      );
    }

    return(
      <OnboardingScreen onComplete={p=>{
        const newProfile={...DEFAULT_STORE.profile,...p,onboarded:true};
        setProfileRaw(newProfile);
        saveStore({profile:newProfile,transactions:[],kiv:[],employees:[],assets:[],connectedBanks:[]});
        if(authUser){
          sb.from("profiles").upsert({id:authUser.id, onboarded:true, updated_at:new Date().toISOString()})
            .catch(()=>{});
        }
      }}/>
    );
  }

  document.getElementById("bnav").style.display="flex";

  const isCompany=profile.mode==="company";

  const navItems=isCompany
    ?[{id:"dashboard",icon:"⬡",label:"Home"},{id:"journal",icon:"📒",label:"Journal"},{id:"payroll",icon:"👥",label:"Payroll"},{id:"agent",icon:"💬",label:"AI"},{id:"profile",icon:"👤",label:"Profile"}]
    :[{id:"dashboard",icon:"⬡",label:"Home"},{id:"journal",icon:"📒",label:"Journal"},{id:"calculate",icon:"🧮",label:"Calculate"},{id:"agent",icon:"💬",label:"AI"},{id:"profile",icon:"👤",label:"Profile"}];

  const memberRole = profile.member_role || "admin";
  const isCompanyMember = !!profile.isCompanyMember;
  const canEdit = !isCompanyMember || ["admin","accountant","data_entry"].includes(memberRole);
  const canViewReports = !isCompanyMember || ["admin","accountant"].includes(memberRole);
  const canManageTeam = !isCompanyMember || memberRole==="admin";
  const canViewBilling = !isCompanyMember || memberRole==="admin";

  const renderScreen=()=>{
    if(screen.startsWith("schedule_")){
      const key=screen.replace("schedule_","");
      const agg=computeAggregates(txns);
      return <TaxScheduleScreen scheduleKey={key} schedules={agg.schedules} profile={profile} onBack={back}/>;
    }
    switch(screen){
      case "dashboard":  return <Dashboard profile={profile} txns={txns} kiv={kiv} onNav={nav} setProfile={setProfile}/>;
      case "journal":    return <JournalScreen txns={txns} setTxns={setTxns} kiv={kiv} setKiv={setKiv} onNav={nav}/>;
      case "calculate":  return <CalculateScreen profile={profile} onBack={back}/>;
      case "deadlines":  return <DeadlinesScreen profile={profile} onBack={back}/>;
      case "vat":        return <VATScreen txns={txns} onBack={back}/>;
      case "faq":        return <FAQScreen onBack={back}/>;
      case "subscribe":  return <SubscriptionScreen profile={profile} authUser={authUser} sub={sub} onBack={back} onSubscribed={()=>{getSubscription(authUser.id).then(setSub);back();}}/>;
      case "team":       return canManageTeam ? <TeamScreen profile={profile} authUser={authUser} sub={sub} onBack={back}/> : <div style={{padding:40,textAlign:"center",color:C.muted}}>Access restricted — Admin only</div>;
      case "upload":     return canEdit ? <CSVUploadScreen setTxns={setTxns} txns={txns} assets={assets} setAssets={setAssets} profile={profile} authUser={authUser} onBack={back} ownAccounts={ownAccounts} importRules={importRules} sub={sub} setSub={setSub}/> : <div style={{padding:40,textAlign:"center",color:C.muted}}>Access restricted</div>;
      case "import":     return canEdit ? <DocumentUploadScreen profile={profile} authUser={authUser} setTxns={setTxns} txns={txns} assets={assets} setAssets={setAssets} onBack={back} sub={sub} setSub={setSub}/> : <div style={{padding:40,textAlign:"center",color:C.muted}}>Access restricted — Data Entry or above</div>;
      case "agent":      return <AgentScreen profile={profile} txns={txns} onBack={back}/>;
      case "profile":    return <ProfileScreen profile={profile} setProfile={setProfile} txns={txns} setTxns={setTxns} assets={assets} setAssets={setAssets} authUser={authUser} onSignOut={handleSignOut} onBack={()=>setScreen("dashboard")} onEditSetup={()=>setScreen("editSetup")} onNav={nav} ownAccountsCount={ownAccounts.length} importRulesCount={importRules.length} sub={sub} importRules={importRules} setImportRules={setImportRules} setOwnAccounts={setOwnAccounts}/>;
      case "ownAccounts": return <OwnAccountsScreen ownAccounts={ownAccounts} setOwnAccounts={setOwnAccounts} onBack={back}/>;
      case "importRules": return <ImportRulesScreen importRules={importRules} setImportRules={setImportRules} onBack={back}/>;
      case "editSetup":  return <OnboardingScreen
          editMode={true}
          initialData={{...profile}}
          onComplete={p=>{
            if(p){
              const newProfile = {...profile,...p,onboarded:true};
              setProfile(newProfile);
              // Reclassify existing transactions if taxpayer category changed
              if(p.empCategory && p.empCategory !== profile.empCategory){
                const newCat = p.empCategory;
                const isCompany = newProfile.mode === "company";
                setTxns(prev => prev.map(t => {
                  // Reset taxAllowable based on new category
                  // Drawings/personal are always non-deductible
                  if(t.taxStream === "drawings" || t.taxStream === "personal") return t;
                  // For Cat A/B (employees) — expenses are not deductible
                  if((newCat === "A" || newCat === "B") && t.type === "expense" && !isCompany){
                    return {...t, taxAllowable: false};
                  }
                  // For Cat C/D (self-employed/mixed) — expenses may be deductible
                  // Re-run smart flags on transactions that were auto-classified
                  if((newCat === "C" || newCat === "D") && t.type === "expense"){
                    // If it was non-deductible only because of old category, make it pending review
                    if(t.autoRule && t.autoRule.includes("not deductible for employed")){
                      return {...t, taxAllowable: true, autoRule: "Re-classified: check deductibility for "+newCat};
                    }
                  }
                  return t;
                }));
              }
            }
            setScreen("profile");
          }}
        />;
      case "taxsummary": return canViewReports ? <TaxSummaryScreen txns={txns} profile={profile} onNav={nav} onBack={back}/> : <div style={{padding:40,textAlign:"center",color:C.muted}}>Access restricted — Accountant or above</div>;
      case "reports":    return canViewReports ? <TaxSummaryScreen txns={txns} profile={profile} onNav={nav} onBack={back}/> : <div style={{padding:40,textAlign:"center",color:C.muted}}>Access restricted — Accountant or above</div>;
      case "bank":       return <BankScreen connectedBanks={connectedBanks} setConnectedBanks={setConnectedBanks} onBack={back}/>;
      case "penalties":  return <CalculateScreen profile={profile} onBack={back}/>;
      case "cit":        return <CITScreen profile={profile} txns={txns} assets={assets} onBack={back}/>;
      case "payroll":    return <PayrollScreen employees={employees} setEmployees={setEmployees} onBack={back}/>;
      case "assets":     return <AssetRegisterScreen assets={assets} setAssets={setAssets} onBack={back}/>;
      case "ca":         return <AssetRegisterScreen assets={assets} setAssets={setAssets} onBack={back}/>;
      case "kiv":        return <JournalScreen txns={txns} setTxns={setTxns} kiv={kiv} setKiv={setKiv} onNav={nav}/>;
      default:           return <Dashboard profile={profile} txns={txns} kiv={kiv} onNav={nav} setProfile={setProfile}/>;
    }
  };

  return(
    <>
      {/* Auth loading splash */}
      {authLoading&&(
        <div style={{position:"fixed",inset:0,background:C.navy,display:"flex",
          flexDirection:"column",alignItems:"center",justifyContent:"center",zIndex:9999}}>
          <div style={{fontSize:48,fontWeight:800,color:"#4ADE80",marginBottom:16}}>₦</div>
          <div style={{fontSize:14,color:"rgba(255,255,255,.5)"}}>Loading TaxWise…</div>
        </div>
      )}

      {/* Auth gate — show login if not authenticated */}
      {!authLoading&&!authUser&&(
        <AuthScreen onAuth={handleAuth}/>
      )}

      {/* Main app */}
      {!authLoading&&authUser&&(
        <>
          {/* Sync status toast */}
          {syncStatus==="syncing"&&(
            <div style={{position:"fixed",top:0,left:"50%",transform:"translateX(-50%)",
              background:C.navy,color:"#fff",fontSize:11,fontWeight:600,
              padding:"6px 16px",borderRadius:"0 0 10px 10px",zIndex:9998,
              boxShadow:"0 4px 12px rgba(0,0,0,.3)"}}>
              ☁️ Syncing…
            </div>
          )}
          {syncStatus==="done"&&(
            <div style={{position:"fixed",top:0,left:"50%",transform:"translateX(-50%)",
              background:C.green,color:"#fff",fontSize:11,fontWeight:600,
              padding:"6px 16px",borderRadius:"0 0 10px 10px",zIndex:9998}}>
              ✓ Synced
            </div>
          )}

          {/* Trial banner */}
          {sub?.status==="trial"&&trialDaysLeft(sub)<=7&&trialDaysLeft(sub)>0&&screen!=="subscribe"&&(
            <div onClick={()=>nav("subscribe")} style={{
              position:"fixed",bottom:65,left:"50%",transform:"translateX(-50%)",
              width:"calc(100% - 24px)",maxWidth:406,zIndex:100,
              background:"linear-gradient(135deg,#D97706,#92400E)",
              borderRadius:10,padding:"10px 14px",cursor:"pointer",
              display:"flex",justifyContent:"space-between",alignItems:"center",
              boxShadow:"0 4px 16px rgba(0,0,0,.25)"}}>
              <div>
                <div style={{fontSize:12,fontWeight:700,color:"#fff"}}>
                  ⏰ {trialDaysLeft(sub)} day{trialDaysLeft(sub)!==1?"s":""} left in trial
                </div>
                <div style={{fontSize:10,color:"rgba(255,255,255,.7)"}}>Tap to subscribe and keep your data</div>
              </div>
              <div style={{fontSize:11,fontWeight:700,color:"#FCD34D",flexShrink:0}}>Subscribe →</div>
            </div>

async function createTrialSubscription(userId, plan){

async function pdfToImages(file, onProgress) {
  if(!window.pdfjsLib) throw new Error("PDF.js not loaded — please refresh the page and try again.");
  const arrayBuffer = await file.arrayBuffer();
  const loadingTask = window.pdfjsLib.getDocument({data: arrayBuffer, disableFontFace: true});
  const pdf = await loadingTask.promise;
  const numPages = pdf.numPages;
  const images = [];
  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");
  for(let i = 1; i <= numPages; i++){
    if(onProgress) onProgress(i, numPages);
    const page = await pdf.getPage(i);
    const viewport = page.getViewport({scale: 1.5});
    canvas.width  = viewport.width;
    canvas.height = viewport.height;
    await page.render({canvasContext: ctx, viewport}).promise;
    const base64 = canvas.toDataURL("image/jpeg", 0.85).split(",")[1];
    images.push({base64, mediaType: "image/jpeg", isPDF: false});
  }
  return images;
}

function isSubscriptionActive(sub){
  if(!sub) return false;
  if(sub.status==="active") return true;
  if(sub.status==="trial"){
    return new Date(sub.trial_end) > new Date();
  }
  return false;
}

function trialDaysLeft(sub){
  if(!sub||sub.status!=="trial") return 0;
  const diff = new Date(sub.trial_end) - new Date();
  return Math.max(0, Math.ceil(diff/(1000*60*60*24)));
}

function currentMonthKey(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
}

function aiImportsRemaining(sub, plan){
  if(!sub) return 0;
  const limit = AI_IMPORT_LIMITS[plan] || AI_IMPORT_LIMITS.individual;
  const thisMonth = currentMonthKey();
  const used = (sub.ai_imports_month === thisMonth) ? (sub.ai_imports_used||0) : 0;
  return Math.max(0, limit - used);
}

async function checkAndIncrementAiImport(sub, userId, plan){
  if(!sub || !userId) return { allowed:false, remaining:0 };
  const limit = AI_IMPORT_LIMITS[plan] || AI_IMPORT_LIMITS.individual;
  const thisMonth = currentMonthKey();
  const alreadyUsed = (sub.ai_imports_month === thisMonth) ? (sub.ai_imports_used||0) : 0;
  if(alreadyUsed >= limit) return { allowed:false, remaining:0 };
  const newUsed = alreadyUsed + 1;
  try {
    await sb.from("subscriptions").update({
      ai_imports_used: newUsed,
      ai_imports_month: thisMonth,
    }).eq("user_id", userId);
  } catch(_) {
    console.warn("ai_imports columns not yet created in subscriptions table");
  }
  return { allowed:true, remaining: limit - newUsed };
}

function applyImportRules(transactions, ownAccounts=[], importRules=[], retroactive=false){
  const ownMatchers = ownAccounts.flatMap(a=>[
    a.accountNumber?.replace(/\s/g,"").toLowerCase(),
    a.accountName?.toLowerCase(),
    a.bankName?.toLowerCase(),
  ].filter(Boolean));

  return transactions.map(t=>{
    // When retroactively reapplying, reset rule-based classifications first
    // so deleted rules don't leave stale tags. Keep manual user edits.
    const base = retroactive && t.autoRule && t.autoRule.startsWith("Rule:")
      ? {...t, autoRule:null, taxAllowable:true, included:true, type:t.type}
      : {...t};
    const desc = (base.desc||"").toLowerCase();

    if(ownMatchers.length > 0){
      const isOwnTransfer = ownMatchers.some(m=>m && desc.includes(m));
      if(isOwnTransfer){
        return{...base,
          type:"transfer",
          category:"own_account_transfer",
          taxAllowable:false,
          included:false,
          autoRule:"Own account transfer — excluded from taxable income",
          confidence:"high",
        };
      }
    }

    for(const rule of importRules){
      if(!rule.pattern||!rule.pattern.trim()) continue;
      const pattern = rule.pattern.toLowerCase().trim();
      const matchType = rule.matchType||"contains";
      const matchField = rule.matchField||"description";

      // Build the search text based on matchField
      // All fields currently come from the narration/description text
      // (bank statements embed account numbers, names, phones in the narration)
      const searchText = desc; // always search the description narration

      const doMatch = (text) => {
        if(matchType==="contains")   return text.includes(pattern);
        if(matchType==="startsWith") return text.startsWith(pattern);
        if(matchType==="endsWith")   return text.endsWith(pattern);
        if(matchType==="exact")      return text===pattern;
        if(matchType==="regex"){
          try{ return new RegExp(pattern,"i").test(t.desc||""); }catch(_){ return false; }
        }
        return false;
      };

      let matched = doMatch(searchText);
      if(matched){
        return{...t,
          type:      rule.newType      || t.type,
          category:  rule.newCategory  || t.category,
          desc:      rule.appendNote   ? `${t.desc} [${rule.appendNote}]` : t.desc,
          taxAllowable: rule.taxAllowable!=null ? rule.taxAllowable : t.taxAllowable,
          included:     rule.included!=null     ? rule.included     : t.included,
          autoRule:  `Rule: "${rule.name||rule.pattern}"`,
          confidence:"high",
        };
      }
    }

    return t;
  });
}

    const parseRow = (line) => {
      const cells=[]; let cur=""; let inQ=false;
      for(let i=0;i<line.length;i++){
        const c=line[i];
        if(c==='"'){inQ=!inQ;}
        else if(c===","&&!inQ){cells.push(cur.trim().replace(/^"|"$/g,""));cur="";}
        else cur+=c;
      }
      cells.push(cur.trim().replace(/^"|"$/g,""));
      return cells;
    };
    const hdrs = parseRow(lines[0]);
    const data = lines.slice(1).map(l=>parseRow(l)).filter(r=>r.some(c=>c));
    return {headers:hdrs, rows:data};
  };

  const autoMap = (hdrs) => {
    const find = (...terms) => hdrs.find(h=>terms.some(t=>h.toLowerCase().trim()===t.toLowerCase().trim())) ||
      hdrs.find(h=>terms.some(t=>h.toLowerCase().includes(t.toLowerCase()))) || "";
    return {
      date:   find("Date","Transaction Date","Trans Date","Value Date","Txn Date","Posting Date","date","time"),
      desc:   find("Narration","Description","Details","Remarks","Particulars","Reference","Notes","Transaction","narration","description","details","remarks"),
      amount: find("Amount","Value","Sum","Total","amount","value"),
      credit: find("Credit","Cr","Deposit","Money In","Inflow","Receipts","credit","cr","deposit"),
      debit:  find("Debit","Dr","Withdrawal","Money Out","Outflow","Payments","debit","dr","withdrawal"),
      type:   find("Type","Dr/Cr","Cr/Dr","Direction","DR_CR","type"),
    };
  };

  const parseDate = (date) => {
    if(!date) return new Date().toISOString().split("T")[0];
    date = String(date).trim();
    if(/^\d{5}$/.test(date)){
      const d = new Date((parseInt(date)-25569)*86400*1000);
      return d.toISOString().split("T")[0];
    }
    const dm = date.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
    if(dm){
      const [,a,b,c]=dm; const yr=c.length===2?`20${c}`:c;
      return `${yr}-${b.padStart(2,"0")}-${a.padStart(2,"0")}`;
    }
    const dm2 = date.match(/^(\d{1,2})[\s\-]([A-Za-z]{3})[\s\-](\d{2,4})$/);
    if(dm2){
      const months={jan:"01",feb:"02",mar:"03",apr:"04",may:"05",jun:"06",
        jul:"07",aug:"08",sep:"09",oct:"10",nov:"11",dec:"12"};
      const [,d,m,y]=dm2;
      return `${y.length===2?"20"+y:y}-${months[m.toLowerCase()]||"01"}-${d.padStart(2,"0")}`;
    }
    if(/^\d{4}-\d{2}-\d{2}/.test(date)) return date.slice(0,10);
    return new Date().toISOString().split("T")[0];
  };

  const getNonAllowable = (desc) =>
    /loan.*principal|capital repayment|depreciation|income tax|penalty.*tax|drawing|dividend paid/i.test(String(desc));

  const handleFile = async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    setError(""); setProcessing(true); setProgress("Reading file…");
    setFileName(file.name);

    try {
      const ext = file.name.split(".").pop().toLowerCase();

      if(ext==="zip"){
        setProgress("Reading file…");
        try {
          const ab = await file.arrayBuffer();
          if(window.XLSX){
            const wb = window.XLSX.read(ab, {type:"array"});
            if(wb.SheetNames.length>0){
              setFileName(file.name.replace(".zip",".xlsx"));
              processExcelBuffer(ab);
              return;
            }
          }
        } catch(e){ /* not a direct xlsx — try as archive */ }

        setProgress("Extracting ZIP…");
        if(window.JSZip){
          const zip = await window.JSZip.loadAsync(file);
          const entries = Object.entries(zip.files).filter(([n,f])=>!f.dir);
          const csvFile = entries.find(([n])=>/\.(csv|txt)$/i.test(n));
          const xlsFile = entries.find(([n])=>/\.(xlsx|xls)$/i.test(n));
          if(csvFile){
            const text = await csvFile[1].async("text");
            setFileName(csvFile[0]);
            processParsed(parseCSVText(text), "csv");
            return;
          } else if(xlsFile){
            const ab = await xlsFile[1].async("arraybuffer");
            setFileName(xlsFile[0]);
            processExcelBuffer(ab);
            return;
          }
        }
        throw new Error("Could not read file. Please extract the ZIP and upload the Excel or CSV file directly.");
      }

      if(ext==="csv"||ext==="txt"){
        setProgress("Parsing CSV…");
        const text = await file.text();
        processParsed(parseCSVText(text), "csv");
        return;
      }

      if(ext==="xlsx"||ext==="xls"||ext==="xlsm"){
        setProgress("Reading Excel file…");
        if(!window.XLSX) throw new Error("Excel library loading — please try again in a moment");
        const ab = await file.arrayBuffer();
        processExcelBuffer(ab);
        return;
      }

      if(ext==="pdf"||/^image\//.test(file.type)||["jpg","jpeg","png","webp","gif"].includes(ext)){
        setProgress("Sending to AI for extraction…");
        setFileType("pdf");
        await processViaAI(file);
        return;
      }

      throw new Error(`Unsupported file type: .${ext}. Please use CSV, Excel, PDF, or image files.`);

    } catch(e){
      setError(e.message||"Failed to read file");
      setProcessing(false);
    }
  };

  const processExcelBuffer = (ab) => {
    try {
      const wb = window.XLSX.read(ab, {type:"array", cellDates:true});
      let bestSheet = null, bestRows = 0;
      wb.SheetNames.forEach(name=>{
        const ws = wb.Sheets[name];
        const data = window.XLSX.utils.sheet_to_json(ws, {header:1, raw:false, defval:"", dateNF:"YYYY-MM-DD"});
        if(data.length > bestRows){ bestRows=data.length; bestSheet={name,data,ws}; }
      });
      if(!bestSheet||bestSheet.data.length<2) throw new Error("No data found in Excel file");

      const rawData = window.XLSX.utils.sheet_to_json(bestSheet.ws, {header:1, raw:true, defval:""});

      const dataKeywords = [
        ["date","trans date","value date","txn date"],
        ["narration","description","details","narr","trans description","transaction"],
        ["debit","dr","withdrawal","amount","credit","cr"]
      ];
      let headerIdx = -1;
      for(let i=0;i<Math.min(20,rawData.length);i++){
        const rowLower = rawData[i].map(c=>String(c||"").toLowerCase().trim());
        const matches = dataKeywords.filter(group=>
          group.some(k=>rowLower.some(cell=>cell===k||cell.startsWith(k)))
        ).length;
        if(matches >= 2){ headerIdx=i; break; }
      }
      if(headerIdx<0) headerIdx=0;

      // Keep ALL header positions (including empty) so column indices align with data rows
      const allHdrs = rawData[headerIdx].map(h=>String(h||"").trim().replace(/:+$/,""));
      // For UI display and autoMap, use only non-empty headers BUT map back to full positions
      const hdrs = allHdrs; // keep full array including empty slots

      const dataRows = rawData.slice(headerIdx+1)
        .filter(r=>r.some(c=>c!==null&&c!==undefined&&String(c||"").trim()))
        .map(r=>r.map((c,colIdx)=>{
          // Convert Excel serial dates in date column
          if(typeof c==="number" && c>40000 && c<60000 && colIdx===allHdrs.findIndex(h=>h.toLowerCase().includes("date"))){
            const d = new Date(Math.round((c-25569)*86400*1000));
            return d.toISOString().split("T")[0];
          }
          // Also convert any numeric date in col 0 if date col not found
          if(colIdx===0 && typeof c==="number" && c>40000 && c<60000){
            const d = new Date(Math.round((c-25569)*86400*1000));
            return d.toISOString().split("T")[0];
          }
          // IMPORTANT: keep 0 as "0" not "" — needed to distinguish debit/credit columns
          if(c===null||c===undefined) return "";
          return String(c).trim();
        }));

      if(allHdrs.filter(h=>h).length===0) throw new Error("Could not find column headers");
      processParsed({headers:hdrs, rows:dataRows}, "excel");
    } catch(e){ throw new Error("Could not read Excel file: " + e.message); }
  };

  const processParsed = (parsed, type) => {
    const {headers:hdrs, rows:data} = parsed;
    if(hdrs.length===0) throw new Error("Could not read file — no columns found");
    setHeaders(hdrs);
    setRows(data);
    setFileType(type);
    setMapping(autoMap(hdrs));
    setProcessing(false);
    setMode("mapping");
  };

  const processViaAI = async (file) => {
    if(authUser && sub){
      const plan = sub.plan||"individual";
      const check = await checkAndIncrementAiImport(sub, authUser.id, plan);
      if(!check.allowed){
        const limit = AI_IMPORT_LIMITS[plan]||AI_IMPORT_LIMITS.individual;
        throw new Error(
          "Monthly AI import limit reached (" + limit + "/" + limit + " used).\n\n" +
          "Your limit resets on the 1st of next month.\n\n" +
          "Alternatives:\n" +
          "1. Download as Excel from your bank app (no AI needed, no limit)\n" +
          "2. Upgrade to a higher plan for more imports\n" +
          "3. Use CSV export if your bank supports it"
        );
      }
      if(setSub) setSub(s => s ? ({...s, ai_imports_used:(s.ai_imports_month===currentMonthKey()?(s.ai_imports_used||0)+1:1), ai_imports_month:currentMonthKey()}) : s);
    }
    const isPDF = file.type==="application/pdf"||file.name.endsWith(".pdf");
    const fileMB = file.size/1024/1024;
    let txnList = []; // hoisted — populated by PDF or image path below

    if(isPDF && window.pdfjsLib){
      setProgress("Reading PDF…");
      let images;
      try {
        images = await pdfToImages(file, (pageNum, total) => {
          setProgress("Rendering page " + pageNum + " of " + total + "…");
        });
      } catch(pdfErr){
        if(/password|encrypted/i.test(pdfErr.message)){
          throw new Error("This PDF is password-protected (common with GTBank, Access, UBA statements).\n\nTo fix:\n1. Open the PDF and enter the password (usually your date of birth e.g. 15061985)\n2. Print to PDF to create an unlocked copy\n3. Upload the unlocked copy\n\nOr download as Excel from your bank app.");
        }
        throw pdfErr;
      }

      const totalPages = images.length;
      const BATCH = 10;
      const numBatches = Math.ceil(totalPages / BATCH);
      let allTxns = [];

      const dateRangeNote = (dateFrom||dateTo)
        ? "\n\nDATE RANGE FILTER: Only extract transactions between " + (dateFrom||"the beginning") + " and " + (dateTo||"the end of the document") + ". Skip transactions outside this range."
        : "";

      const sysPrompt = "You are a Nigerian bank statement processor. Extract ALL transactions from the pages provided." + dateRangeNote + "\n\nNIGERIAN BANK DATE FORMATS (convert to YYYY-MM-DD):\n04-JAN-16 = 2016-01-04. 04JAN16 = 2016-01-04. DD/MM/YYYY. 2-digit year: add 2000 if < 50.\n\nPOLARIS / SKYE BANK (EntryDate | Details | ValueDate | Debit | Credit | Balance):\nUse EntryDate as date. Ignore ValueDate. Skip Balance B/F and Totals rows.\n\nMULTI-PAGE RULE: Page 1 has column headers. Apply same structure to all pages.\n\nReturn ONLY a JSON array. Each object must have:\ndate (YYYY-MM-DD), desc (max 80 chars), amount (positive), type (income|expense|asset),\ncategory (revenue|salary|rent|professional_fee|supplies|utility|tax_payment|bank_charge|stamp_duty|loan|other),\ntaxAllowable (bool), confidence (high|medium|low), vatFlag (bool), whtFlag (bool).\n\nNON-ALLOWABLE: stamp duty, maintenance fee, loan principal, income tax, drawings, dividends.\nReturn ONLY the JSON array.";

      for(let b = 0; b < numBatches; b++){
        const bStart = b * BATCH;
        const bEnd   = Math.min(bStart + BATCH, totalPages);
        setProgress("Processing pages " + (bStart+1) + "–" + bEnd + " of " + totalPages + " (batch " + (b+1) + " of " + numBatches + ")…");

        const batchImgs = b === 0 ? images.slice(bStart, bEnd) : [images[0], ...images.slice(bStart, bEnd)];
        const cBlocks = batchImgs.map(img => ({
          type:"image", source:{type:"base64", media_type:img.mediaType, data:img.base64}
        }));
        const uText = b === 0
          ? "Pages 1–" + bEnd + " of " + totalPages + ". Page 1 has headers. Extract all transactions. Return only JSON array."
          : "First image = page 1 for header reference only, do NOT re-extract it. Extract pages " + (bStart+1) + "–" + bEnd + " only. Return only JSON array.";
        cBlocks.push({type:"text", text:uText});

        try {
          const bRes = await fetch(SUPA_URL+"/functions/v1/taxwise-ai",{
            method:"POST",
            headers:{"Content-Type":"application/json","Authorization":"Bearer "+SUPA_KEY,"apikey":SUPA_KEY},
            body:JSON.stringify({system:sysPrompt, docType:"bank_statement", totalPages, messages:[{role:"user",content:cBlocks}]})
          });
          if(!bRes.ok){ const ed=await bRes.json().catch(()=>({})); console.warn("Batch "+(b+1)+" HTTP err:",ed?.error||bRes.status); continue; }
          const bData = await bRes.json();
          if(bData.error){ console.warn("Batch "+(b+1)+" err:",bData.error); continue; }
          let clean=(bData.reply||"[]").replace(/```json|```/g,"").trim();
          const si=clean.indexOf("["),ei=clean.lastIndexOf("]");
          if(si!==-1&&ei>si) clean=clean.slice(si,ei+1);
          if(clean&&!clean.endsWith("]")){ const lc=clean.lastIndexOf("}"); clean=lc!==-1?clean.slice(0,lc+1)+"]":"[]"; }
          try{ const p=JSON.parse(clean); allTxns=allTxns.concat(Array.isArray(p)?p:(p.transactions||p.items||[])); }
          catch(_){ console.warn("Batch "+(b+1)+" parse fail"); }
        } catch(bErr){
          console.warn("Batch "+(b+1)+" exception:",bErr.message); continue;
        }
      }

      setProgress("Parsing results…");
      txnList = allTxns;
      if(!txnList.length) throw new Error("No transactions found in the PDF. If the statement is password-protected, unlock it first. Or download as Excel from your bank app.");
      if(dateFrom||dateTo){
        const fromDT=dateFrom?new Date(dateFrom):null, toDT=dateTo?new Date(dateTo):null;
        txnList=txnList.filter(t=>{ const d=new Date(t.date||""); if(isNaN(d.getTime())) return true; if(fromDT&&d<fromDT) return false; if(toDT&&d>toDT) return false; return true; });
        if(!txnList.length) throw new Error("No transactions in selected date range ("+(dateFrom||"start")+" to "+(dateTo||"today")+"). Try widening the range.");
      }

    } else {
      const maxSize = 8*1024*1024;
      if(file.size > maxSize) throw new Error("File too large (" + fileMB.toFixed(1) + "MB). Maximum is 8MB. Download as Excel from your bank app instead.");
      const mediaType = file.type||"image/jpeg";
      setProgress("Reading image…");
      const base64 = await new Promise((res,rej)=>{
        const reader = new FileReader();
        reader.onload = ()=>res(reader.result.split(",")[1]);
        reader.onerror = ()=>rej(new Error("Could not read file"));
        reader.readAsDataURL(file);
      });
      const dateRangeNote2 = (dateFrom||dateTo)
        ? "\n\nDATE RANGE FILTER: Only extract transactions between " + (dateFrom||"the beginning") + " and " + (dateTo||"end") + "."
        : "";
      const imgSystemPrompt = "You are a Nigerian bank statement processor. Extract ALL transactions from this image." + dateRangeNote2 + "\n\nReturn ONLY a JSON array. Each item: date (YYYY-MM-DD), desc (max 80 chars), amount (positive number), type (income|expense|asset), category (revenue|salary|rent|professional_fee|supplies|utility|tax_payment|bank_charge|stamp_duty|loan|other), taxAllowable (bool), confidence (high|medium|low), vatFlag (bool), whtFlag (bool). No preamble, no markdown.";
      setProgress("AI is analysing image…");
      const imgRes = await fetch(SUPA_URL+"/functions/v1/taxwise-ai",{
        method:"POST",
        headers:{"Content-Type":"application/json","Authorization":"Bearer "+SUPA_KEY,"apikey":SUPA_KEY},
        body:JSON.stringify({system:imgSystemPrompt, docType:"bank_statement", totalPages:1,
          messages:[{role:"user",content:[{type:"image",source:{type:"base64",media_type:mediaType,data:base64}},{type:"text",text:"Extract all transactions. Return only the JSON array."}]}]})
      });
      if(!imgRes.ok){
        const ed=await imgRes.json().catch(()=>({}));
        const msg=ed?.error||"Server error "+imgRes.status;
        if(imgRes.status===546||imgRes.status===504||/timeout/i.test(msg)) throw new Error("Processing timed out. Try photographing fewer pages at once.");
        throw new Error("AI extraction failed: "+msg);
      }
      const imgData = await imgRes.json();
      if(imgData.error) throw new Error("AI error: "+imgData.error);
      let clean=(imgData.reply||"[]").replace(/```json|```/g,"").trim();
      const sis=clean.indexOf("["),eis=clean.lastIndexOf("]");
      if(sis!==-1&&eis>sis) clean=clean.slice(sis,eis+1);
      if(clean&&!clean.endsWith("]")){ const lci=clean.lastIndexOf("}"); clean=lci!==-1?clean.slice(0,lci+1)+"]":"[]"; }
      txnList=[];
      try{ const p=JSON.parse(clean); txnList=Array.isArray(p)?p:(p.transactions||p.items||[]); }
      catch(_){ throw new Error("Could not parse AI response. Preview: "+(imgData.reply||"").slice(0,200)); }
      if(!txnList.length) throw new Error("No transactions found in image.");
      if(dateFrom||dateTo){
        const fromDT=dateFrom?new Date(dateFrom):null,toDT=dateTo?new Date(dateTo):null;
        txnList=txnList.filter(t=>{ const d=new Date(t.date||""); if(isNaN(d.getTime())) return true; if(fromDT&&d<fromDT) return false; if(toDT&&d>toDT) return false; return true; });
        if(!txnList.length) throw new Error("No transactions in date range. Try clearing the filter.");
      }
    } // end else (image path)

    const formatted = txnList.map((t,i)=>{
      const nonAllowable = t.taxAllowable===false||getNonAllowable(t.desc||"");
      return {
        id:`import_${Date.now()}_${i}`,
        date:parseDate(t.date), desc:t.desc||"Transaction",
        amount:Math.abs(parseFloat(t.amount)||0),
        type:t.type==="asset"?"asset":t.type==="income"?"income":"expense",
        source:"import", compliance_status:"pending",
        taxAllowable:!nonAllowable, included:!nonAllowable&&Math.abs(parseFloat(t.amount)||0)>0,
        confidence:t.confidence||"medium",
        vatFlag: (profile?.mode==="company") ? !!t.vatFlag : false,
        whtFlag:!!t.whtFlag,
        assetClass:t.assetClass||"other", category:t.category||"other",
      };
    }).filter(t=>t.amount>0);
    const rulesApplied2 = applyImportRules(formatted, ownAccounts, importRules);
    setPreview(rulesApplied2);
    setProcessing(false);
    setMode("review");
  };

  const buildPreview = () => {
    if(!mapping.date&&!mapping.desc) return setError("Please map at least Date and Description");
    const idx = (f) => headers.indexOf(mapping[f]);
    const [dI,nI,aI,cI,drI,tI] = ["date","desc","amount","credit","debit","type"].map(idx);

    const isExcelSerialDate = (n) => Number.isInteger(n) && n >= 40000 && n <= 60000;
    const parseAmt = (val) => {
      if(val===null||val===undefined||val==="") return 0;
      if(typeof val === "number"){
        if(isExcelSerialDate(val)) return 0;
        return Math.abs(val);
      }
      const cleaned = String(val).replace(/[₦$£€,\s]/g,"").trim();
      if(!cleaned || cleaned==="-" || cleaned==="0.00") return 0;
      const n = parseFloat(cleaned);
      if(isNaN(n)) return 0;
      if(isExcelSerialDate(n)) return 0;
      return Math.abs(n);
    };

    const mapped = rows.map((row,i)=>{
      const date = parseDate(dI>=0?row[dI]:"");
      // Try primary desc column, then fall back to Reference column if empty
      const refI = headers.indexOf("Reference");
      let desc = nI>=0?(row[nI]||"").toString().trim():"";
      if(!desc && refI>=0) desc = (row[refI]||"").toString().trim();
      if(!desc) desc = `Row ${i+1}`;
      if(desc===`Row ${i+1}`) return null; // skip truly empty rows
      let amount=0, type="expense";

      if(cI>=0&&drI>=0){
        const cr = parseAmt(row[cI]);
        const dr = parseAmt(row[drI]);
        // Nigerian banks (Moniepoint, GTBank, Access) put 0 in the unused column
        // Treat 0 same as blank — only the non-zero column determines direction
        if(dr>0&&cr===0){amount=dr;type="expense";}
        else if(cr>0&&dr===0){amount=cr;type="income";}
        else if(cr>0&&dr>0){
          amount=Math.max(cr,dr); type=cr>dr?"income":"expense";
        }
        // Both zero: amount stays 0, filtered out below
      } else if(aI>=0){
        const raw=String(row[aI]||"").replace(/[₦$£€,\s]/g,"").trim();
        const n=parseFloat(raw)||0;
        amount=isExcelSerialDate(n)?0:Math.abs(n);
        if(tI>=0){
          const t=String(row[tI]||"").toLowerCase();
          type=(t.includes("cr")||t.includes("credit")||t.includes("in"))?"income":"expense";
        } else {
          type=parseFloat(raw)<0?"expense":"income";
        }
      }

      const nonAllowable = getNonAllowable(desc);
      return {id:`csv_${Date.now()}_${i}`,date,desc,amount,type,
        source:"import",compliance_status:"pending",
        taxAllowable:!nonAllowable, included:amount>0&&!nonAllowable};
    }).filter(t=>t&&t.amount>0);

    if(!mapped.length) return setError(
      `No valid transactions found. Make sure Credit and Debit columns are correctly mapped. ` +
      `Detected columns: ${headers.join(", ")}`
    );
    const fromD = dateFrom ? new Date(dateFrom) : null;
    const toD   = dateTo   ? new Date(dateTo)   : null;
    const rangeFiltered = (fromD||toD) ? mapped.filter(t=>{
      const d = new Date(t.date);
      if(isNaN(d.getTime())) return true;
      if(fromD && d < fromD) return false;
      if(toD   && d > toD)   return false;
      return true;
    }) : mapped;
    if(!rangeFiltered.length) return setError(
      `No transactions found in the selected date range (${dateFrom||"start"} to ${dateTo||"today"}). ` +
      `Try widening the range or clearing the filter.`
    );
    const rulesApplied = applyImportRules(rangeFiltered, ownAccounts, importRules);
    setPreview(rulesApplied);
    setMode("review");
  };

  const postSelected = () => {
    // Post included transactions normally
    const toPost = preview.filter(t=>t.included).map(t=>({...t}));
    // Also post excluded/non-allowable transactions as "excluded" for reference
    const excluded = preview.filter(t=>!t.included&&t.amount>0).map(t=>({
      ...t,
      compliance_status:"excluded",
      included:false,
    }));
    setTxns([...txns,...toPost,...excluded]);
    setMode("done");
  };

  const ColSelect = ({label, field, required}) => (
    <div className="fg">
      <label className="lbl">{label}{required&&<span style={{color:C.red}}> *</span>}</label>
      <select className="sel" value={mapping[field]} onChange={e=>setMapping(m=>({...m,[field]:e.target.value}))}>
        <option value="">— not mapped —</option>
        {headers.map(h=><option key={h} value={h}>{h}</option>)}
      </select>
    </div>
  );

  if(mode==="done") return(
    <div style={{paddingBottom:100}}>
      <Hdr title="Import Complete" onBack={onBack}/>
      <div style={{padding:"40px 20px",textAlign:"center"}}>
        <div style={{fontSize:48,marginBottom:16}}>✅</div>
        <div style={{fontSize:20,fontWeight:700,color:C.ink,marginBottom:8}}>
          {preview.filter(t=>t.included).length} transactions imported
        </div>
        <div style={{fontSize:13,color:C.muted,lineHeight:1.6,marginBottom:24}}>From <strong>{fileName}</strong></div>
        <button onClick={onBack} style={{padding:"13px 32px",background:C.blue,border:"none",
          borderRadius:12,color:"#fff",fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
          View Journal →
        </button>
      </div>
    </div>
  );

  if(mode==="review") return(
