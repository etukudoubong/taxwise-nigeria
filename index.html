          </div>
          <InpRow label="LESS: PRIOR YEAR LOSSES (₦)" field="prevLoss" hint="carried forward from previous assessment"/>

          {/* Adjusted profit summary */}
          <div style={{background:"#F8FAFC",border:"1px solid #E2E8F0",borderRadius:10,padding:"12px",marginTop:4}}>
            <DataRow label="Gross Profit" value={fmt(grossProfit)} color={grossProfit>=0?C.green:C.red}/>
            <DataRow label="Less: Operating Expenses" value={`-${fmt(f.opex)}`} color={C.red}/>
            {f.otherIncome>0&&<DataRow label="Add: Other Income" value={fmt(f.otherIncome)} color={C.green}/>}
            {f.depreciation>0&&<DataRow label="Add Back: Depreciation" value={fmt(f.depreciation)} color={C.ink}/>}
            {f.ca>0&&<DataRow label="Less: Capital Allowance" value={`-${fmt(f.ca)}`} color={C.green}/>}
            {f.prevLoss>0&&<DataRow label="Less: Prior Year Loss" value={`-${fmt(f.prevLoss)}`} color={C.green}/>}
            <DataRow label="ADJUSTED TAXABLE PROFIT" value={fmt(taxableProfit)} color={taxableProfit>0?C.blue:C.muted} total={true}/>
          </div>
        </div>

        {/* Section 3: CIT Computation */}
        <div className="card">
          <div className="ctitle">🏢 CIT COMPUTATION — NTA 2025 SEC 197–203</div>

          {/* Tier badge */}
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14,padding:"10px 12px",
            background: isSmall?"#F0FDF4":"#EFF6FF",
            border:`1px solid ${isSmall?C.green:C.blue}30`,borderRadius:10}}>

            <div>
              <div style={{fontSize:12,fontWeight:700,color:isSmall?C.green:C.blue}}>{tier}</div>
              <div style={{fontSize:10,color:C.muted,marginTop:1}}>
                {isSmall
                  ? `Turnover ≤₦50M · Assets ≤₦250M · Not professional services — NTA 2025 Sec 202`
                  : `Turnover ${fmt(f.turnover)} · ${profile.isProfessional?"Professional services — always 30%":"Standard rate applies"} — NTA 2025 Sec 197`}
              </div>
            </div>
          </div>

          {isSmall ? (
            <div className="ibox green">
              <div className="ititle" style={{color:C.green}}>🛡 ZERO CIT — SMALL COMPANY EXEMPTION</div>
              <p style={{fontSize:12,color:C.ink,lineHeight:1.6}}>
                Your company qualifies for the 0% CIT rate under NTA 2025 Sec 202. No CIT or Development Levy is payable. You must still file your annual return by 6 months after year-end (TAA 2025 Sec 11).
              </p>
            </div>
          ):(
            <>
              <DataRow label="Taxable Profit" value={fmt(taxableProfit)}/>
              <DataRow label="CIT @ 30%" value={fmt(cit)} color={C.red}/>
              <DataRow label="Education Dev Levy @ 4%" value={fmt(dev)} color={C.red}/>
              {applyMin&&(
                <div className="ibox amber" style={{marginTop:8,marginBottom:8}}>
                  <div className="ititle" style={{color:C.amber}}>⚡ MINIMUM TAX APPLIES — NTA 2025 SEC 30</div>
                  <p style={{fontSize:11,color:C.ink,lineHeight:1.5}}>
                    Computed tax ({fmt(grossTax)}) is less than minimum tax of 0.5% of turnover ({fmt(minTax)}). Minimum tax ({fmt(minTax)}) applies.
                  </p>
                </div>
              )}
              <DataRow label={applyMin?"MINIMUM TAX (0.5% × Turnover)":"GROSS TAX"} value={fmt(finalGrossTax)} color={C.red} total={true}/>
            </>
          )}
        </div>

        {/* Section 4: Credits & Balance */}
        {!isSmall&&(
          <div className="card">
            <div className="ctitle">💳 WHT CREDIT & BALANCE PAYABLE</div>
            <div className="ibox slate" style={{marginBottom:10}}>
              <p style={{fontSize:11,color:C.ink,lineHeight:1.5}}>
                WHT deducted at source by customers on payments to you is a credit against CIT due — TAA 2025 Sec 74.
              </p>
            </div>
            <div className="fg">
              <label className="lbl">WHT CREDIT (₦)<span style={{fontWeight:400,textTransform:"none",letterSpacing:0,marginLeft:4,color:C.muted,fontSize:9}}>— WHT suffered this year</span></label>
              <input className="inp" type="number" value={f.whtCredit||""} onChange={e=>set("whtCredit",parseFloat(e.target.value)||0)}
                style={{background: override?"#fff":"#F8FAFC", color: override?"#0F172A":"#475569"}}
                readOnly={!override}
              />
              {!override&&<div style={{fontSize:10,color:C.muted,marginTop:3}}>↑ Computed from income transactions with WHT deducted</div>}
            </div>

            <div style={{background:C.redBg,border:`1px solid ${C.red}30`,borderRadius:10,padding:"12px",marginTop:4}}>
              <DataRow label="Gross Tax" value={fmt(finalGrossTax)} color={C.red}/>
              <DataRow label="Less: WHT Credit" value={`-${fmt(whtCredit)}`} color={C.green}/>
              {overpaid>0
                ? <DataRow label="OVERPAID — REFUND CLAIM" value={fmt(overpaid)} color={C.green} total={true}/>
                : <DataRow label="NET CIT BALANCE PAYABLE" value={fmt(balanceDue)} color={C.red} total={true}/>
              }
            </div>

            {balanceDue>0&&(
              <div className="ibox amber" style={{marginTop:10}}>
                <div className="ititle" style={{color:C.amber}}>📅 Payment deadline — TAA 2025 Sec 11</div>
                <p style={{fontSize:11,color:C.ink,lineHeight:1.5}}>
                  CIT is due <strong>6 months after your accounting year-end</strong>. Late payment attracts interest at CBN MPR + 15% (≈41.75% p.a.) plus ₦250,000 filing penalty.
                </p>
              </div>
            )}
          </div>
        )}

        {/* Section 5: Summary card */}
        <div className="card" style={{background:"linear-gradient(135deg,#0B1628,#1E3A5F)",border:"none"}}>
          <div style={{fontSize:10,fontWeight:700,letterSpacing:".1em",color:"rgba(255,255,255,.5)",marginBottom:10}}>CIT RETURN SUMMARY · {f.taxYear}</div>
          {[
            {l:"Turnover",           v:fmt(f.turnover),         c:"#fff"},
            {l:"Taxable Profit",     v:fmt(taxableProfit),      c:taxableProfit>0?"#4ADE80":"#94A3B8"},
            {l:"CIT + Dev Levy",     v:fmt(isSmall?0:grossTax), c:isSmall?"#4ADE80":"#F87171"},
            {l:"WHT Credit",         v:`-${fmt(isSmall?0:whtCredit)}`, c:"#4ADE80"},
            {l:"BALANCE DUE",        v:fmt(isSmall?0:balanceDue), c:isSmall?"#4ADE80":"#F87171"},
            {l:"Effective Tax Rate", v:`${isSmall?"0.0":eff}%`, c:"#93C5FD"},
          ].map(r=>(
            <div key={r.l} style={{display:"flex",justifyContent:"space-between",alignItems:"center",
              padding:"7px 0",borderBottom:"1px solid rgba(255,255,255,.07)"}}>
              <span style={{fontSize:12,color:"rgba(255,255,255,.6)"}}>{r.l}</span>
              <span style={{fontSize:13,fontWeight:700,color:r.c}}>{r.v}</span>
            </div>
          ))}
          <div style={{marginTop:14,fontSize:10,color:"rgba(255,255,255,.35)",textAlign:"center",lineHeight:1.6}}>
            Nigeria Tax Act 2025 (No. 3) · Tax Administration Act 2025 (No. 5){"\n"}
            Small company threshold: ₦50M turnover · ₦250M assets · not professional services
          </div>
        </div>

      </div>
    </div>
  );
}

function OwnAccountsScreen({ownAccounts, setOwnAccounts, onBack}){
  const[saved,setSaved]=useState(false);
  const[form,setForm]=useState({bankName:"",accountName:"",accountNumber:""});
  const[error,setError]=useState("");
  const set=(k,v)=>setForm(p=>({...p,[k]:v}));
  const add=()=>{
    if(!form.accountName.trim()&&!form.accountNumber.trim())
      return setError("Enter at least account name or account number");
    setOwnAccounts(p=>[...p,{id:Date.now(),...form}]);
    setForm({bankName:"",accountName:"",accountNumber:""});
    setError("");
    setSaved(true);
    setTimeout(()=>setSaved(false), 3000);
  };
  return(
    <div style={{paddingBottom:100}}>
      <Hdr title="My Own Accounts" subtitle="Transfers between these are excluded from taxable income" onBack={onBack}/>
      {saved&&(
        <div style={{position:"fixed",top:70,left:"50%",transform:"translateX(-50%)",
          background:"#059669",color:"#fff",padding:"10px 20px",borderRadius:10,
          fontSize:12,fontWeight:700,zIndex:999,boxShadow:"0 4px 12px rgba(0,0,0,.2)",
          whiteSpace:"nowrap"}}>
          ✓ Account saved — existing transactions reclassified
        </div>
      )}
      <div className="pad">
        <div className="ibox blue" style={{marginBottom:12}}>
          <div className="ititle" style={{color:C.blue}}>Why add your own accounts?</div>
          <p style={{fontSize:11,color:C.ink,lineHeight:1.6}}>
            When you import a bank statement, transfers between your own accounts (e.g. moving money from your GTBank to your Access Bank account) show up as income. Adding your accounts here tells TaxWise to automatically exclude these transfers from taxable income.
          </p>
        </div>

        <div className="card">
          <div className="ctitle">ADD AN ACCOUNT</div>
          <div className="fg">
            <label className="lbl">BANK NAME</label>
            <select className="sel" value={form.bankName} onChange={e=>set("bankName",e.target.value)}>
              <option value="">— Select bank —</option>
              {NIGERIAN_BANKS.map(b=><option key={b} value={b}>{b}</option>)}
            </select>
          </div>
          <div className="fg">
            <label className="lbl">ACCOUNT NAME (as it appears in narrations)</label>
            <input className="inp" placeholder="e.g. ADAEZE OKONKWO or SUNSHINE VENTURES LTD" value={form.accountName} onChange={e=>set("accountName",e.target.value)}/>
          </div>
          <div className="fg">
            <label className="lbl">ACCOUNT NUMBER (last 4-10 digits is fine)</label>
            <input className="inp" placeholder="e.g. 0123456789 or last 4 digits 6789" value={form.accountNumber} onChange={e=>set("accountNumber",e.target.value)} type="text" inputMode="numeric"/>
          </div>
          {error&&<div style={{color:C.red,fontSize:11,marginBottom:8}}>⚠ {error}</div>}
          <button onClick={add}
            style={{width:"100%",padding:"11px",background:C.blue,border:"none",
              borderRadius:10,color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
            + Add Account
          </button>
        </div>

        {ownAccounts.length>0&&(
          <div className="card">
            <div className="ctitle">YOUR REGISTERED ACCOUNTS ({ownAccounts.length})</div>
            {ownAccounts.map(a=>(
              <div key={a.id} style={{display:"flex",gap:10,alignItems:"center",
                padding:"10px 0",borderBottom:`1px solid ${C.border}`}}>
                <div style={{flex:1}}>
                  <div style={{fontSize:13,fontWeight:700,color:C.ink}}>{a.bankName||"Bank"}</div>
                  <div style={{fontSize:11,color:C.slate}}>{a.accountName}</div>
                  {a.accountNumber&&<div style={{fontSize:11,color:C.muted}}>Acct: {a.accountNumber}</div>}
                </div>
                <button onClick={()=>setOwnAccounts(p=>p.filter(x=>x.id!==a.id))}
                  style={{padding:"5px 10px",background:"#FEF2F2",border:"1px solid #FCA5A5",
                    borderRadius:7,color:C.red,fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
                  Remove
                </button>
              </div>
            ))}
            <div style={{fontSize:11,color:C.muted,marginTop:8,lineHeight:1.6}}>
              TaxWise will scan transaction narrations for these names/numbers and automatically flag matches as non-taxable own-account transfers.
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ── ResetDataModal ───────────────────────────────────────────────────────────
function ResetDataModal({txns, setTxns, assets, setAssets, importRules, setImportRules, setOwnAccounts, profile, setProfile}){
  const [open, setOpen] = useState(false);
  const [step, setStep] = useState(1); // 1=confirm financial, 2=ask optional
  const [delOwnAccounts, setDelOwnAccounts] = useState(false);
  const [delRules, setDelRules] = useState(false);
  const [delProfile, setDelProfile] = useState(false);
  const [done, setDone] = useState(false);

  const txnCount = txns.length;
  const assetCount = (assets||[]).length;

  const doReset = () => {
    // Always delete: transactions and assets (financial data)
    setTxns([]);
    if(setAssets) setAssets([]);
    // Optional: own accounts — also clears from persistent settings store
    if(delOwnAccounts && setOwnAccounts){
      setOwnAccounts([]);
      saveSettings({ownAccounts:[], importRules: delRules?[]:(loadSettings()?.importRules||[])});
    }
    // Optional: import rules — also clears from persistent settings store
    if(delRules && setImportRules){
      setImportRules([]);
      saveSettings({importRules:[], ownAccounts: delOwnAccounts?[]:(loadSettings()?.ownAccounts||[])});
    }
    // Optional: profile (reset to defaults but keep auth)
    if(delProfile && setProfile){
      setProfile(p=>({
        ...p,
        name:"", tin:"", phone:"", companyName:"", sector:"",
        empCategory:"A", vatRegistered:"no", monthlyIncome:0,
        payeDeducted:0, otherIncome:0, rentPaid:0, nhfAnnual:0,
        nhisAnnual:0, pensionAnnual:0, lifeInsAnnual:0, housingLoanInterest:0,
      }));
    }
    setDone(true);
  };

  if(!open) return(
    <button onClick={()=>{setOpen(true);setStep(1);setDone(false);setDelOwnAccounts(false);setDelRules(false);setDelProfile(false);}}
      style={{width:"100%",padding:"11px",background:"#FEF2F2",
        border:"1.5px solid #FECACA",borderRadius:10,
        color:"#DC2626",fontSize:13,fontWeight:700,
        cursor:"pointer",fontFamily:"inherit"}}>
      🗑 Clear Financial Data
    </button>
  );

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(11,22,40,.85)",zIndex:900,
      display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
      <div style={{width:"100%",maxWidth:430,background:"#fff",
        borderRadius:"20px 20px 0 0",padding:"24px 20px 36px"}}>

        {done?(
          <>
            <div style={{textAlign:"center",marginBottom:20}}>
              <div style={{fontSize:44,marginBottom:10}}>✅</div>
              <div style={{fontSize:18,fontWeight:800,color:"#0B1628",marginBottom:6}}>Data Cleared</div>
              <div style={{fontSize:13,color:"#64748B",lineHeight:1.6}}>
                {txnCount} transaction{txnCount!==1?"s":""} and {assetCount} asset{assetCount!==1?"s":""} deleted.
                {delRules?" Import rules cleared.":""}
                {delOwnAccounts?" Own accounts cleared.":""}
                {delProfile?" Profile information reset.":""}
              </div>
            </div>
            <button onClick={()=>setOpen(false)}
              style={{width:"100%",padding:"13px",background:"#059669",border:"none",
                borderRadius:12,color:"#fff",fontSize:14,fontWeight:700,
                cursor:"pointer",fontFamily:"inherit"}}>
              Done
            </button>
          </>
        ):step===1?(
          <>
            <div style={{fontSize:11,fontWeight:700,color:"#DC2626",letterSpacing:".08em",marginBottom:12}}>
              CLEAR FINANCIAL DATA
            </div>
            <div style={{background:"#FEF2F2",border:"1px solid #FECACA",borderRadius:12,
              padding:"14px",marginBottom:16}}>
              <div style={{fontSize:14,fontWeight:700,color:"#DC2626",marginBottom:8}}>
                This will permanently delete:
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:6}}>
                {[
                  `${txnCount} transaction${txnCount!==1?"s":""} (journal entries, imports)`,
                  `${assetCount} asset${assetCount!==1?"s":""} in the asset register`,
                  "All excluded transactions",
                  "KIV / compliance queue items",
                ].map((item,i)=>(
                  <div key={i} style={{display:"flex",gap:8,alignItems:"flex-start",fontSize:12,color:"#7F1D1D"}}>
                    <span style={{color:"#DC2626",flexShrink:0}}>✗</span>{item}
                  </div>
                ))}
              </div>
            </div>
            <div style={{background:"#F0FDF4",border:"1px solid #BBF7D0",borderRadius:10,
              padding:"10px 12px",marginBottom:16,fontSize:11,color:"#166534",lineHeight:1.5}}>
              <strong>Not deleted:</strong> Your profile, own accounts, import rules, and cloud account remain intact.
              You will be asked about those on the next screen.
            </div>
            <button onClick={()=>setStep(2)}
              style={{width:"100%",padding:"13px",background:"#DC2626",border:"none",
                borderRadius:12,color:"#fff",fontSize:14,fontWeight:700,
                cursor:"pointer",fontFamily:"inherit",marginBottom:10}}>
              Continue →
            </button>
            <button onClick={()=>setOpen(false)}
              style={{width:"100%",padding:"12px",background:"none",
                border:"1.5px solid #E2E8F0",borderRadius:12,color:"#64748B",
                fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>
              Cancel
            </button>
          </>
        ):(
          <>
            <div style={{fontSize:11,fontWeight:700,color:"#475569",letterSpacing:".08em",marginBottom:12}}>
              ALSO DELETE? (OPTIONAL)
            </div>
            <div style={{fontSize:12,color:"#64748B",marginBottom:14,lineHeight:1.6}}>
              Your financial data will be cleared. Do you also want to delete any of the following?
            </div>
            {[
              {key:"delOwnAccounts", val:delOwnAccounts, set:setDelOwnAccounts,
                label:"Own Accounts",
                sub:"Bank accounts you marked as yours — used for transfer detection"},
              {key:"delRules", val:delRules, set:setDelRules,
                label:"Import Rules",
                sub:"Auto-classification rules you created for recurring transactions"},
              {key:"delProfile", val:delProfile, set:setDelProfile,
                label:"Profile Information",
                sub:"Your name, TIN, income details, tax category — keeps you signed in"},
            ].map(item=>(
              <div key={item.key} onClick={()=>item.set(v=>!v)}
                style={{display:"flex",gap:10,alignItems:"flex-start",
                  padding:"12px",marginBottom:8,cursor:"pointer",
                  border:`1.5px solid ${item.val?"#DC2626":"#E2E8F0"}`,
                  borderRadius:10,background:item.val?"#FEF2F2":"#fff"}}>
                <div style={{width:20,height:20,borderRadius:5,flexShrink:0,marginTop:1,
                  border:`2px solid ${item.val?"#DC2626":"#CBD5E1"}`,
                  background:item.val?"#DC2626":"#fff",
                  display:"flex",alignItems:"center",justifyContent:"center"}}>
                  {item.val&&<span style={{color:"#fff",fontSize:12,fontWeight:900}}>✓</span>}
                </div>
                <div>
                  <div style={{fontSize:13,fontWeight:700,color:item.val?"#DC2626":"#0F172A"}}>{item.label}</div>
                  <div style={{fontSize:11,color:"#94A3B8",marginTop:2}}>{item.sub}</div>
                </div>
              </div>
            ))}
            <button onClick={doReset}
              style={{width:"100%",padding:"13px",background:"#DC2626",border:"none",
                borderRadius:12,color:"#fff",fontSize:14,fontWeight:700,
                cursor:"pointer",fontFamily:"inherit",marginBottom:10,marginTop:4}}>
              Clear Data Now
            </button>
            <button onClick={()=>setOpen(false)}
              style={{width:"100%",padding:"12px",background:"none",
                border:"1.5px solid #E2E8F0",borderRadius:12,color:"#64748B",
                fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>
              Cancel
            </button>
          </>
        )}
      </div>
    </div>
  );
}

function ImportRulesScreen({importRules, setImportRules, onBack}){
  const[ruleSaved,setRuleSaved]=useState(false);
  const blank={id:null,name:"",
    matchField:"description", // "description" | "account_number" | "name" | "phone" | "any"
    pattern:"",matchType:"contains",
    newType:"",newCategory:"",taxAllowable:true,included:true,appendNote:""};
  const[form,setForm]=useState({...blank});
  const[editing,setEditing]=useState(false);
  const[error,setError]=useState("");
  const set=(k,v)=>setForm(p=>({...p,[k]:v}));

  const TYPES=[["income","Income"],["expense","Expense"],["asset","Capital Asset"],["transfer","Transfer (non-taxable)"]];
  const CATEGORIES=[["revenue","Revenue"],["salary","Salary"],["rent","Rent"],["professional_fee","Professional Fee"],
    ["supplies","Supplies"],["utility","Utility"],["tax_payment","Tax Payment"],["bank_charge","Bank Charge"],
    ["loan","Loan"],["pension_remittance","Pension Remittance"],["own_account_transfer","Own Account Transfer"],
    ["refund","Refund"],["other","Other"]];

  const MATCH_FIELDS=[
    ["description","Transaction Description / Narration"],
    ["account_number","Account Number (transfer to/from)"],
    ["name","Account Name (transfer to/from)"],
    ["phone","Phone Number (transfer to/from)"],
    ["any","Any field (description, name, account, phone)"],
  ];

  const save=()=>{
    if(!form.pattern.trim()) return setError("Enter a keyword, number or name to match");
    if(!form.name.trim()) return setError("Give this rule a name");
    if(editing){
      setImportRules(p=>p.map(r=>r.id===form.id?form:r));
    } else {
      setImportRules(p=>[...p,{...form,id:Date.now()}]);
    }
    setForm({...blank});
    setEditing(false);
    setError("");
    setRuleSaved(true);
    setTimeout(()=>setRuleSaved(false), 3000);
  };
  const edit=(r)=>{setForm({...r,matchField:r.matchField||"description"});setEditing(true);};
  const remove=(id)=>setImportRules(p=>p.filter(r=>r.id!==id));

  const matchFieldLabel = MATCH_FIELDS.find(([v])=>v===form.matchField)?.[1]||"description";

  const placeholders = {
    description:"e.g. CHIDI OKAFOR or PENSION or TRF FROM SAVINGS",
    account_number:"e.g. 0123456789 or 2045678901",
    name:"e.g. AMARA NWOSU or KEMI ADEYEMI",
    phone:"e.g. 08023456789 or +2348034567890",
    any:"e.g. GRACE or 0123456789 — matches any field",
  };

  return(
    <div style={{paddingBottom:100}}>
      <Hdr title="Import Rules" subtitle="Auto-classify transactions on every import" onBack={onBack}/>
      {ruleSaved&&(
        <div style={{position:"fixed",top:70,left:"50%",transform:"translateX(-50%)",
          background:"#059669",color:"#fff",padding:"10px 20px",borderRadius:10,
          fontSize:12,fontWeight:700,zIndex:999,boxShadow:"0 4px 12px rgba(0,0,0,.2)",
          whiteSpace:"nowrap"}}>
          ✓ Rule saved — existing transactions reclassified
        </div>
      )}
      <div className="pad">
        <div className="ibox blue" style={{marginBottom:12}}>
          <div className="ititle" style={{color:C.blue}}>What are Import Rules?</div>
          <p style={{fontSize:11,color:C.ink,lineHeight:1.6}}>
            Rules tell TaxWise how to automatically classify transactions on every import.
            Match by description, account number, name, or phone number — then set the tax treatment.
            Example: "Transfers to/from account 0123456789 are own-account transfers, non-taxable."
          </p>
        </div>

        <div className="card">
          <div className="ctitle">{editing?"EDIT RULE":"CREATE A RULE"}</div>
          <div className="fg">
            <label className="lbl">RULE NAME (for your reference)</label>
            <input className="inp" placeholder="e.g. Grace pension transfers or My GTBank savings" value={form.name} onChange={e=>set("name",e.target.value)}/>
          </div>

          <div className="fg">
            <label className="lbl">MATCH BY</label>
            <select className="sel" value={form.matchField||"description"} onChange={e=>set("matchField",e.target.value)}>
              {MATCH_FIELDS.map(([v,l])=><option key={v} value={v}>{l}</option>)}
            </select>
            <div style={{fontSize:10,color:C.muted,marginTop:4,lineHeight:1.5}}>
              {form.matchField==="account_number"&&"TaxWise will scan narrations for this account number (transfers usually include it)."}
              {form.matchField==="name"&&"TaxWise will scan narrations for this person or company name."}
              {form.matchField==="phone"&&"TaxWise will scan narrations for this phone number (common in mobile money transfers)."}
              {form.matchField==="any"&&"Matches anywhere — in description, name, account number, or phone."}
              {form.matchField==="description"&&"Matches the full transaction narration/description."}
            </div>
          </div>

          <div className="fg">
            <label className="lbl">
              {form.matchField==="account_number"?"ACCOUNT NUMBER TO MATCH"
               :form.matchField==="name"?"NAME TO MATCH"
               :form.matchField==="phone"?"PHONE NUMBER TO MATCH"
               :"KEYWORD OR PHRASE TO MATCH"}
            </label>
            <input className="inp"
              placeholder={placeholders[form.matchField||"description"]}
              value={form.pattern} onChange={e=>set("pattern",e.target.value)}
              inputMode={form.matchField==="account_number"||form.matchField==="phone"?"numeric":"text"}
            />
          </div>

          <div className="fg">
            <label className="lbl">MATCH TYPE</label>
            <select className="sel" value={form.matchType} onChange={e=>set("matchType",e.target.value)}>
              <option value="contains">Contains (anywhere in the field)</option>
              <option value="startsWith">Starts with</option>
              <option value="endsWith">Ends with</option>
              <option value="exact">Exact match</option>
            </select>
          </div>
          <div className="fg">
            <label className="lbl">RECLASSIFY AS — Transaction Type</label>
            <select className="sel" value={form.newType} onChange={e=>set("newType",e.target.value)}>
              <option value="">Keep original classification</option>
              {TYPES.map(([v,l])=><option key={v} value={v}>{l}</option>)}
            </select>
          </div>
          <div className="fg">
            <label className="lbl">RECLASSIFY AS — Category</label>
            <select className="sel" value={form.newCategory} onChange={e=>set("newCategory",e.target.value)}>
              <option value="">Keep original category</option>
              {CATEGORIES.map(([v,l])=><option key={v} value={v}>{l}</option>)}
            </select>
          </div>
          <div style={{display:"flex",gap:8,marginBottom:10}}>
            <div style={{flex:1}}>
              <label className="lbl">TAX TREATMENT</label>
              <select className="sel" value={form.taxAllowable?"yes":"no"} onChange={e=>set("taxAllowable",e.target.value==="yes")}>
                <option value="yes">Allowable / Taxable</option>
                <option value="no">Non-allowable / Exclude from tax</option>
              </select>
            </div>
            <div style={{flex:1}}>
              <label className="lbl">INCLUDE IN IMPORT</label>
              <select className="sel" value={form.included?"yes":"no"} onChange={e=>set("included",e.target.value==="yes")}>
                <option value="yes">Include (post to journal)</option>
                <option value="no">Exclude (don't post)</option>
              </select>
            </div>
          </div>
          <div className="fg">
            <label className="lbl">ADD NOTE TO DESCRIPTION (optional)</label>
            <input className="inp" placeholder="e.g. Pension remittance payable — not income" value={form.appendNote} onChange={e=>set("appendNote",e.target.value)}/>
          </div>
          {error&&<div style={{color:C.red,fontSize:11,marginBottom:8}}>⚠ {error}</div>}
          <div style={{display:"flex",gap:8}}>
            {editing&&<button onClick={()=>{setForm({...blank});setEditing(false);}}
              style={{flex:1,padding:"10px",background:"#F1F5F9",border:"1px solid "+C.border,
                borderRadius:9,color:C.muted,fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
              Cancel
            </button>}
            <button onClick={save}
              style={{flex:2,padding:"11px",background:C.blue,border:"none",
                borderRadius:10,color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
              {editing?"Update Rule":"+ Save Rule"}
            </button>
          </div>
        </div>

        {importRules.length>0&&(
          <div className="card">
            <div className="ctitle">ACTIVE RULES ({importRules.length})</div>
            {importRules.map((r,i)=>(
              <div key={r.id} style={{padding:"10px 0",borderBottom:`1px solid ${C.border}`}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:4}}>
                  <div style={{fontWeight:700,fontSize:12,color:C.ink}}>{r.name||r.pattern}</div>
                  <div style={{display:"flex",gap:6}}>
                    <button onClick={()=>edit(r)}
                      style={{padding:"3px 8px",background:C.blueLight,border:`1px solid ${C.blueBorder}`,
                        borderRadius:5,color:C.blue,fontSize:10,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
                      Edit
                    </button>
                    <button onClick={()=>remove(r.id)}
                      style={{padding:"3px 8px",background:"#FEF2F2",border:"1px solid #FCA5A5",
                        borderRadius:5,color:C.red,fontSize:10,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
                      Delete
                    </button>
                  </div>
                </div>
                <div style={{fontSize:11,color:C.muted,lineHeight:1.6}}>
                  <span style={{background:"#EFF6FF",color:"#1D4ED8",padding:"1px 6px",
                    borderRadius:4,fontSize:10,fontWeight:600,marginRight:4}}>
                    {(r.matchField||"description")==="account_number"?"Acct No."
                     :(r.matchField)==="name"?"Name"
                     :(r.matchField)==="phone"?"Phone"
                     :(r.matchField)==="any"?"Any field"
                     :"Description"}
                  </span>
                  <strong>{r.matchType}</strong> "<strong>{r.pattern}</strong>"
                  {r.newType&&<span> → <strong>{r.newType}</strong></span>}
                  {r.newCategory&&<span> · <strong>{r.newCategory}</strong></span>}
                  <span> · {r.taxAllowable?"✓ Allowable":"✗ Non-allowable"}</span>
                  <span> · {r.included?"Include":"Exclude"}</span>
                  {r.appendNote&&<span> · "{r.appendNote}"</span>}
                </div>
              </div>
            ))}
          </div>
        )}

        {importRules.length===0&&(
          <div style={{textAlign:"center",color:C.muted,fontSize:12,padding:"24px 0"}}>
            No rules yet. Create your first rule above.
          </div>
        )}
      </div>
    </div>
  );
}

function CGTPanel({cgtData,setCgtData}){
  const cgtR=computeCGT(cgtData);
  const set=(k,v)=>setCgtData(p=>({...p,[k]:v}));
  const isShares=cgtData.assetType==="shares_listed"||cgtData.assetType==="shares_unlisted";
  return(
    <div style={{paddingBottom:8}}>

      <div className="card">
        <div className="ctitle">STEP 1 — ASSET DISPOSED</div>
        <div style={{fontSize:11,color:C.muted,marginBottom:10}}>What type of asset did you sell or dispose of?</div>
        <select className="sel" value={cgtData.assetType} onChange={e=>set("assetType",e.target.value)}>
          <option value="land_building">Land or Building</option>
          <option value="shares_listed">Shares — Listed (Stock Exchange)</option>
          <option value="shares_unlisted">Shares — Unlisted / Private Company</option>
          <option value="vehicle">Vehicle (personal use)</option>
          <option value="chattel">Personal Chattel (furniture, jewellery, etc.)</option>
          <option value="digital_asset">Digital / Virtual Asset (crypto, NFT, etc.)</option>
          <option value="principal_residence">Principal Private Residence</option>
          <option value="other">Other Asset</option>
        </select>
        {cgtData.assetType==="principal_residence"&&(
          <div className="ibox green" style={{marginTop:8}}>
            <div className="ititle" style={{color:C.green}}>Likely Exempt</div>
            <p style={{fontSize:11,color:C.ink}}>Your principal private residence is exempt from CGT [NTA 2025 S.34]. Must be your actual main home.</p>
          </div>
        )}
        {cgtData.assetType==="vehicle"&&(
          <div className="ibox green" style={{marginTop:8}}>
            <div className="ititle" style={{color:C.green}}>Likely Exempt (individuals)</div>
            <p style={{fontSize:11,color:C.ink}}>Up to 2 personal vehicles are exempt for individuals. Company vehicles are NOT exempt — 30% CGT applies.</p>
          </div>
        )}
        {cgtData.assetType==="chattel"&&(
          <div className="ibox blue" style={{marginTop:8}}>
            <div className="ititle" style={{color:C.blue}}>Chattel Threshold</div>
            <p style={{fontSize:11,color:C.ink}}>Personal chattels are exempt if total proceeds do not exceed N5,000,000 [NTA 2025 S.32].</p>
          </div>
        )}
        {cgtData.assetType==="digital_asset"&&(
          <div className="ibox amber" style={{marginTop:8}}>
            <div className="ititle" style={{color:C.amber}}>Fully Taxable — New Under NTA 2025</div>
            <p style={{fontSize:11,color:C.ink}}>Crypto, NFTs and all digital/virtual assets are now explicitly chargeable under NTA 2025 S.34. Keep all transaction records from exchanges.</p>
          </div>
        )}
        {isShares&&(
          <div className="ibox blue" style={{marginTop:8}}>
            <div className="ititle" style={{color:C.blue}}>Share Disposal Exemption</div>
            <p style={{fontSize:11,color:C.ink}}>Exempt if total proceeds in the year are N150m or less AND the gain on this disposal is N10m or less. Reinvesting proceeds into a Nigerian company gives full exemption.</p>
          </div>
        )}
      </div>

      <div className="card">
        <div className="ctitle">STEP 2 — TAXPAYER TYPE</div>
        <div style={{display:"flex",gap:8,marginBottom:8}}>
          {[["individual","Individual"],["company","Company"]].map(([v,l])=>(
            <button key={v} onClick={()=>set("isCompany",v==="company")}
              style={{flex:1,padding:9,border:"2px solid "+((!cgtData.isCompany&&v==="individual")||(cgtData.isCompany&&v==="company")?C.blue:C.border),
                background:(!cgtData.isCompany&&v==="individual")||(cgtData.isCompany&&v==="company")?C.blueLight:"#fff",
                borderRadius:8,cursor:"pointer",fontSize:12,fontWeight:700,
                color:(!cgtData.isCompany&&v==="individual")||(cgtData.isCompany&&v==="company")?C.blue:C.muted,fontFamily:"inherit"}}>{l}</button>
          ))}
        </div>
        {cgtData.isCompany&&(
          <div>
            <div style={{fontSize:11,color:C.muted,marginBottom:6}}>Small company? (turnover N100m or less AND fixed assets N250m or less, not a professional services firm)</div>
            <div style={{display:"flex",gap:8}}>
              {[["yes","Yes — 0% CGT"],["no","No — 30% CGT"]].map(([v,l])=>(
                <button key={v} onClick={()=>set("isSmallCompany",v==="yes")}
                  style={{flex:1,padding:8,border:"2px solid "+((cgtData.isSmallCompany&&v==="yes")||(!cgtData.isSmallCompany&&v==="no")?C.blue:C.border),
                    background:(cgtData.isSmallCompany&&v==="yes")||(!cgtData.isSmallCompany&&v==="no")?C.blueLight:"#fff",
                    borderRadius:8,cursor:"pointer",fontSize:11,fontWeight:700,
                    color:(cgtData.isSmallCompany&&v==="yes")||(!cgtData.isSmallCompany&&v==="no")?C.blue:C.muted,fontFamily:"inherit"}}>{l}</button>
              ))}
            </div>
          </div>
        )}
      </div>

      <div className="card">
        <div className="ctitle">STEP 3 — DISPOSAL DETAILS</div>
        <div className="fg">
          <label className="lbl">SALE / DISPOSAL PROCEEDS (N)</label>
          <input className="inp" type="number" value={cgtData.proceeds||""} onChange={e=>set("proceeds",parseFloat(e.target.value)||0)}/>
        </div>
        <div style={{fontSize:11,color:C.muted,marginBottom:6,marginTop:4}}>Was Capital Allowance ever claimed on this asset?</div>
        <div style={{display:"flex",gap:8,marginBottom:10}}>
          {[["no","No — use original cost"],["yes","Yes — use TWDV as cost base"]].map(([v,l])=>(
            <button key={v} onClick={()=>set("caWasClaimed",v==="yes")}
              style={{flex:1,padding:7,border:"2px solid "+((!cgtData.caWasClaimed&&v==="no")||(cgtData.caWasClaimed&&v==="yes")?C.blue:C.border),
                background:(!cgtData.caWasClaimed&&v==="no")||(cgtData.caWasClaimed&&v==="yes")?C.blueLight:"#fff",
                borderRadius:7,cursor:"pointer",fontSize:11,fontWeight:700,
                color:(!cgtData.caWasClaimed&&v==="no")||(cgtData.caWasClaimed&&v==="yes")?C.blue:C.muted,fontFamily:"inherit"}}>{l}</button>
          ))}
        </div>
        {!cgtData.caWasClaimed
          ? <div className="fg">
              <label className="lbl">ORIGINAL ACQUISITION COST (N)</label>
              <input className="inp" type="number" value={cgtData.cost||""} onChange={e=>set("cost",parseFloat(e.target.value)||0)}/>
            </div>
          : <div className="fg">
              <label className="lbl">TAX WRITTEN DOWN VALUE / TWDV (N) — from your asset register</label>
              <input className="inp" type="number" value={cgtData.twdv||""} onChange={e=>set("twdv",parseFloat(e.target.value)||0)}/>
              <div style={{fontSize:10,color:C.muted,marginTop:3}}>If CA was claimed, cost base = TWDV not original cost. This prevents double deduction.</div>
            </div>
        }
        <div style={{marginTop:8,padding:"10px 12px",background:"#F0FDF4",border:"1px solid #BBF7D0",borderRadius:8}}>
          <div style={{fontSize:12,fontWeight:700,color:C.green,marginBottom:6}}>Reinvestment Exemption</div>
          <div style={{fontSize:11,color:C.ink,marginBottom:8}}>Reinvesting proceeds into a Nigerian company? If yes, the FULL gain is exempt — no CGT.</div>
          <div style={{display:"flex",gap:8}}>
            {[["yes","Yes — Reinvesting"],["no","No"]].map(([v,l])=>(
              <button key={v} onClick={()=>set("reinvestedInNigeria",v==="yes")}
                style={{flex:1,padding:7,border:"2px solid "+((cgtData.reinvestedInNigeria&&v==="yes")||(!cgtData.reinvestedInNigeria&&v==="no")?C.green:C.border),
                  background:(cgtData.reinvestedInNigeria&&v==="yes")||(!cgtData.reinvestedInNigeria&&v==="no")?"#DCFCE7":"#fff",
                  borderRadius:7,cursor:"pointer",fontSize:11,fontWeight:700,
                  color:(cgtData.reinvestedInNigeria&&v==="yes")||(!cgtData.reinvestedInNigeria&&v==="no")?C.green:C.muted,fontFamily:"inherit"}}>{l}</button>
            ))}
          </div>
        </div>
      </div>

      {isShares&&(
        <div className="card">
          <div className="ctitle">STEP 4 — SHARE DISPOSAL DETAILS</div>
          <div className="ibox blue" style={{marginBottom:10}}>
            <p style={{fontSize:11,color:C.ink}}>Exempt if total year proceeds are N150m or less AND gain on this disposal is N10m or less [NTA 2025 S.45].</p>
          </div>
          <div className="fg">
            <label className="lbl">TOTAL SHARE DISPOSAL PROCEEDS THIS YEAR (N)</label>
            <input className="inp" type="number" value={cgtData.sharesSaleInYear||""} onChange={e=>set("sharesSaleInYear",parseFloat(e.target.value)||0)}/>
          </div>
          <div className="fg">
            <label className="lbl">GAIN ON THIS SPECIFIC DISPOSAL (N)</label>
            <input className="inp" type="number" value={cgtData.sharesGain||""} onChange={e=>set("sharesGain",parseFloat(e.target.value)||0)}/>
          </div>
          <div style={{fontSize:10,color:C.muted,marginTop:4}}>
            Note: disposing of shares in an offshore holding company that owns Nigerian assets also triggers Nigerian CGT [S.46]. Consult a tax consultant for treaty analysis.
          </div>
        </div>
      )}

      {!cgtData.isCompany&&!cgtR.exempt&&(
        <div className="card">
          <div className="ctitle">STEP {isShares?"5":"4"} — YOUR OTHER ANNUAL INCOME</div>
          <div style={{fontSize:11,color:C.muted,marginBottom:8}}>CGT for individuals is taxed at your PIT rate. Enter other income so TaxWise can determine the right band.</div>
          <div className="fg">
            <label className="lbl">TOTAL OTHER ANNUAL INCOME (N) — salary, business profit, rent, dividends</label>
            <input className="inp" type="number" value={cgtData.otherAnnualIncome||""} onChange={e=>set("otherAnnualIncome",parseFloat(e.target.value)||0)}/>
          </div>
        </div>
      )}

      <div className="card" style={{background:cgtR.exempt?"linear-gradient(135deg,#064E3B,#065F46)":"linear-gradient(135deg,"+C.navy+",#1E3A5F)",border:"none"}}>
        <div style={{fontSize:10,fontWeight:700,color:"rgba(255,255,255,.5)",letterSpacing:".08em",marginBottom:10}}>CGT RESULT — NTA 2025</div>
        <DataRow label="Disposal Proceeds" value={fmt(cgtData.proceeds)} color="#fff"/>
        <DataRow label="Cost Base" value={"-"+fmt(cgtR.costBase)} color="rgba(255,255,255,.7)"/>
        <DataRow label="Chargeable Gain" value={fmt(cgtR.gain)} color="#93C5FD"/>
        {!cgtR.exempt&&cgtR.taxableGain!=null&&cgtR.taxableGain<cgtR.gain&&(
          <DataRow label="Less N50m Exemption" value={"-"+fmt(cgtR.gain-cgtR.taxableGain)} color="#4ADE80"/>
        )}
        {cgtR.exempt?(
          <div style={{marginTop:10,padding:"10px 12px",background:"rgba(74,222,128,.15)",border:"1px solid rgba(74,222,128,.3)",borderRadius:8}}>
            <div style={{fontSize:13,fontWeight:700,color:"#4ADE80",marginBottom:4}}>EXEMPT — NO CGT DUE</div>
            <div style={{fontSize:11,color:"rgba(255,255,255,.7)"}}>{cgtR.exemptReason}</div>
          </div>
        ):(
          <>
            <DataRow label={"CGT Rate ("+cgtR.tier+")"} value={(cgtR.rate||0).toFixed(1)+"%"} color="#FCD34D"/>
            <DataRow label="CGT PAYABLE" value={fmt(cgtR.tax)} color="#F87171" total={true}/>
            <div style={{marginTop:10,padding:"8px 10px",background:"rgba(255,255,255,.08)",borderRadius:7}}>
              <div style={{fontSize:10,color:"rgba(255,255,255,.6)"}}>CGT is due by 31 March of the following year. Late payment attracts interest at approx 41.75% p.a.</div>
            </div>
          </>
        )}
      </div>

      <div className="ibox amber">
        <div className="ititle" style={{color:C.amber}}>Important Notes</div>
        <div style={{fontSize:11,color:C.ink,lineHeight:1.9}}>
          <div>Keep all acquisition documents — the NRS can request proof of your cost base.</div>
          <div>If CA was ever claimed on this asset, TWDV is your cost base, NOT the original price.</div>
          <div>Digital asset gains (crypto, NFTs) are now fully taxable — keep transaction histories from exchanges.</div>
          <div>Offshore share disposals involving Nigerian assets may trigger CGT even if the sale happened abroad.</div>
          <div>For complex disposals, consult a registered tax consultant before filing.</div>
        </div>
      </div>

    </div>
  );
}

function CalculateScreen({profile,onBack}){
  const[tab,setTab]=useState("pit");
  const[pitData,setPitData]=useState({monthlyIncome:0,payeDeducted:0,otherIncome:0,rentPaid:0,nhfAnnual:0,nhisAnnual:0,pensionAnnual:0,lifeInsAnnual:0,housingLoanInterest:0,category:profile.empCategory||"A"});
  useEffect(()=>{
    setPitData(p=>({...p, category:profile.empCategory||"A"}));
  },[profile.empCategory]);
  const[whtData,setWhtData]=useState({amount:200000,type:"professional"});
  const[vatData,setVatData]=useState({amount:500000,tier:"standard"});
  const[penData,setPenData]=useState({tax:500000,days:30});
  const[cgtData,setCgtData]=useState({assetType:"other",isCompany:profile.mode==="company",isSmallCompany:false,proceeds:0,cost:0,caWasClaimed:false,twdv:0,otherAnnualIncome:0,reinvestedInNigeria:false,sharesSaleInYear:0,sharesGain:0});
  const pitR=computePIT(pitData);
  const whtR=computeWHT(whtData.amount,whtData.type);
  const vatR=computeVAT(vatData.amount,vatData.tier);
  const penR=computePenalty(penData.tax,penData.days,false);

    {name:"VAT Return & Payment",icon:"🧾",type:"VAT",law:"TAA 2025, Sec 16",rule:"21st of every month",desc:"File VAT return and remit net VAT"},

    {name:isCompany?"CIT Return":"Annual PIT Return",icon:"📊",type:isCompany?"CIT":"PIT",law:"TAA 2025, Sec 11",rule:isCompany?"6 months after year-end":"31 July annually",desc:"Self-assessment + payment"},
    ...(isCompany?[{name:"Annual PAYE Schedule",icon:"📄",type:"ANNUAL",law:"TAA 2025, Sec 14",rule:"31 January",desc:"File schedule for all employees"}]:[]),
  ];

  return(
    <div style={{paddingBottom:80}}>
      <Hdr title="Filing Deadlines" onBack={onBack}/>
      <div className="pad-full" style={{paddingTop:12}}>
        <div className="ibox red">
          <div className="ititle" style={{color:C.red}}>⚠ TAA 2025, Sec 65 — Penalty reminder</div>
          <p style={{fontSize:12,color:C.ink,lineHeight:1.6}}>
            {isCompany?"Company":"Individual"} late filing penalty: <strong>{isCompany?"₦250,000 first month + ₦50,000/month":"₦50,000 first month + ₦25,000/month"}</strong>. Plus interest at <strong>CBN MPR + 15% (≈41.75% p.a.)</strong>

          return(

                    <div style={{fontSize:14,fontWeight:700,color:C.ink}}>{d.name}</div>
                    <div style={{fontSize:11,color:C.muted,marginTop:1}}>{d.desc}</div>
                  </div>
                </div>
                <span className="pill" style={{background:bg,color:col,padding:"4px 10px",fontSize:11}}>
                  {days>0?`${days}d`:days===0?"TODAY":"OVERDUE"}
                </span>
              </div>
              <div style={{background:C.surface,borderRadius:7,padding:"7px 10px",fontSize:11,color:C.muted}}>{d.rule} · {d.law}</div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function VATScreen({txns,onBack}){
  const[output,setOutput]=useState(0);
  const[input,setInput]=useState(0);
  const agg=computeAggregates(txns);
  const ov=output||agg.vatOut;
  const iv=input||agg.vatIn;
  const net=ov-iv;
  const payable=Math.max(0,net);
  const refund=Math.max(0,-net);

  return(
    <div style={{paddingBottom:80}}>
      <Hdr title="VAT Manager" onBack={onBack} subtitle="NTA 2025, Chapter Four"/>
      <div className="pad-full" style={{paddingTop:12}}>
        <div className="ibox blue">
          <div className="ititle" style={{color:C.blue}}>VAT at 7.5% — due 21st of next month</div>
          <p style={{fontSize:12,color:C.ink,lineHeight:1.6}}>Net VAT = Output VAT (on your sales) minus Input VAT (on your qualifying purchases). Amounts below estimated from your transactions.</p>
        </div>
        <div className="card">
          <div className="ctitle">OUTPUT VAT (ON YOUR SALES)</div>
          <div className="fg"><label className="lbl">OUTPUT VAT COLLECTED (₦) — auto-estimated from transactions</label><input className="inp" type="number" value={output||Math.round(agg.vatOut)} onChange={e=>setOutput(parseFloat(e.target.value)||0)}/></div>
        </div>
        <div className="card">
          <div className="ctitle">INPUT VAT (ON YOUR PURCHASES)</div>
          <div className="fg"><label className="lbl">INPUT VAT PAID (₦) — on purchases with valid VAT invoices</label><input className="inp" type="number" value={input||Math.round(agg.vatIn)} onChange={e=>setInput(parseFloat(e.target.value)||0)}/></div>
          <div className="ibox amber"><p style={{fontSize:12,color:C.ink}}>Only input VAT backed by a valid VAT invoice from a registered supplier is deductible. Informal receipts do not qualify.</p></div>
        </div>
        <div style={{background:payable>0?C.redBg:C.greenBg,border:`2px solid ${payable>0?"#FECACA":C.greenBorder}`,borderRadius:14,padding:18,textAlign:"center",marginBottom:12}}>
          <div style={{fontSize:11,fontWeight:700,color:C.muted,marginBottom:4}}>{payable>0?"VAT PAYABLE":"VAT REFUND DUE"}</div>
          <div style={{fontSize:36,fontWeight:800,color:payable>0?C.red:C.green}}>{fmt(payable||refund)}</div>
          <div style={{fontSize:12,color:C.muted,marginTop:4}}>
            {payable>0?"Remit to NRS by 21st of next month":"Claim refund from NRS"}
          </div>
        </div>
        <div className="card">
          <DataRow label="Output VAT" value={fmt(ov)} color={C.red}/>
          <DataRow label="Less: Input VAT" value={`(${fmt(iv)})`} color={C.green}/>
          <DataRow label="NET VAT PAYABLE/(REFUND)" value={fmt(Math.abs(net))} color={payable>0?C.red:C.green} total={true}/>
        </div>
      </div>
    </div>
  );
}

GOVERNING LAWS: Nigeria Tax Act 2025 (No.3), Tax Administration Act 2025 (No.5), NRS Establishment Act 2025 (No.4), Joint Revenue Board Act 2025 (No.6).

── KEY TAX RATES & RULES ──
PIT: 0% on first ₦800k, then 15/18/21/23/25%. CRA abolished. Rent relief 20% max ₦500k. Min wage ≤₦70k/month fully exempt.
CIT: Small company (≤₦50M turnover + ≤₦250M assets + not professional services) = 0%. All others = 30% + 4% Dev Levy. Medium tier (20%) abolished.
VAT: 7.5% standard. Zero-rated: exports, medical goods, food, education, electricity. Exempt: petroleum, land, transport, EVs, securities, baby products.
WHT: 10% on professional/consulting/director fees/dividends/interest/rent/royalties/commission. 5% on contract/supply/construction. Remit by 21st.
PAYE: Employer deducts and remits by 10th. Salary NOT taxed again in self-assessment. PAYE credited against annual return.
CGT (NTA 2025 S.34–S.46):
CGT DETECTION — when a user mentions selling or disposing of: vehicle, car, land, property, building, shares, equipment, machinery, computer, furniture, crypto, NFT, digital asset — ALWAYS flag this as a potential CGT event. Ask:
1. What was the original acquisition cost?
2. Was Capital Allowance ever claimed on it (if so, use TWDV as cost base)?
3. Is this a personal vehicle or principal residence? (may be exempt)
4. Are the proceeds being reinvested in a Nigerian company? (full exemption)
5. For shares: what were total share disposal proceeds this year?
Direct the user to Calculator > Cap. Gains tab. Never treat asset disposal proceeds as ordinary income without checking CGT first.
INDIVIDUALS — gains taxed at progressive PIT rates (0–25%), NOT flat 10%. Gain added on top of other income to determine band. ₦50m general exemption threshold (gain ≤₦50m = 0%). EXEMPT: principal private residence; up to 2 personal vehicles; personal chattels with proceeds ≤₦5m; share disposals where total proceeds in year ≤₦150m AND gain ≤₦10m; gains reinvested in a Nigerian company (full exemption).
COMPANIES — CGT at 30% (aligned with CIT). Small companies (turnover ≤₦100m AND fixed assets ≤₦250m, NOT professional services) = 0% CGT. Professional services firms = 30% regardless of size.
COST BASE: if Capital Allowance was ever claimed on asset → cost base = TWDV (NOT original cost). If no CA claimed → original acquisition cost.
CHARGEABLE ASSETS (expanded): land, buildings, shares (listed & unlisted), options, rights, debts, digital/virtual assets (crypto, NFTs, tokens), incorporeal property — ALL taxable.
INDIRECT TRANSFERS: disposing of shares in an offshore holding company that owns Nigerian assets triggers Nigerian CGT [S.46] — subject to treaty exemptions.
REINVESTMENT EXEMPTION: if disposal proceeds reinvested in a Nigerian company → full CGT exemption on the entire gain [S.34].
SHARES THRESHOLD raised from ₦100m to ₦150m proceeds (12 months) with ₦10m gain cap [S.45]. Exceeding either = fully taxable.
CGT filing deadline: 31 March of the following year. Late payment: CBN MPR+15% (~41.75% p.a.) interest.
Capital Allowance: Straight-line only. Buildings/masts/agric/heavy plant = 10%. Plant/furniture/mining = 20%. Vehicles/software/intangibles = 25%. 1% residual retained. IA abolished.
Penalties: Individual ₦50k first month + ₦25k/month. Company ₦250k + ₦50k/month. Interest: CBN MPR + 15% ≈ 41.75% p.a.

── INDIVIDUAL PERSONAL RELIEF DEDUCTIONS — Section 30(2)(a) NTA 2025 ──
These 6 deductions reduce chargeable income for ALL individuals (salaried AND self-employed):
1. NHF Contributions — 2.5% of basic salary [S.30(2)(a)(i)]
2. NHIS Contributions — full amount paid [S.30(2)(a)(ii)]
3. Pension — employee's 8% of (basic+housing+transport) ONLY; employer 10% excluded [S.30(2)(a)(iii)]
4. Housing Loan Interest — ONLY interest on loan for owner-occupied home; principal is NOT deductible [S.30(2)(a)(iv)]
5. Life Insurance Premiums — own/spouse life or deferred annuity [S.30(2)(a)(v)]
6. Rent Relief — 20% of annual rent paid, MAXIMUM ₦500,000 [S.30(2)(a)(vi)] — replaces old CRA
Formula: Chargeable Income = Total Income − (all applicable deductions above)
First ₦800,000 of chargeable income = 0% (tax-free band)

── ALLOWABLE DEDUCTIONS (Tax) — NTA 2025 Sec 20–27 ──
FULLY ALLOWABLE (deductible from assessable profit):
✓ Salaries, wages, bonuses — if wholly and exclusively for business
✓ Rent of business premises
✓ Cost of goods sold / direct production costs
✓ Repairs and maintenance of business assets
✓ Professional fees (legal, audit, consultancy) for business purposes
✓ Insurance premiums on business assets and liabilities
✓ Bank charges and interest on business loans (not capital repayments)
✓ Utilities (electricity, water, internet) for business use
✓ Marketing and advertising expenses
✓ Staff training and development costs
✓ Pension contributions (employer portion — 10% statutory minimum)
✓ Capital Allowance (replaces accounting depreciation — at statutory CA rates)
✓ Bad debts written off (if previously included in assessable income)
✓ Subscriptions to professional bodies relevant to the business
✓ Motor vehicle running costs (fuel, maintenance) — business proportion only
✓ Stationery, office supplies, postage
✓ Travelling expenses — wholly for business purposes
✓ Research and development costs
✓ Donations to approved bodies (with limits)

── NON-ALLOWABLE DEDUCTIONS (Tax) — NTA 2025 Sec 22 ──
✗ Loan/debt CAPITAL repayments — only interest is deductible, NOT principal
✗ Accounting depreciation — replaced by Capital Allowance (add back, deduct CA instead)
✗ Capital expenditure (purchase of assets) — goes to asset register, not P&L deduction
✗ Personal expenses of proprietor/directors mixed with business
✗ Fines and penalties (tax penalties, traffic fines, regulatory fines)
✗ Dividends paid to shareholders
✗ Income tax paid (CIT, PIT — not deductible against taxable profit)
✗ Drawings by sole traders/partners
✗ Entertainment expenses that are not wholly business-related
✗ Excessive management fees paid to related parties (subject to transfer pricing)
✗ Political donations or contributions to political parties
✗ Life insurance premiums for directors/owners (unless term policy for business continuity)
✗ Provisions not yet crystallised (e.g. general provisions for bad debts)
✗ Pre-trading/pre-incorporation expenses (unless specifically approved)
✗ Expenses not wholly and exclusively for business purposes
✗ Expenses on which VAT or import duty is outstanding (non-deductible until VAT is settled — NTA 2025)

── SELF-EMPLOYED / FREELANCER EXPENSE RULE ──
Test: expenses must be WHOLLY AND EXCLUSIVELY incurred to generate business income.
Mixed-use expenses (fuel, phone, home office used partly for personal use): ONLY the business proportion is deductible. User must confirm the split. Never assume 100% business use.
Personal drawings/withdrawals by sole traders are NOT salary and are NOT deductible.

── ACCOUNTING vs TAX TREATMENT — KEY DIFFERENCES ──
• Loan repayment: Accounting = reduce liability (balance sheet). Tax = NOT deductible. Only interest expense is deductible.
• Asset purchase: Accounting = capitalise and depreciate. Tax = capitalise and claim Capital Allowance at statutory rates.
• Depreciation: Accounting = P&L charge. Tax = ADD BACK to profit, deduct CA instead.
• Prepayments: Accounting = defer to matching period. Tax = generally deductible when incurred.
• Accruals: Accounting = recognise when incurred. Tax = deductible when paid (cash basis for some).
• Provisions: Accounting = recognise estimated liabilities. Tax = only deductible when crystallised.

── TRANSACTION SUMMARY ──
TAXPAYER PROFILE: ${JSON.stringify({name:profile.name,mode:profile.mode,category:profile.empCategory,company:profile.companyName,sector:profile.sector})}
Income: ₦${agg.income.toLocaleString()} | Expenses: ₦${agg.expenses.toLocaleString()} | VAT est: ₦${Math.round(agg.vatPayable).toLocaleString()} | WHT: ₦${Math.round(agg.whtOut).toLocaleString()}

- Cite specific NTA 2025 section numbers
- Use ₦ for amounts
- Keep answers concise — 4-6 sentences unless a detailed breakdown is needed

          messages:newMsgs.map(m=>({role:m.role==="assistant"?"assistant":"user",content:m.text}))

function TaxSummaryScreen({txns,profile,onNav,onBack}){
  const agg=computeAggregates(txns);
  const isCompany=profile.mode==="company";
  const flags=txns.filter(t=>{const r=classifyTxn(t.desc,t.type);return r.compliance_required&&t.compliance_status!=="done"&&t.compliance_status!=="waived";});
  const today=new Date().toISOString().split("T")[0];
  const period=new Date().toLocaleDateString("en-NG",{month:"long",year:"numeric"});
  const entity=profile.companyName||profile.name||"Taxpayer";

  function buildCSV(key, lines){
    const META={
      whtOut:{title:"WHT Remittance Schedule",law:"NTA 2025 Ch.Two Pt.IV — Sec 28",due:"21st of next month",note:"WHT deducted from payments made — remit to NRS"},
      whtIn: {title:"WHT Credit Schedule",    law:"NTA 2025 Ch.Two Pt.IV — Sec 28",due:"Offset on annual return",note:"WHT deducted from income by payers"},
      vatOut:{title:"Output VAT Schedule",    law:"NTA 2025 Ch.Four — Sec 54",     due:"21st of next month",note:"VAT charged on taxable supplies"},
      vatIn: {title:"Input VAT Schedule",     law:"NTA 2025 Ch.Four — Sec 59",     due:"Deductible from output VAT",note:"VAT on qualifying purchases"},
      payeOut:{title:"PAYE Remittance Schedule",law:"TAA 2025 Sec 13",             due:"10th of next month",note:"PAYE deducted from staff salaries"},
      payeIn:     {title:"PAYE Credit Schedule",      law:"TAA 2025 Sec 13",              due:"Credit on annual PIT return",note:"PAYE deducted by employer"},
      cgtEvents:  {title:"CGT Events — Asset Disposals",law:"NTA 2025 S.34-S.46",           due:"31 March following year",    note:"Possible Capital Gains Tax transactions"},
    };
    const m=META[key]||{title:key,law:"NTA 2025",due:"",note:""};
    const grossTotal=lines.reduce((s,l)=>s+l.gross,0);
    const taxTotal=lines.reduce((s,l)=>s+l.tax,0);
    const netTotal=lines.reduce((s,l)=>s+(l.net||l.gross-l.tax),0);

    const hdr=[
      `"${m.title}"`,
      `"Entity: ${entity}"`,
      `"Period: ${period}"`,
      `"Generated: ${today}"`,
      `"Law: ${m.law}"`,
      `"Due Date: ${m.due}"`,
      `"Note: ${m.note}"`,
      `""`,
      `"Date","Description","Gross Amount (₦)","Tax Rate","Tax Amount (₦)","Net Amount (₦)","Status","Law Reference"`,
    ];
    const rows=lines.map(l=>[
      `"${l.date}"`,
      `"${(l.desc||"").replace(/"/g,"'")}"`,
      l.gross.toFixed(2),
      `"${l.rate||""}"`,
      l.tax.toFixed(2),
      (l.net||l.gross-l.tax).toFixed(2),
      `"${l.status||"posted"}"`,
      `"${l.law||m.law}"`,
    ].join(","));
    const totRow=[`"TOTALS","",${grossTotal.toFixed(2)},"",${taxTotal.toFixed(2)},${netTotal.toFixed(2)},"",""`];
    return [...hdr,...rows,...totRow].join("\n");
  }

  function downloadCSV(key){
    const lines=agg.schedules[key]||[];
    const csv=buildCSV(key,lines);
    const blob=new Blob([csv],{type:"text/csv"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download=`TaxWise_${key}_${today}.csv`; a.click();
    URL.revokeObjectURL(url);
  }

  function downloadAll(){
    const keys=isCompany
      ?["whtOut","whtIn","vatOut","vatIn","payeOut","cgtEvents"]
      :["whtIn","vatIn","payeIn","cgtEvents"];
    const sections=keys.map(k=>{
      const lines=agg.schedules[k]||[];
      return buildCSV(k,lines);
    });
    const combined=[
      `"TaxWise Nigeria — Combined Tax Schedules"`,
      `"Entity: ${entity}"`,
      `"Period: ${period}"`,
      `"Generated: ${today}"`,
      `"Nigeria Tax Act 2025 (No.3) · Tax Administration Act 2025 (No.5)"`,
      `""`,
      ...sections.flatMap(s=>[s,`""`,`"─────────────────────────────────────────────"`,`""`]),
    ].join("\n");
    const blob=new Blob([combined],{type:"text/csv"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download=`TaxWise_AllSchedules_${today}.csv`; a.click();
    URL.revokeObjectURL(url);
  }

  const TaxRow=({label,taxAmount,grossAmount,schedKey,color,note,total})=>(
    <div style={{
      display:"flex",justifyContent:"space-between",alignItems:"flex-start",
      padding:"10px 0",borderBottom:`1px solid ${C.border}`,
    }}>
      <div style={{flex:1,cursor:schedKey?"pointer":"default"}} onClick={()=>schedKey&&onNav("schedule_"+schedKey)}>
        <div style={{fontSize:13,color:total?C.ink:C.slate,fontWeight:total?700:400}}>{label}</div>
        {grossAmount>0&&<div style={{fontSize:10,color:C.muted,marginTop:1}}>Gross: {fmt(grossAmount)}</div>}
        {note&&<div style={{fontSize:10,color:C.muted,marginTop:1}}>{note}</div>}
        {schedKey&&<div style={{fontSize:9,color:C.blue,marginTop:2}}>↗ tap to view full schedule</div>}
      </div>
      <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:4,flexShrink:0,marginLeft:8}}>
        <div style={{fontSize:total?15:13,fontWeight:total?800:700,color:color||C.ink}}>{fmt(taxAmount)}</div>
        {schedKey&&(
          <button onClick={e=>{e.stopPropagation();downloadCSV(schedKey);}}
            style={{padding:"3px 8px",fontSize:9,fontWeight:700,borderRadius:6,border:`1px solid ${C.border}`,
              background:"#F8FAFC",color:C.slate,cursor:"pointer",fontFamily:"inherit",whiteSpace:"nowrap"}}>
            ⬇ CSV
          </button>
        )}
      </div>
    </div>
  );

  const SchedCard=({schedKey,title,subtitle,color,icon,due,law})=>{
    const lines=agg.schedules[schedKey]||[];
    const taxTotal=lines.reduce((s,l)=>s+l.tax,0);
    const grossTotal=lines.reduce((s,l)=>s+l.gross,0);
    const pending=lines.filter(l=>l.status==="pending").length;
    return(
      <div style={{background:"#fff",border:`1px solid ${C.border}`,borderRadius:12,padding:"13px 14px",marginBottom:8,
        borderLeft:`3px solid ${color}`}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
          <div style={{flex:1,minWidth:0}}>
            <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:2}}>
              <span style={{fontSize:14}}>{icon}</span>
              <span style={{fontSize:12,fontWeight:700,color:C.ink}}>{title}</span>
              {pending>0&&<span style={{fontSize:9,background:C.amberBg,color:C.amber,padding:"1px 6px",borderRadius:100,fontWeight:700}}>{pending} pending</span>}
            </div>
            <div style={{fontSize:10,color:C.muted}}>{subtitle}</div>
            <div style={{fontSize:9,color:C.muted,marginTop:1}}>{law} · Due: {due}</div>
          </div>
          <div style={{textAlign:"right",flexShrink:0,marginLeft:8}}>
            <div style={{fontSize:16,fontWeight:800,color}}>{fmt(taxTotal)}</div>
            <div style={{fontSize:9,color:C.muted,marginTop:1}}>{lines.length} txn{lines.length!==1?"s":""} · gross {fmt(grossTotal)}</div>
          </div>
        </div>
        <div style={{display:"flex",gap:6}}>
          <button onClick={()=>onNav("schedule_"+schedKey)}
            style={{flex:1,padding:"7px",fontSize:11,fontWeight:700,borderRadius:8,border:`1.5px solid ${C.blueBorder}`,
              background:C.blueLight,color:C.blue,cursor:"pointer",fontFamily:"inherit"}}>
            View Schedule ↗
          </button>
          <button onClick={()=>downloadCSV(schedKey)}
            style={{flex:1,padding:"7px",fontSize:11,fontWeight:700,borderRadius:8,border:`1.5px solid ${C.border}`,
              background:"#F8FAFC",color:C.slate,cursor:"pointer",fontFamily:"inherit"}}>
            ⬇ Download CSV
          </button>
        </div>
      </div>
    );
  };

  const totalDue=agg.vatPayable+agg.whtOut+agg.payeOut+(isCompany?agg.estCIT:0);

  return(
    <div style={{paddingBottom:80}}>
      <Hdr title="Tax Reports" onBack={onBack}
        right={
          <button onClick={downloadAll}
            style={{padding:"6px 12px",fontSize:11,fontWeight:700,borderRadius:8,
              border:`1.5px solid ${C.blueBorder}`,background:C.blueLight,color:C.blue,
              cursor:"pointer",fontFamily:"inherit",whiteSpace:"nowrap"}}>
            ⬇ All
          </button>
        }/>

      {/* Hero */}
      <div style={{background:`linear-gradient(135deg,${C.navy},#1E3A5F)`,padding:"18px 16px 22px",color:"#fff"}}>
        <div style={{fontSize:10,opacity:.6,letterSpacing:".1em",marginBottom:4,fontWeight:700}}>
          TOTAL TAX OBLIGATIONS · {period.toUpperCase()}
        </div>
        <div style={{fontSize:36,fontWeight:800,letterSpacing:"-.02em"}}>{fmt(totalDue)}</div>
        <div style={{fontSize:11,opacity:.6,marginTop:2}}>{entity} · {txns.length} transactions</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6,marginTop:14}}>
          {[
            {l:"WHT",  v:fmt(agg.whtOut),    c:"#F87171"},
            {l:"VAT",  v:fmt(agg.vatPayable), c:"#FCA5A5"},
            {l:"PAYE", v:fmt(isCompany?agg.payeOut:agg.payeIn), c:"#93C5FD"},
          ].map(s=>(
            <div key={s.l} style={{background:"rgba(255,255,255,.1)",borderRadius:8,padding:"8px 10px"}}>
              <div style={{fontSize:9,opacity:.6,letterSpacing:".06em",marginBottom:2}}>{s.l}</div>
              <div style={{fontSize:14,fontWeight:700,color:s.c}}>{s.v}</div>
            </div>
          ))}
        </div>
        <button onClick={downloadAll}
          style={{marginTop:12,width:"100%",padding:"10px",background:"rgba(255,255,255,.15)",
            border:"1px solid rgba(255,255,255,.3)",borderRadius:9,color:"#fff",
            fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
          ⬇ Download All Schedules (Combined CSV)
        </button>
      </div>

      <div style={{padding:"12px 12px 0"}}>

        {/* ── DOWNLOADABLE SCHEDULES HUB ─── */}
        <div style={{fontSize:10,fontWeight:700,letterSpacing:".1em",color:C.muted,marginBottom:8,marginTop:4}}>WITHHOLDING TAX</div>
        <SchedCard schedKey="whtOut" icon="📋"
          title="WHT Remittance Schedule"
          subtitle="WHT you must deduct from payments & remit"
          color={C.red} due="21st of next month"
          law="NTA 2025 Ch.Two Pt.IV"/>
        <SchedCard schedKey="whtIn" icon="✅"
          title="WHT Credit Schedule"
          subtitle="WHT deducted from your income by payers"
          color={C.green} due="Offset on annual return"
          law="NTA 2025 Ch.Two Pt.IV"/>

        <div style={{fontSize:10,fontWeight:700,letterSpacing:".1em",color:C.muted,marginBottom:8,marginTop:14}}>VALUE ADDED TAX</div>
        <SchedCard schedKey="vatOut" icon="🧾"
          title="Output VAT Schedule"
          subtitle="VAT charged on your taxable supplies"
          color={C.amber} due="21st of next month"
          law="NTA 2025 Ch.Four Sec 54"/>
        <SchedCard schedKey="vatIn" icon="🟢"
          title="Input VAT Schedule"
          subtitle="VAT on qualifying purchases — deductible"
          color={C.green} due="Netted against output VAT"
          law="NTA 2025 Ch.Four Sec 59"/>

        <div style={{fontSize:10,fontWeight:700,letterSpacing:".1em",color:C.muted,marginBottom:8,marginTop:14}}>PAYE</div>
        {isCompany?(
          <SchedCard schedKey="payeOut" icon="👥"
            title="PAYE Remittance Schedule"
            subtitle="PAYE deducted from staff salaries"
            color={C.blue} due="10th of next month"
            law="TAA 2025 Sec 13"/>
        ):(
          <SchedCard schedKey="payeIn" icon="💼"
            title="PAYE Credit Schedule"
            subtitle="PAYE your employer deducted from your salary"
            color={C.green} due="Offset on annual PIT return"
            law="TAA 2025 Sec 13"/>
        )}

        <div style={{fontSize:10,fontWeight:700,letterSpacing:".1em",color:C.muted,marginBottom:8,marginTop:14}}>CAPITAL GAINS TAX</div>
        <SchedCard schedKey="cgtEvents" icon="📊"
          title="CGT Events — Asset Disposals"
          subtitle="Possible CGT transactions — use CGT Calculator to compute tax due"
          color="#7C3AED" due="31 March following year"
          law="NTA 2025 S.34-S.46"/>

        {/* ── SUMMARY FIGURES ── */}
        <div style={{fontSize:10,fontWeight:700,letterSpacing:".1em",color:C.muted,marginBottom:8,marginTop:16}}>TAX POSITION SUMMARY</div>

        <div className="card">
          <div className="ctitle">WITHHOLDING TAX — NTA 2025 Ch. Two Pt. IV</div>
          <TaxRow label="WHT to deduct & remit" taxAmount={agg.whtOut}
            grossAmount={txns.filter(t=>classifyTxn(t.desc,t.type).head.startsWith("WHT-out")).reduce((s,t)=>s+t.amount,0)}
            schedKey="whtOut" color={C.red} note="Due 21st of next month"/>
          <TaxRow label="WHT credits on your income" taxAmount={agg.whtIn}
            schedKey="whtIn" color={C.green} note="Deducted by payers — offset against tax liability"/>
          <TaxRow label="NET WHT position" taxAmount={Math.abs(agg.whtOut-agg.whtIn)}
            color={agg.whtOut>agg.whtIn?C.red:C.green}
            note={agg.whtOut>agg.whtIn?"Net payable":"Net credit"} total/>
        </div>

        <div className="card">
          <div className="ctitle">VALUE ADDED TAX — NTA 2025 Ch. Four</div>
          <TaxRow label="Output VAT (on your sales)" taxAmount={agg.vatOut}
            grossAmount={txns.filter(t=>classifyTxn(t.desc,t.type).head.includes("VAT")).reduce((s,t)=>s+t.amount,0)}
            schedKey="vatOut" color={C.red} note="VAT charged to customers"/>
          <TaxRow label="Input VAT (on purchases)" taxAmount={agg.vatIn}
            schedKey="vatIn" color={C.green} note="VAT on qualifying purchases — deductible"/>
          <TaxRow label="NET VAT PAYABLE" taxAmount={agg.vatPayable}
            color={C.red} note="Due 21st of next month · Remit to NRS" total/>
          {agg.vatRefund>0&&<TaxRow label="VAT REFUND DUE" taxAmount={agg.vatRefund} color={C.green} total/>}
        </div>

        <div className="card">
          <div className="ctitle">PAYE — TAA 2025 Sec 13</div>
          {isCompany?(
            <TaxRow label="PAYE on staff salaries" taxAmount={agg.payeOut}
              grossAmount={txns.filter(t=>classifyTxn(t.desc,t.type).head==="PAYE-out").reduce((s,t)=>s+t.amount,0)}
              schedKey="payeOut" color={C.red} note="Due 10th of next month · Remit to State IRS" total/>
          ):(
            <TaxRow label="PAYE deducted from your salary" taxAmount={agg.payeIn}
              schedKey="payeIn" color={C.green} note="Employer deducted — credit on your annual return" total/>
          )}
        </div>

        {isCompany&&(
          <div className="card">
            <div className="ctitle">COMPANIES INCOME TAX — NTA 2025 Sec 56</div>
            <TaxRow label="Net profit (income − expenses)" taxAmount={Math.max(0,agg.net)} color={C.slate}/>
            <TaxRow label="Estimated CIT (30%)" taxAmount={agg.estCIT} color={C.blue} note="Annual · File 6 months after year-end" total/>
          </div>
        )}

        {/* Compliance gaps */}
        {flags.length>0&&(
          <div className="card">
            <div className="ctitle">⚠ COMPLIANCE GAPS ({flags.length})</div>
            <p style={{fontSize:12,color:C.amber,marginBottom:10,lineHeight:1.5}}>Transactions with outstanding compliance obligations:</p>
            {flags.slice(0,5).map((t,i)=>(
              <div key={i} style={{padding:"8px 0",borderBottom:`1px solid ${C.border}`,fontSize:12}}>
                <div style={{fontWeight:600,color:C.ink}}>{t.desc}</div>
                <div style={{color:C.muted,marginTop:1}}>{fmtD(t.date)} · {fmt(t.amount)} · <span style={{color:C.amber}}>{t.compliance_status||"not set"}</span></div>
              </div>
            ))}
          </div>
        )}

        <div style={{fontSize:10,color:C.muted,textAlign:"center",lineHeight:1.8,marginTop:4,marginBottom:8}}>
          All figures computed from transaction data · NTA 2025 (No.3) · TAA 2025 (No.5){"\n"}
          Tap "⬇ All" at top right to download all schedules in one file
        </div>
      </div>
    </div>
  );
}
